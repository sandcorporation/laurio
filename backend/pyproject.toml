[project]
name = "laurio-backend"
version = "0.1.0"
description = "Laurio — 공개 공모전 플랫폼 backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "bleach>=6.4.0",
    "cryptography>=50.0.1",
    "boto3>=1.43.82",
    "django>=5.2,<6.0",
    "django-ninja>=1.3",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "celery>=5.4",
    "requests>=2.32",
    # staging/prod 배포용 WSGI 서버(#23). `manage.py runserver`는 Django 자신이 문서화한
    # 대로 개발 전용이라 dev compose에서만 쓴다.
    "gunicorn>=23.0.0",
]

[tool.uv]
# 배포 가능한 패키지가 아니라 의존성 묶음이다. 빌드 백엔드가 필요 없다.
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q"
