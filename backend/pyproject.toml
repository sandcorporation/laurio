[project]
name = "laurio-backend"
version = "0.1.0"
description = "Laurio — 공개 공모전 플랫폼 backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "bleach>=6.4.0",
    "cryptography>=50.0.1",
    "boto3>=1.43.82",
    "django>=5.2,<6.0",
    "django-ninja>=1.3",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "celery>=5.4",
    "requests>=2.32",
    # staging/prod 배포용 WSGI 서버(#23). `manage.py runserver`는 Django 자신이 문서화한
    # 대로 개발 전용이라 dev compose에서만 쓴다.
    "gunicorn>=23.0.0",
    # DEBUG=False(staging/prod)에서는 Django 자신이 정적 파일을 서빙하지 않는다 —
    # 이 저장소에 리버스 프록시(nginx 등)가 아직 없으므로, whitenoise가 WSGI 프로세스
    # 자신에게서 STATIC_ROOT를 직접 서빙한다. 그게 없으면 ADR-0002가 운영 백오피스로
    # 지정한 /admin/ 이 CSS/JS 없이 깨진 채로 뜬다(코디네이터 리뷰 지적 #23).
    "whitenoise>=6.7.0",
]

[tool.uv]
# 배포 가능한 패키지가 아니라 의존성 묶음이다. 빌드 백엔드가 필요 없다.
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q"
