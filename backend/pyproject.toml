[project]
name = "codemit-backend"
version = "0.1.0"
description = "Codemit — 공개 공모전 플랫폼 backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "bleach>=6.4.0",
    "cryptography>=50.0.1",
    "boto3>=1.43.82",
    "django>=5.2,<6.0",
    "django-ninja>=1.3",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    # celery[redis] 로 선언한다 — extra 없이 celery 만 넣으면 redis 트랜스포트
    # 드라이버가 설치되지 않아, redis:// 브로커를 쓰는 staging·prod 의 worker·beat 가
    # 붙지 못한다(#40). Operator 세션도 같은 패키지를 쓴다(#43).
    "celery[redis]>=5.4",
    "requests>=2.32",
    # 오류를 자체 GlitchTip 으로 보낸다(core/observability.py) — DSN 이 없으면 꺼진
    # 채로 돌므로 dev·CI 는 네트워크를 치지 않는다.
    "sentry-sdk>=2.30",
    # staging/prod 배포용 WSGI 서버(#23). `manage.py runserver`는 Django 자신이 문서화한
    # 대로 개발 전용이라 dev compose에서만 쓴다.
    "gunicorn>=23.0.0",
    # DEBUG=False(staging/prod)에서는 Django 자신이 정적 파일을 서빙하지 않는다 —
    # 이 저장소에 리버스 프록시(nginx 등)가 아직 없으므로, whitenoise가 WSGI 프로세스
    # 자신에게서 STATIC_ROOT를 직접 서빙한다. 그게 없으면 ADR-0002가 운영 백오피스로
    # 지정한 /admin/ 이 CSS/JS 없이 깨진 채로 뜬다(코디네이터 리뷰 지적 #23).
    "whitenoise>=6.7.0",
    # ContestImage 썸네일·본문용 webp 파생본을 만드는 스캔의 유일한 이미지 처리
    # 의존성이다(#235, ADR-0031/0032) — 이 저장소에 이미지 바이트를 다루는 코드가
    # 이전에는 없었다.
    "pillow>=12.3.0",
    # 이벤트 서비스(ADR-0046, #379)를 ASGI로 띄우는 유일한 서버다 — 기존 API는
    # 그대로 gunicorn(WSGI)이다. `config.asgi:application`은 이미 있던 파일을
    # 그대로 쓴다(코드가 하나뿐이다) — 이 의존성은 그것을 "어떻게 띄우는가"만
    # 더한다. `[standard]` extra가 `watchfiles`를 끌어와 dev compose의
    # `--reload`가 `runserver`처럼 코드 수정에 반응한다.
    "uvicorn[standard]>=0.34.0",
    # 강의실 문법 검사 기본 항목(#408/#409, CONTEXT.md 「문법 검사」)이 파이썬
    # 밖 주요 언어(JS·TS·Java·Go·C/C++·Kotlin·Ruby)의 구문 오류를 실행 없이
    # 확인하는 데 쓴다 — `classroom.syntax_check`만 부른다. backend·celery·
    # events가 같은 Dockerfile이라 셋 다 이 패키지를 받는다. 미리 빌드된
    # 문법(wheel)을 담은 `tree-sitter-language-pack`을 쓰는 이유는 grammar마다
    # 별도 패키지·C 컴파일러를 이미지에 두지 않기 위해서다(backend 이미지가
    # 약 12MB 커진다, #409).
    "tree-sitter>=0.26.0",
    "tree-sitter-language-pack>=1.20.0",
    # 공모전 검색 실물 어댑터(#450, `contests/search_opensearch.py`)의 유일한
    # 벤더 클라이언트다. fake 어댑터(`contests.search.FakeContestSearchAdapter`)는
    # 이 패키지 없이 DB만으로 돌아가므로 dev·CI 는 이 의존성을 네트워크로 쓰지
    # 않는다 — 실물 OpenSearch에 붙을 때만 TCP 를 연다.
    "opensearch-py>=2.8.0",
    "prometheus-client>=0.26.0",
    "aiohttp>=3.14.4",
]

[tool.uv]
# 배포 가능한 패키지가 아니라 의존성 묶음이다. 빌드 백엔드가 필요 없다.
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    # 스위트가 1000건을 넘어 한 프로세스로는 5분 넘게 걸린다. 이 스위트를 도는
    # 주체가 많아서(에이전트마다, 체인 검증마다, 머지 후, CI) 그 5분이 계속
    # 곱해진다. `-n` 을 주면 워커별로 테스트 DB가 따로 생기고(pytest-django),
    # 세션 Redis 도 tests/conftest.py 가 워커별로 갈라 준다.
    "pytest-xdist>=3.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
# live_vendor(#83, ADR-0007): 벤더를 실제로 치는 선택적 테스트. 기본 실행에서
# 제외한다 — 자격증명 없는 신선한 체크아웃이 이 때문에 빨개지면 안 된다.
# `-m live_vendor`로만 선택 실행한다(tests/live.py 참고).
# live_infra(#751): 실물 인프라(pgbouncer·Redis·OpenSearch)를 치는 선택적 테스트. 벤더가 아니라
# 로컬에 띄운 dev 프로필이 상대라 따로 둔다 — `-m live_vendor`(돈이 드는 실제 벤더)와 섞이지 않게.
markers = [
    "live_vendor: 실제 벤더(OpenAI·PortOne·Toss 등)를 치는 선택적 테스트. 기본 실행에서 제외된다.",
    "live_infra: 실물 인프라(pgbouncer·Redis·OpenSearch)를 치는 선택적 테스트. 기본 실행에서 제외된다.",
]
# 기본 병렬 실행. 이 스위트를 도는 주체가 많아서(에이전트마다, 머지 후, CI) 그 차이가
# 계속 곱해진다. 직렬로 보고 싶으면 `-n 0` 을 준다.
#
# **`auto` 를 쓴다** — 예전에는 못 썼다. 세션 캐시가 실물 Redis 였을 때는 워커마다 DB
# 인덱스를 하나씩 올려 줘야 했고(FLUSHDB 라 접두어로는 못 막는다) Redis 기본 범위
# 0~15 를 금방 넘겼다. 테스트 세션 캐시가 LocMem 이 되면서 그 제약이 통째로 사라졌다 —
# 프로세스가 갈리면 캐시도 갈린다. 실측(이 머신, 1192건): `-n 4` 84초 → `-n auto` 57초.
addopts = "-q -n auto -m \"not live_vendor and not live_infra\""
