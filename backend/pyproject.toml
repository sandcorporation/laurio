[project]
name = "laurio-backend"
version = "0.1.0"
description = "Laurio — 공개 공모전 플랫폼 backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "bleach>=6.4.0",
    "cryptography>=50.0.1",
    "boto3>=1.43.82",
    "django>=5.2,<6.0",
    "django-ninja>=1.3",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    # celery[redis] 로 선언한다 — extra 없이 celery 만 넣으면 redis 트랜스포트
    # 드라이버가 설치되지 않아, redis:// 브로커를 쓰는 staging·prod 의 worker·beat 가
    # 붙지 못한다(#40). Operator 세션도 같은 패키지를 쓴다(#43).
    "celery[redis]>=5.4",
    "requests>=2.32",
    # staging/prod 배포용 WSGI 서버(#23). `manage.py runserver`는 Django 자신이 문서화한
    # 대로 개발 전용이라 dev compose에서만 쓴다.
    "gunicorn>=23.0.0",
    # DEBUG=False(staging/prod)에서는 Django 자신이 정적 파일을 서빙하지 않는다 —
    # 이 저장소에 리버스 프록시(nginx 등)가 아직 없으므로, whitenoise가 WSGI 프로세스
    # 자신에게서 STATIC_ROOT를 직접 서빙한다. 그게 없으면 ADR-0002가 운영 백오피스로
    # 지정한 /admin/ 이 CSS/JS 없이 깨진 채로 뜬다(코디네이터 리뷰 지적 #23).
    "whitenoise>=6.7.0",
]

[tool.uv]
# 배포 가능한 패키지가 아니라 의존성 묶음이다. 빌드 백엔드가 필요 없다.
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    # 스위트가 1000건을 넘어 한 프로세스로는 5분 넘게 걸린다. 이 스위트를 도는
    # 주체가 많아서(에이전트마다, 체인 검증마다, 머지 후, CI) 그 5분이 계속
    # 곱해진다. `-n` 을 주면 워커별로 테스트 DB가 따로 생기고(pytest-django),
    # 세션 Redis 도 tests/conftest.py 가 워커별로 갈라 준다.
    "pytest-xdist>=3.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
# live_vendor(#83, ADR-0007): 벤더를 실제로 치는 선택적 테스트. 기본 실행에서
# 제외한다 — 자격증명 없는 신선한 체크아웃이 이 때문에 빨개지면 안 된다.
# `uv run pytest -m live_vendor`로만 선택 실행한다(tests/live.py 참고).
markers = [
    "live_vendor: 실제 벤더를 치는 선택적 테스트. 기본 실행에서 제외된다.",
]
# 기본 병렬 실행 — 직렬 5분 20초가 1분 47초가 된다(실측, 1085건). 이 스위트를 도는
# 주체가 많아서(에이전트마다, 체인 검증마다, 머지 후, CI) 그 차이가 계속 곱해진다.
# 워커별 테스트 DB 는 pytest-django 가, 세션 Redis 인덱스는 tests/conftest.py 가
# 갈라 준다. 직렬로 보고 싶으면 `-n 0` 을 준다.
#
# **`auto` 를 쓰지 않는다.** 그건 머신의 논리 코어 수(이 개발 머신은 14)를 잡는데,
# 세션 Redis 인덱스가 워커마다 하나씩 올라가 Redis 기본 범위(0~15)를 넘긴다 —
# conftest 의 가드가 그 자리에서 막는다. 4 는 그 범위 안에 넉넉히 들어가면서
# 공유 Postgres 를 과하게 물지 않는 값이다.
addopts = "-q -n 4 -m \"not live_vendor\""
