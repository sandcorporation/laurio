# production 스택 — AWS/Oracle을 타깃으로 한다(#23). staging(compose.staging.yaml)과
# 별도 파일이라 샌드박스 키·값이 여기 섞여 들어올 길이 없다.
#
#   docker compose -f docker/compose.prod.yaml --env-file docker/.env.prod \
#     up -d --build
#
# `docker/.env.prod` 는 `docker/prod.env.example` 을 복사해 채운, 절대 커밋하지 않는
# 파일이다(.gitignore 의 `.env.*` 규칙). `--env-file` 을 빠뜨리면 아래 `${VAR:?...}`
# 가드에 걸려 기동이 거부된다.
#
# 이 파일은 단일 VM에 docker compose로 그대로 올리는 것도 가능하지만, 실제로는
# ECS/OKE 등 관리형 오케스트레이터에 같은 환경변수 바인딩만 그대로 옮기는 참조
# 템플릿으로도 쓸 수 있게 설계했다 — `db` 서비스는 자체 호스팅 옵션일 뿐이고,
# 관리형 RDS/OCI DB를 쓸 경우 POSTGRES_HOST/POSTGRES_PORT 를 그 엔드포인트로 덮어쓴다.
#
# **이 스택은 지금 뜨지 않는다 — 의도된 상태다(#83, 사용자 결정).** staging과
# 같은 이유다(compose.staging.yaml 상단 주석 참고) — 본인확인(#85)·결제(#87)·
# Seller 등록(#57)·LLM 채점/AI grill(#88)의 `Real*` 클래스가 하나도 아직 없다.
#
# 어댑터 바인딩(ADR-0007, 한눈에 보기용 — 실제 값은 .env.prod):
#   PG        : FakePGAdapter        -> 토스 "실물"(dotted path, 아직 미구현 — #87)
#   지급대행   : FakePayoutAdapter     -> 토스 지급대행 실물(dotted path, 아직 미구현
#               — #82 라운드 2)
#   Seller 등록 : FakeSellerAdapter     -> 토스 지급대행 셀러 등록(dotted path, 아직
#               미구현 — #50/#57, Payout 확정 후에만 호출된다 — ADR-0020)
#   스토리지   : MinIO                -> 실제 S3/OCI 버킷        (STORAGE_BACKEND=s3)
#   소셜 로그인 : FakeSocialAdapter     -> 카카오/GitHub/구글 실물 (SOCIAL_AUTH_MODE=real)
#   본인확인   : FakeVerificationAdapter -> 실제 PortOne 통합인증 연동(dotted path,
#               아직 미구현 — #85)
#   LLM 채점   : FakeLLMScoringAdapter  -> 실제 OpenAI 어댑터(dotted path, 아직
#               미구현 — #88)
#   AI grill  : FakeRequirementChatAdapter -> contests.requirement_chat.
#               OpenAIRequirementChatAdapter(#55)
#   GitHub 저장소 : FakeGitHubAdapter    -> repositories.adapters.GitHubAPIAdapter(#193)
#   알림 채널  : Fake*Adapter           -> 실제 카카오 알림톡/SMS·LMS 벤더(dotted path로
#               지정, 아직 미구현 — .env.prod에서 반드시 채워야 하는 이유가 이것이다.
#               구현되지 않은 클래스 이름을 여기 하드코딩하지 않는다)
#   이벤트 버스 : FakeEventBus          -> core.events_redis.RedisEventBus(ADR-0046,
#               #380 — 강의실 실시간 신호. 이미 구현돼 있다)
# config/settings.py의 IS_DEPLOYED_ENVIRONMENT 가드가 이 중 하나라도 fake로 남으면
# (dotted path가 가리키는 클래스명이 Fake로 시작해도 마찬가지다) 부팅 자체를 거부한다 —
# staging과 동일한 가드지만, production은 추가로 IS_PRODUCTION_DEPLOYMENT 하드닝
# (HSTS·SSL 리다이렉트·secure 쿠키·강한 SECRET_KEY, `manage.py check --deploy`가 검증)
# 도 함께 켜진다. VERIFICATION_ADAPTER_MODE·PAYMENT_ADAPTER_MODE·PAYOUT_ADAPTER_MODE·
# SELLER_ADAPTER_MODE·LLM_ADAPTER_MODE·LLM_REQUIREMENT_CHAT_ADAPTER_MODE·
# GITHUB_ADAPTER_MODE(#193)·EVENT_BUS_ADAPTER_MODE(#380)는 그 값이
# "fake"도 아니고 실제로 쓸 수도 없으면(임포트·인스턴스화·계약 충족 중 하나라도
# 실패하면) 역시 부팅을 거부한다(#83, core.adapters.check_adapter_mode —
# django.core.checks로 등록되어 django.setup() 이후에만 평가된다). 그래서 실물
# 클래스가 없는 지금은 알림 채널과 같은 원칙으로 `${VAR:?...}`로 필수값으로 비워
# 둔다.
#
# 스케줄러(ADR-0003): redis 브로커 + celery-worker + celery-beat 세 서비스가 반드시
# 함께 떠야 한다 — compose.staging.yaml과 같은 이유(core/tasks.py, config/celery.py
# 참고). 이 셋이 없으면 Distribution/환불/Handover/알림/채점의 시간 기반 전이가
# 배포 직후부터 조용히 멈춘다(코디네이터 리뷰 지적).
#
# 이벤트 서비스(ADR-0046, #380): backend와 같은 이미지를 ASGI로 띄우는 별도
# 서비스(events)가 하나 더 떠야 강의실이 새로고침 없이 화면을 갱신한다 —
# 없어도 다른 기능은 모두 그대로 동작하고 강의실 화면만 폴링으로 물러난다.
name: codemit-prod

x-backend-env: &backend-env
  # --- 배포 타깃 ---
  # config/settings.py: production은 IS_DEPLOYED_ENVIRONMENT(fake 어댑터 금지)에
  # 더해 IS_PRODUCTION_DEPLOYMENT 하드닝(HSTS·SSL 리다이렉트·secure 쿠키·강한
  # SECRET_KEY)까지 적용받는다. `SECURE_PROXY_SSL_HEADER`가 X-Forwarded-Proto
  # 헤더를 신뢰하므로, 이 스택 앞단에는 반드시 TLS를 종단하는 신뢰할 수 있는
  # 로드밸런서/리버스 프록시를 둬야 한다 — 아래 backend 서비스의 ports: 를
  # 127.0.0.1에만 publish하는 이유가 이것이다(호스트 밖에서 직접 그 헤더를 위조해
  # SECURE_SSL_REDIRECT를 우회하고 secure 쿠키를 평문으로 받아낼 길을 원천적으로
  # 막는다). 관리형 오케스트레이터(ECS/OKE)로 옮기면 이 값 대신 그 앞단의 보안
  # 그룹/리스너 규칙이 같은 역할을 해야 한다.
  CODEMIT_DEPLOYMENT_TARGET: production
  DJANGO_DEBUG: "false"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?prod DJANGO_SECRET_KEY 를 .env.prod 에 설정하라 — 50자 이상, 고유 문자 5종 이상}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?prod DJANGO_ALLOWED_HOSTS 를 .env.prod 에 설정하라}
  # --- 오류 수집 (GlitchTip, 2026-09-16) ---
  # DSN 이 없으면 SDK 가 꺼진 채로 돈다(core/observability.py) — 그래서 `:-` 다.
  # 릴리스는 deploy.sh 가 배포하는 커밋 SHA 를 넘긴다.
  SENTRY_DSN: ${SENTRY_DSN_BACKEND:-}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}

  # 공모전 제품 스위치 — 「공모전 / 유료 공모전」 둘 (#271/#413, `core.contest_switch`,
  # ADR-0048). 기본값은 둘 다 켜짐(config/settings.py)이지만, prod 도 staging 처럼
  # **유료만** 이 기본을 꺼짐으로 겹쳐 쓴다: 돈을 다루지 않는 무료 공모전은 열고,
  # 결제·본인확인이 필요한 유료 경로는 운영하지 않는 채로 닫아 둔다(ADR-0048).
  # `.env.prod` 에 `CODEMIT_PAID_CONTEST_PRODUCT_ENABLED=true` 한 줄을 넣고
  # backend·frontend 를 재배포하면(frontend 는 아래 build.args 가 같은 줄을 읽어 굽는다)
  # 유료도 다시 켜진다. 닫히는 표면 목록은 `backend/core/contest_switch.py` 모듈 docstring.
  CODEMIT_CONTEST_PRODUCT_ENABLED: ${CODEMIT_CONTEST_PRODUCT_ENABLED:-true}
  CODEMIT_PAID_CONTEST_PRODUCT_ENABLED: ${CODEMIT_PAID_CONTEST_PRODUCT_ENABLED:-false}

  POSTGRES_DB: ${POSTGRES_DB:?prod POSTGRES_DB 를 .env.prod 에 설정하라}
  POSTGRES_USER: ${POSTGRES_USER:?prod POSTGRES_USER 를 .env.prod 에 설정하라}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?prod POSTGRES_PASSWORD 를 .env.prod 에 설정하라}
  POSTGRES_HOST: ${POSTGRES_HOST:-db}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}

  # --- 스토리지 어댑터 (ADR-0005, ADR-0007): 실제 S3/OCI 버킷 ---
  STORAGE_BACKEND: s3
  STORAGE_BUCKET: ${STORAGE_BUCKET:?}
  STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:?}
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?}
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?}
  STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
  # 공개 이미지 버킷 (#233, ADR-0032) — 소스가 사는 위 버킷과 물리적으로 분리된다.
  STORAGE_IMAGES_BUCKET: ${STORAGE_IMAGES_BUCKET:?}
  STORAGE_IMAGES_BASE_URL: ${STORAGE_IMAGES_BASE_URL:?}

  # --- Authentication (ADR-0012 — 세 보완책 중 하나. sanitize·CSP는 코드 경로라
  # 이 compose 파일이 바꿀 수 없고, 여기서는 짧은 액세스 토큰 수명·회전형
  # 리프레시 토큰이라는 세 번째 보완책의 서명 키만 주입한다) ---
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?}

  # --- 소셜 로그인 / 본인확인 어댑터 (ADR-0007, ADR-0011, ADR-0024) ---
  SOCIAL_AUTH_MODE: real
  # 카카오 OAuth 앱 자격증명(#95/#96) — staging의 x-backend-env 앵커와 같은
  # 이유·같은 구조다(docker/compose.staging.yaml 참고). authorize
  # 리다이렉트・code→token 교환은 frontend 서비스(BFF)가 지므로 이 값들을
  # 실제로 쓰는 건 backend가 아니라 frontend다.
  KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:?prod KAKAO_REST_API_KEY 를 .env.prod 에 설정하라}
  KAKAO_SECRET_KEY: ${KAKAO_SECRET_KEY:?prod KAKAO_SECRET_KEY 를 .env.prod 에 설정하라}
  KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:?prod KAKAO_REDIRECT_URI 를 .env.prod 에 설정하라 — 카카오 콘솔에 등록한 값과 정확히 같아야 한다}
  # 실물 PortOne V2 통합인증 어댑터가 #85로 생겼다 — "real"은 dotted path가
  # 아니라 부팅이 통과하고 첫 본인확인 요청에서야 죽었다(#83이 고친 버그).
  # 여기는 verification.adapters.PortOneV2VerificationAdapter를 채운다.
  # staging과 같은 값을 쓰되 자격증명은 다르다(벤더 계정 자체가 다르다). 카카오는
  # CI를 안 줘서 인증 수단에서 뺐다(ADR-0024) — 코드는 그 설정이 되돌려져도
  # VerificationMissingCIError로 안전하다.
  VERIFICATION_ADAPTER_MODE: ${VERIFICATION_ADAPTER_MODE:?verification.adapters.PortOneV2VerificationAdapter를 .env.prod 에 채워라(#85)}
  VERIFICATION_ENCRYPTION_KEY: ${VERIFICATION_ENCRYPTION_KEY:?}
  # PortOneV2VerificationAdapter의 서버-투-서버 조회 자격증명 — staging과 같은
  # 이유(compose.staging.yaml 참고)로 프로덕션 벤더 계정 값을 별도로 준다.
  PORT_ONE_V2_STORE_ID: ${PORT_ONE_V2_STORE_ID:?}
  PORT_ONE_V2_SECRET_KEY: ${PORT_ONE_V2_SECRET_KEY:?}

  # --- 결제 · Escrow / Payout 어댑터 (ADR-0007, ADR-0008): 토스 "실물" ---
  # 결제는 payments.adapters_toss.TossPGAdapter(#87), 지급대행/Seller 등록은
  # payouts.adapters_toss.TossPayoutAdapter/TossSellerAdapter(#57)를 dotted
  # path로 채운다 — 위 VERIFICATION_ADAPTER_MODE와 같은 이유로 필수값으로
  # 비워 둔다.
  PAYMENT_ADAPTER_MODE: ${PAYMENT_ADAPTER_MODE:?실제 PG 어댑터의 dotted path를 .env.prod 에 채워라 — 아직 구현 전이면(#87) 이 값 자체를 비워 둘 수 없다}
  PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?}
  PAYOUT_ADAPTER_MODE: ${PAYOUT_ADAPTER_MODE:?실제 지급대행 어댑터의 dotted path를 .env.prod 에 채워라 — 아직 구현 전이면 이 값 자체를 비워 둘 수 없다}
  PAYOUT_WEBHOOK_SECRET: ${PAYOUT_WEBHOOK_SECRET:?}
  # Seller(수취인) 등록은 지급과 별개 API·별개 시점이다(#50, ADR-0020) — Payout이
  # 확정된 뒤에만 호출된다.
  SELLER_ADAPTER_MODE: ${SELLER_ADAPTER_MODE:?실제 Seller 등록 어댑터의 dotted path를 .env.prod 에 채워라 — 아직 구현 전이면(#57) 이 값 자체를 비워 둘 수 없다}
  TOSS_LIVE_SECRET_KEY: ${TOSS_LIVE_SECRET_KEY:-}
  # 셀러 등록·수정·지급 요청 세 API의 JWE 암호화 + payout.changed/
  # seller.changed 웹훅 서명 검증에 쓰는 보안 키(#57) — TOSS_LIVE_SECRET_KEY와
  # 별개 값이다.
  TOSS_API_SECURE_KEY: ${TOSS_API_SECURE_KEY:-}

  # --- LLM 채점 · AI grill 어댑터 (ADR-0006/0007/0014) ---
  # AI 채점의 실물 어댑터는 scoring.adapters.OpenAIScoringAdapter다(#88) —
  # LLM_ADAPTER_MODE를 그 dotted path로 채운다. "real"은 dotted path가 아니라
  # core.adapters.check_adapter_mode(#83)가 부팅 시점에 거부한다. AI grill의
  # 실물 어댑터는 contests.requirement_chat.OpenAIRequirementChatAdapter다(#55)
  # — 채점과 같은 OPEN_AI_API_KEY를 공유하지만 설정 키는 별개다. 위와 같은
  # 이유로 값을 명시적으로 요구한다.
  LLM_ADAPTER_MODE: ${LLM_ADAPTER_MODE:?실제 LLM 채점 어댑터의 dotted path를 .env.prod 에 채워라 — scoring.adapters.OpenAIScoringAdapter(#88)}
  # 강의실 채점(#287, #340)은 이 값과 별개다 — classroom.scoring이 강사 본인의
  # 키로 어댑터를 직접 만들고, 이 설정은 그 경로가 fake를 쓸지 실물을 쓸지만
  # 가른다(ADR-0043). staging의 x-backend-env 앵커와 같은 이유로 필수값이다.
  CLASSROOM_SCORING_ADAPTER_MODE: ${CLASSROOM_SCORING_ADAPTER_MODE:?강의실 채점 어댑터의 dotted path를 .env.prod 에 채워라 — core.llm_scoring.OpenAIScoringAdapter(#340)}
  LLM_REQUIREMENT_CHAT_ADAPTER_MODE: ${LLM_REQUIREMENT_CHAT_ADAPTER_MODE:?실제 AI grill 어댑터의 dotted path를 .env.prod 에 채워라 — contests.requirement_chat.OpenAIRequirementChatAdapter(#55)}
  OPEN_AI_API_KEY: ${OPEN_AI_API_KEY:-}
  # scoring.adapters.OpenAIScoringAdapter가 읽는 선택 설정(#88 코드리뷰 지적 6)
  # — 여기 없으면 컨테이너 안에서는 항상 기본값(모델 gpt-4o-mini, temperature
  # 0)으로 고정되고 .env.prod에 무엇을 채워도 반영되지 않는다.
  LLM_OPENAI_MODEL: ${LLM_OPENAI_MODEL:-gpt-4o-mini}
  LLM_OPENAI_TEMPERATURE: ${LLM_OPENAI_TEMPERATURE:-0}
  # contests.requirement_chat.OpenAIRequirementChatAdapter의 전용 temperature다
  # (#55 코드리뷰 지적 4) — 위 LLM_OPENAI_TEMPERATURE(채점, 결정적이어야
  # 컷라인이 안정적이다)와 절대 같은 키를 쓰지 않는다. 비우면 기본값 0.7(대화가
  # 매 턴 기계적으로 똑같아지지 않게 한다).
  LLM_REQUIREMENT_CHAT_OPENAI_TEMPERATURE: ${LLM_REQUIREMENT_CHAT_OPENAI_TEMPERATURE:-0.7}

  # --- GitHub 저장소 어댑터 (#193, ADR-0007/0027) ---
  # 실물 어댑터는 repositories.adapters.GitHubAPIAdapter다 — GITHUB_ADAPTER_MODE를
  # 그 dotted path로 채운다. 위 값들과 같은 이유로 비워 두면 fake로 조용히 뜨는
  # 게 아니라 부팅이 거부된다(#83).
  GITHUB_ADAPTER_MODE: ${GITHUB_ADAPTER_MODE:?실제 GitHub 어댑터의 dotted path를 .env.prod 에 채워라 — repositories.adapters.GitHubAPIAdapter(#193)}
  # 선택값이다 — 공개 저장소 조회·다운로드는 인증 없이도 되고, 참가자의 GitHub
  # 자격증명이 아니라 platform 자신의 것이라 없어도 부팅을 막지 않는다.
  GITHUB_API_TOKEN: ${GITHUB_API_TOKEN:-}

  # --- 알림 채널 어댑터 (ADR-0007/0009) ---
  # 코디네이터 리뷰 지적: 존재하지 않는 클래스 이름을 여기 하드코딩하지 않는다 —
  # 실제 벤더 어댑터의 dotted path를 .env.prod에서 반드시 채워야 한다. staging의
  # 샌드박스 값과 절대 같은 값을 쓰지 않는다(벤더 계정 자체가 다르다).
  # #51: 알리고(Aligo) SMS/LMS 실물 어댑터 — notifications.adapters_aligo.
  # AligoSmsAdapter / AligoLmsAdapter. 알림톡은 승인 전까지 AligoAlimtalkAdapter가
  # 항상 실패를 돌려줘 SMS로 대체발송한다(ADR-0009).
  NOTIFICATION_ALIMTALK_ADAPTER: ${NOTIFICATION_ALIMTALK_ADAPTER:?실제 알림톡 벤더 어댑터의 dotted path를 .env.prod 에 채워라 — 승인 전이면 notifications.adapters_aligo.AligoAlimtalkAdapter(#51)를 채운다}
  NOTIFICATION_SMS_ADAPTER: ${NOTIFICATION_SMS_ADAPTER:?실제 SMS 벤더 어댑터의 dotted path를 .env.prod 에 채워라 — notifications.adapters_aligo.AligoSmsAdapter(#51)}
  NOTIFICATION_LMS_ADAPTER: ${NOTIFICATION_LMS_ADAPTER:?실제 LMS 벤더 어댑터의 dotted path를 .env.prod 에 채워라 — notifications.adapters_aligo.AligoLmsAdapter(#51)}
  # 알리고 자격증명(#51) — staging과 절대 같은 값을 쓰지 않는다(벤더 계정 자체가
  # 다르다).
  ALIGO_API_KEY: ${ALIGO_API_KEY:-}
  ALIGO_USER_ID: ${ALIGO_USER_ID:-}
  ALIGO_SENDER_PHONE_NUMBER: ${ALIGO_SENDER_PHONE_NUMBER:-}

  # --- 내부 인증(스케줄러 틱 외 5개 내부 스캔, ADR-0003) ---
  # 돈을 움직이는 전이를 발사하는 엔드포인트들이다. staging과 다른 값을 쓴다 — 같은
  # 토큰이 두 환경에 걸쳐 있으면 한쪽 유출이 곧 양쪽 유출이 된다. celery-worker/
  # celery-beat만 내부 네트워크(INTERNAL_API_BASE_URL)로 이 엔드포인트들을 부른다는
  # 전제라, 로드밸런서/리버스 프록시 단에서 `/api/internal/*` 경로를 외부에 노출하지
  # 않도록 별도로 막아 두는 것을 강력히 권장한다 — backend를 127.0.0.1에만 publish한
  # 것과 별개로, 그 로드밸런서 자체가 `/api/internal/*`를 전달하지 않게 규칙을 두면
  # 이중 방어선이 된다.
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
  INTERNAL_API_BASE_URL: http://backend:8000

  # --- Celery (ADR-0003) ---
  # Operator 세션(#43, ADR-0018) — 브로커와 같은 인스턴스, 다른 DB 인덱스.
  # 운영자 앱의 오리진(#43). 비면 부팅이 거부된다 — Host 헤더 유도는
  # 리버스 프록시 구성에 따라 어긋나 모든 변경 요청이 403 이 된다.
  CODEMIT_OPERATOR_ORIGIN: ${CODEMIT_OPERATOR_ORIGIN:?CODEMIT_OPERATOR_ORIGIN 을 설정해야 한다}
  SESSION_REDIS_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0

  # --- 이벤트 버스 (ADR-0046, #380) ---
  # 강의실 실시간 신호. staging의 x-backend-env 앵커와 같은 이유·같은 구조다
  # (compose.staging.yaml 참고) — fake로 남으면 부팅이 거부된다. 실물
  # 어댑터는 staging과 같은 값이다(벤더가 아니라 우리 자신의 Redis 위에서
  # 도는 코드라 환경별로 다른 자격증명이 필요 없다).
  EVENT_BUS_ADAPTER_MODE: ${EVENT_BUS_ADAPTER_MODE:?이벤트 버스 어댑터의 dotted path를 .env.prod 에 채워라 — core.events_redis.RedisEventBus(ADR-0046)}
  EVENT_BUS_REDIS_URL: redis://redis:6379/2

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?prod POSTGRES_DB 를 .env.prod 에 설정하라}
      POSTGRES_USER: ${POSTGRES_USER:?prod POSTGRES_USER 를 .env.prod 에 설정하라}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?prod POSTGRES_PASSWORD 를 .env.prod 에 설정하라}
    volumes:
      - codemit-prod-db:/var/lib/postgresql/data
    healthcheck:
      test: [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis: # Celery 브로커 + 결과 백엔드(ADR-0003). beat/worker 전용 — 호스트에 공개하지 않는다.
    image: redis:7-alpine
    # AOF 는 기본으로 꺼져 있다. 세션을 여기 얹었으므로(#43) 켜지 않으면 RDB
    # 스냅샷 창 안의 재시작이 조사 중인 운영자를 전부 튕긴다 — dev 와 같은 이유다.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - codemit-prod-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *backend-env
    ports:
      # 코디네이터 리뷰 지적: 0.0.0.0으로 publish하면 SECURE_PROXY_SSL_HEADER가
      # 신뢰하는 X-Forwarded-Proto를 인터넷 아무나 위조해 SSL 리다이렉트를 우회하고
      # secure 쿠키를 평문으로 받아낼 수 있다. 127.0.0.1에만 publish해, 같은 호스트에
      # 떠 있는 TLS 종단 리버스 프록시(아직 이 저장소에는 없다 — 별도 티켓)만 접근할
      # 수 있게 막는다. 그 프록시가 없는 상태로 이 스택만 올리면 backend는 호스트
      # 자신에서만 curl로 확인할 수 있다 — 이게 의도된 동작이다.
      - "127.0.0.1:${CODEMIT_API_PORT:-8000}:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4"

  celery-worker:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    environment: *backend-env
    command: celery -A config worker --loglevel info

  celery-beat:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    environment: *backend-env
    command: celery -A config beat --loglevel info

  # 이벤트 서비스(ADR-0046, #380) — 같은 backend 이미지를 ASGI로 띄우는 별도
  # 프로세스다(compose.staging.yaml의 events 서비스와 같은 설계·같은 이유).
  # 기존 API(`backend`)는 그대로 동기 gunicorn이다. 이 프로세스는 강의실
  # BFF만 내부 네트워크로 부른다 — backend와 달리 리버스 프록시가 직접
  # 앞에 설 이유가 없으므로 ports: 를 열지 않는다(호스트에도, 127.0.0.1
  # 에도 publish하지 않는다 — compose 네트워크 안에서만 닿는다).
  events:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    # 강의실 BFF 는 `http://events:8001` 로 중계하므로 Host 가 `events` 다 — backend 의
    # 허용 목록(.env.prod 의 DJANGO_ALLOWED_HOSTS, 거기엔 `backend` 가 있다)만 받으면
    # Django 가 모든 스트림 요청을 400(DisallowedHost)으로 돌려보낸다. staging 첫 배포에서
    # 실제로 그렇게 막혀 화면이 폴링으로만 돌았다(#380 후속). 비밀 파일이 아니라 여기서
    # 이 서비스의 호스트 이름만 덧붙인다 — 첫 항목은 그대로라 헬스 체크 규약도 그대로다.
    environment:
      <<: *backend-env
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?prod DJANGO_ALLOWED_HOSTS 를 .env.prod 에 설정하라},events
    command: >
      sh -c "uvicorn config.asgi:application --host 0.0.0.0 --port 8001"

  # 프론트엔드 BFF(ADR-0016, FE-13 #38). frontend.Dockerfile의 runner 스테이지 —
  # standalone 산출물을 `node server.js`로 그대로 돈다. instrumentation.ts가
  # CODEMIT_DEPLOYMENT_TARGET=production에서 CODEMIT_WEB_ORIGIN·CODEMIT_API_BASE_URL이
  # 비어 있으면 이 컨테이너를 그 자리에서 죽인다 — restart: unless-stopped라도
  # 값이 안 채워지면 재시작을 반복할 뿐 절대 뜨지 않는다(의도된 동작).
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      target: runner
      # staging과 같은 이유(compose.staging.yaml 참고, #85 코드리뷰 지적 2·7) —
      # NEXT_PUBLIC_*는 빌드타임에 인라인되므로 build.args로만 전달할 수 있다.
      args:
        # 오류 수집(GlitchTip, 2026-09-16) — 앱마다 다른 프로젝트(DSN)를 쓴다.
        # `NEXT_PUBLIC_*` 이라 브라우저 번들에 굳으므로 DSN 을 바꾸면 다시 굽는다.
        NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_FRONTEND:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
        NEXT_PUBLIC_SENTRY_RELEASE: ${SENTRY_RELEASE:-}
        NEXT_PUBLIC_PORTONE_STORE_ID: ${PORT_ONE_V2_STORE_ID:?}
        NEXT_PUBLIC_PORTONE_CHANNEL_KEY: ${KG_INICIS_CHANNEL_KEY:?}
        # 토스 결제창 브라우저 SDK가 쓰는 공개 키(#112) — TOSS_LIVE_SECRET_KEY와
        # 짝을 이루는 클라이언트 키다. **비어 있으면 compose 자체가 여기서
        # 기동을 거부한다(#115)** — compose.staging.yaml과 같은 이유·같은
        # `${VAR:?...}` 형태다. production의 PAYMENT_ADAPTER_MODE는 언제나
        # 실물 어댑터를 가리켜야 하므로(#83이 fake를 거부한다) 위젯은 반드시
        # 쓰인다 — "필수값이 아니다"는 예전 판단은 더는 맞지 않는다.
        #
        # **이 값은 build.args로만 존재해야 한다 — 아래 frontend 서비스의
        # environment: 블록에 절대 추가하지 않는다.** compose.staging.yaml의
        # 같은 주석 참고 — 부팅 가드(frontend/instrumentation.ts)가 읽는 것은
        # 컨테이너의 런타임 env이고, docker/frontend.Dockerfile의 runner
        # 스테이지가 이 ARG를 다시 ENV로 노출해 두었기 때문에 지금은 "런타임
        # env == 빌드에 실제로 구운 값"이 성립한다(#115). environment:에도
        # 넣으면 그 등식이 깨져 번들은 비어 있는데 가드만 통과하는 사고가
        # 재현된다.
        NEXT_PUBLIC_TOSS_CLIENT_KEY: ${TOSS_LIVE_CLIENT_KEY:?토스 결제창 브라우저 SDK 클라이언트 키를 .env.prod 의 TOSS_LIVE_CLIENT_KEY 에 설정하라 — 빌드타임에 인라인되므로 부팅 후에는 되돌릴 수 없다}
        # 공모전 제품 스위치 — 「공모전 / 유료 공모전」 둘(#271/#413) — 위 backend 의
        # `CODEMIT_CONTEST_PRODUCT_ENABLED`/`CODEMIT_PAID_CONTEST_PRODUCT_ENABLED` 와
        # **같은 `.env.prod` 줄을 나눠 읽는다**(compose.staging.yaml 의 같은 자리와 같다).
        # 빌드 인자라 값을 바꾸면 이미지를 다시 굽어야 반영된다.
        NEXT_PUBLIC_CONTEST_PRODUCT_ENABLED: ${CODEMIT_CONTEST_PRODUCT_ENABLED:-true}
        NEXT_PUBLIC_PAID_CONTEST_PRODUCT_ENABLED: ${CODEMIT_PAID_CONTEST_PRODUCT_ENABLED:-false}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      # 서버(Node)에서 난 오류도 같은 프로젝트로 보낸다 — 빌드 인자와 **같은 줄을
      # 나눠 읽는다**(값이 갈리면 브라우저와 서버가 다른 곳에 보고한다).
      NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_FRONTEND:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
      NEXT_PUBLIC_SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      # 로그인이 끝나고 강의실로 돌려보낼 때 대조하는 허용목록(#297 후속).
      # 강의실 컨테이너가 읽는 것과 **같은 `.env` 줄**이다(CODEMIT_OPERATOR_ORIGIN 과
      # 같은 원칙) — 어긋나면 복귀가 조용히 안 되고 사람은 공개 앱에 남는다.
      # 안전한 쪽으로 실패하지만 원인을 찾기 어려우니 한 줄로 맞춰 둔다.
      CODEMIT_CLASSROOM_ORIGIN: ${CODEMIT_CLASSROOM_ORIGIN:-}
      CODEMIT_DEPLOYMENT_TARGET: production
      CODEMIT_API_BASE_URL: http://backend:8000
      # frontend/lib/auth/origin.ts의 CSRF Origin 검증이 쓰는 값 — 비어 있으면
      # instrumentation.ts가 부팅을 거부한다. staging의 값과 같은 값을 쓰지 않는다
      # (실제 운영 도메인이어야 한다). .env.prod에서 반드시 채운다.
      CODEMIT_WEB_ORIGIN: ${CODEMIT_WEB_ORIGIN:?prod CODEMIT_WEB_ORIGIN 를 .env.prod 에 설정하라}
      # 세션 쿠키의 domain 속성(ADR-0038) — compose.staging.yaml과 같은
      # 이유·같은 구조다. staging과 같은 값을 쓰지 않는다(실제 운영 도메인의
      # 부모여야 한다).
      CODEMIT_SESSION_COOKIE_DOMAIN: ${CODEMIT_SESSION_COOKIE_DOMAIN:?prod CODEMIT_SESSION_COOKIE_DOMAIN 을 .env.prod 에 설정하라}
      # 카카오 OAuth 앱 자격증명(#95/#96) — staging의 frontend 서비스와 같은
      # 이유·같은 구조다(docker/compose.staging.yaml 참고). staging과 같은
      # 값을 쓰지 않는다 — 벤더 앱 자체가 다르고, redirect_uri는 실제 운영
      # 도메인이어야 한다.
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:?prod KAKAO_REST_API_KEY 를 .env.prod 에 설정하라}
      KAKAO_SECRET_KEY: ${KAKAO_SECRET_KEY:?prod KAKAO_SECRET_KEY 를 .env.prod 에 설정하라}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:?prod KAKAO_REDIRECT_URI 를 .env.prod 에 설정하라 — 카카오 콘솔에 등록한 값과 정확히 같아야 한다}
      # GitHub·구글 OAuth 앱 자격증명(#189) — 카카오와 달리 **선택**이다.
      # compose.staging.yaml과 같은 이유·같은 구조다. 비어 있으면 로그인
      # 화면의 해당 버튼이 "준비 중"으로 남을 뿐 기동은 막지 않는다.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    ports:
      # backend와 같은 이유로 127.0.0.1에만 publish한다 — 이 호스트 앞단에 TLS
      # 종단 리버스 프록시가 반드시 있어야 하고(아직 이 저장소에는 없다, 별도
      # 티켓), 그 프록시가 없는 상태로 이 스택만 올리면 frontend는 호스트 자신
      # 에서만 curl로 확인할 수 있다 — 인터넷에 직접 노출하지 않는 것이 의도된
      # 동작이다.
      - "127.0.0.1:${CODEMIT_WEB_PORT:-3000}:3000"

  # 운영자 앱 BFF(#70, ADR-0019/0021). operator.Dockerfile의 runner 스테이지 —
  # standalone 산출물을 `node server.js`로 그대로 돈다. operator/instrumentation.ts가
  # CODEMIT_DEPLOYMENT_TARGET=production에서 CODEMIT_OPERATOR_ORIGIN·
  # CODEMIT_API_BASE_URL이 비어 있으면 이 컨테이너를 그 자리에서 죽인다.
  #
  # **CODEMIT_OPERATOR_ORIGIN을 위 x-backend-env 앵커의 backend가 요구하는 것과
  # 정확히 같은 환경변수에서 읽는다** — 두 서비스가 `.env.prod`의 같은 줄을
  # 나눠 읽으므로, 이 값이 서로 다른 곳에서 따로 채워져 어긋나는 사고 자체가
  # 구조적으로 불가능하다. 이 티켓의 핵심 위험(오리진 정합성)에 대한 compose
  # 수준의 방어다.
  operator:
    build:
      context: ..
      dockerfile: docker/operator.Dockerfile
      target: runner
      args:
        # 오류 수집(GlitchTip, 2026-09-16) — 앱마다 다른 프로젝트(DSN)를 쓴다.
        # `NEXT_PUBLIC_*` 이라 브라우저 번들에 굳으므로 DSN 을 바꾸면 다시 굽는다.
        NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_OPERATOR:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
        NEXT_PUBLIC_SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      # 서버(Node)에서 난 오류도 같은 프로젝트로 보낸다 — 빌드 인자와 **같은 줄을
      # 나눠 읽는다**(값이 갈리면 브라우저와 서버가 다른 곳에 보고한다).
      NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_OPERATOR:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
      NEXT_PUBLIC_SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      CODEMIT_DEPLOYMENT_TARGET: production
      CODEMIT_API_BASE_URL: http://backend:8000
      # backend의 OPERATOR_WEB_ORIGIN(위 x-backend-env)과 같은 변수, 같은 값 —
      # 실제 운영 도메인이어야 한다. staging의 값과 같은 값을 쓰지 않는다.
      CODEMIT_OPERATOR_ORIGIN: ${CODEMIT_OPERATOR_ORIGIN:?CODEMIT_OPERATOR_ORIGIN 을 설정해야 한다}
    ports:
      # frontend·backend와 같은 이유로 127.0.0.1에만 publish한다 — 이 호스트
      # 앞단에 TLS 종단 리버스 프록시가 반드시 있어야 한다(별도 티켓). 그 프록시가
      # 없는 상태로 이 스택만 올리면 operator는 호스트 자신에서만 curl로 확인할
      # 수 있다 — 인터넷에 직접 노출하지 않는 것이 의도된 동작이다.
      - "127.0.0.1:${CODEMIT_OPERATOR_WEB_PORT:-3001}:3000"

  # 강의실 앱(#276/#277, ADR-0037). classroom.Dockerfile의 runner 스테이지 —
  # frontend·operator 서비스와 같은 산출물 모양이고 같은 부팅 가드 원칙을
  # 따른다(classroom/instrumentation.ts).
  classroom:
    build:
      context: ..
      dockerfile: docker/classroom.Dockerfile
      target: runner
      args:
        # 오류 수집(GlitchTip, 2026-09-16) — 앱마다 다른 프로젝트(DSN)를 쓴다.
        # `NEXT_PUBLIC_*` 이라 브라우저 번들에 굳으므로 DSN 을 바꾸면 다시 굽는다.
        NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_CLASSROOM:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
        NEXT_PUBLIC_SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      events:
        condition: service_started
    environment:
      # 서버(Node)에서 난 오류도 같은 프로젝트로 보낸다 — 빌드 인자와 **같은 줄을
      # 나눠 읽는다**(값이 갈리면 브라우저와 서버가 다른 곳에 보고한다).
      NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_CLASSROOM:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
      NEXT_PUBLIC_SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      CODEMIT_DEPLOYMENT_TARGET: production
      CODEMIT_API_BASE_URL: http://backend:8000
      # 실시간 신호 SSE 전용 베이스 URL(ADR-0046, #380) — compose.staging.yaml의
      # classroom 서비스와 같은 이유·같은 구조다. 강의실 BFF가
      # `/api/classroom/events/stream` 경로 하나만 이쪽으로 갈라 보낸다.
      CODEMIT_EVENTS_BASE_URL: http://events:8001
      # 이 앱 자신의 Origin 검증이 쓰는 값 — 실제 운영 도메인이어야 한다.
      # staging의 값과 같은 값을 쓰지 않는다.
      CODEMIT_CLASSROOM_ORIGIN: ${CODEMIT_CLASSROOM_ORIGIN:?CODEMIT_CLASSROOM_ORIGIN 을 설정해야 한다}
      # 「로그인이 필요합니다」 화면이 공개 앱 로그인으로 안내하는 링크를 지을
      # 때 읽는다 — frontend 서비스가 요구하는 것과 같은 변수, 같은 값.
      CODEMIT_WEB_ORIGIN: ${CODEMIT_WEB_ORIGIN:?prod CODEMIT_WEB_ORIGIN 를 .env.prod 에 설정하라}
      # frontend 서비스가 요구하는 것과 같은 변수, 같은 값(ADR-0038).
      CODEMIT_SESSION_COOKIE_DOMAIN: ${CODEMIT_SESSION_COOKIE_DOMAIN:?prod CODEMIT_SESSION_COOKIE_DOMAIN 을 .env.prod 에 설정하라}
    ports:
      # frontend·operator와 같은 이유로 127.0.0.1에만 publish한다 — 이 호스트
      # 앞단에 TLS 종단 리버스 프록시가 반드시 있어야 한다.
      - "127.0.0.1:${CODEMIT_CLASSROOM_WEB_PORT:-3002}:3000"

volumes:
  codemit-prod-db:
  codemit-prod-redis:
