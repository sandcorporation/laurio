# 개발용 스택. staging/prod 구성은 티켓 22(#23)에서 분리한다.
#
#   docker compose -f docker/compose.dev.yaml up
#
# 공개 포트는 다른 프로젝트와 부딪히지 않도록 기본값을 비켜 잡았고 환경변수로 바꿀 수 있다.
name: laurio-dev

x-postgres-env: &default-postgres-env
  POSTGRES_DB: laurio
  POSTGRES_USER: laurio
  POSTGRES_PASSWORD: laurio

services:
  db:
    image: postgres:17-alpine
    environment:
      <<: *default-postgres-env
    ports:
      # 로컬에서 uv run pytest 를 돌릴 때 붙을 수 있도록 노출한다.
      - "${LAURIO_DB_PORT:-55432}:5432"
    volumes:
      - laurio-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laurio -d laurio"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *default-postgres-env
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: dev-only-insecure-key
      DJANGO_ALLOWED_HOSTS: "*"
    ports:
      - "${LAURIO_API_PORT:-58000}:8000"
    volumes:
      # 소스를 마운트해 코드 수정이 즉시 반영되게 한다. 가상환경은 /opt/venv 라 가려지지 않는다.
      - ../backend:/app
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  laurio-dev-db:
