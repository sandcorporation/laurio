# 개발용 스택. staging/prod 구성은 티켓 22(#23)에서 분리한다.
#
#   docker compose -f docker/compose.dev.yaml up
#
# 공개 포트는 다른 프로젝트와 부딪히지 않도록 기본값을 비켜 잡았고 환경변수로 바꿀 수 있다.
name: laurio-dev

x-postgres-env: &default-postgres-env
  POSTGRES_DB: laurio
  POSTGRES_USER: laurio
  POSTGRES_PASSWORD: laurio

x-minio-env: &default-minio-env
  MINIO_ROOT_USER: laurio
  MINIO_ROOT_PASSWORD: laurio-secret

services:
  db:
    image: postgres:17-alpine
    environment:
      <<: *default-postgres-env
    ports:
      # 로컬에서 uv run pytest 를 돌릴 때 붙을 수 있도록 노출한다.
      - "${LAURIO_DB_PORT:-55432}:5432"
    volumes:
      - laurio-dev-db:/var/lib/postgresql/data
    healthcheck:
      # -h 를 반드시 준다. 없으면 유닉스 소켓으로 붙는데, postgres 엔트리포인트가
      # 초기화 중에 띄우는 임시 서버(listen_addresses='')도 그 소켓에 응답한다.
      # 그러면 TCP 가 아직 안 열린 상태에서 healthy 로 판정돼 backend 의 migrate 가
      # 첫 기동(빈 볼륨)에서 connection refused 로 죽는다.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U laurio -d laurio"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    # Operator 세션 저장소(#43, ADR-0018). staging·prod 에는 Celery 브로커용 redis 가
    # 이미 있어 세션도 같은 인스턴스를 쓴다 — dev 에만 없어서 여기 붙인다.
    #
    # `--appendonly yes` 가 핵심이다. redis:7-alpine 은 AOF 가 기본으로 꺼져 있어서,
    # 켜지 않으면 컨테이너 재시작이 곧 전원 로그아웃이 된다. 세션을 지우는 것이
    # 즉시 무효화 수단인데(별도 블랙리스트를 두지 않는 이유다), 재시작이 그것을
    # 구분 없이 해버리면 운영자가 조사 중에 튕겨 나간다.
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # 호스트에서 uv run pytest 를 돌릴 때 붙는다 — DB 와 같은 이유다.
      # 표준 6379 를 비켜 잡는 것도 같은 이유다(CLAUDE.md).
      - "${LAURIO_REDIS_PORT:-16379}:6379"
    volumes:
      - laurio-dev-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 스토리지 어댑터(ADR-0005, ADR-0007)의 dev 바인딩. S3 호환 API라 앱은 STORAGE_BACKEND=s3
  # 그대로 두고 엔드포인트만 여기를 가리킨다. 버킷은 항상 private — 이 스택 어디에도
  # 버킷을 public으로 만들거나 정책을 고치는 코드는 없다.
  minio:
    image: minio/minio:latest
    environment:
      <<: *default-minio-env
    ports:
      # API. 호스트에서 직접 붙을 때(uv run manage.py 등)를 위해 노출한다.
      - "${LAURIO_MINIO_PORT:-19000}:9000"
      # 콘솔. 9000/9001은 이 머신의 다른 프로젝트가 쓰고 있어 비켜 잡았다.
      - "${LAURIO_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - laurio-dev-minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  # laurio-dev 버킷을 한 번 만들고 종료하는 초기화 잡. private 그대로 둔다 —
  # `mc anonymous set` 같은 공개 전환 명령은 절대 여기 넣지 않는다(ADR-0005).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      <<: *default-minio-env
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
             mc mb --ignore-existing local/laurio-dev"
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    # migrate 가 DB 기동 레이스로 한 번 실패해도 스스로 복구되게 한다.
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 이게 없으면 backend가 laurio-dev 버킷이 아직 없는 상태로 뜰 수 있고,
      # 첫 업로드 PUT이 NoSuchBucket으로 실패한다.
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *default-postgres-env
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: dev-only-insecure-key
      DJANGO_ALLOWED_HOSTS: "*"
      # Operator 세션(#43). Celery 브로커가 db 0 을 쓰므로 세션은 1 을 쓴다.
      SESSION_REDIS_URL: redis://redis:6379/1
      STORAGE_BACKEND: s3
      STORAGE_BUCKET: laurio-dev
      STORAGE_ENDPOINT_URL: http://minio:9000
      # presigned URL은 브라우저가 직접 여는 주소다(FE-09, #34) — 컨테이너 내부
      # DNS 이름 "minio:9000"은 브라우저(호스트)가 못 푼다. 호스트에 매핑된
      # 포트(LAURIO_MINIO_PORT)로 별도로 준다. STORAGE_ENDPOINT_URL은 서버
      # 프로세스 자신이 스토리지에 붙는 주소로 그대로 둔다(backend/config/
      # settings.py STORAGE_PUBLIC_ENDPOINT_URL 주석 참고).
      STORAGE_PUBLIC_ENDPOINT_URL: http://127.0.0.1:${LAURIO_MINIO_PORT:-19000}
      STORAGE_ACCESS_KEY: laurio
      STORAGE_SECRET_KEY: laurio-secret
      STORAGE_REGION: us-east-1
    ports:
      - "${LAURIO_API_PORT:-58000}:8000"
    volumes:
      # 소스를 마운트해 코드 수정이 즉시 반영되게 한다. 가상환경은 /opt/venv 라 가려지지 않는다.
      - ../backend:/app
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_dev_data &&
             python manage.py runserver 0.0.0.0:8000"

  # Celery worker·beat (#40). **기본 기동에서는 빠져 있다** — `profiles` 때문에
  # `docker compose up -d` 로는 뜨지 않고, 필요할 때만 다음처럼 켠다:
  #
  #   docker compose -f docker/compose.dev.yaml --profile celery up -d
  #
  # 왜 기본이 아닌가. beat 는 60초마다 스캔 틱을 쏘고(config/celery.py), 그 스캔은
  # 마감 전이·채점·배분·환불을 실제로 진행시킨다. e2e 가 심는 Contest·Submission 을
  # 테스트 도중에 다른 상태로 옮겨버리면, 원인이 테스트 밖에 있는 비결정적 실패가
  # 된다 — 이 저장소가 시드 위생으로 이미 한 번 겪은 부류다. dev 에서 스캔 경로를
  # 돌려보고 싶을 때만 명시적으로 켠다.
  celery-worker:
    profiles: ["celery"]
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      <<: *default-postgres-env
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: dev-only-insecure-key
      DJANGO_ALLOWED_HOSTS: "*"
      SESSION_REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # backend 서비스는 INTERNAL_API_TOKEN 을 주지 않아 DEBUG 기본값
      # ("dev-only-internal-token", config/settings.py)을 쓴다 — celery 도 같은
      # 값이어야 백엔드가 그 호출을 받아들인다. 이름을 다르게 주면 스캔이 전부
      # 401 로 조용히 실패한다.
      INTERNAL_API_BASE_URL: http://backend:8000
    command: celery -A config worker --loglevel info

  celery-beat:
    profiles: ["celery"]
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      <<: *default-postgres-env
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: dev-only-insecure-key
      DJANGO_ALLOWED_HOSTS: "*"
      SESSION_REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # backend 서비스는 INTERNAL_API_TOKEN 을 주지 않아 DEBUG 기본값
      # ("dev-only-internal-token", config/settings.py)을 쓴다 — celery 도 같은
      # 값이어야 백엔드가 그 호출을 받아들인다. 이름을 다르게 주면 스캔이 전부
      # 401 로 조용히 실패한다.
      INTERNAL_API_BASE_URL: http://backend:8000
    command: celery -A config beat --loglevel info

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      # frontend.Dockerfile이 FE-13(#38)부터 dev/builder/runner 세 스테이지로
      # 갈린다 — target을 명시하지 않으면 파일의 마지막 스테이지(runner, 프로덕션용)
      # 가 골라져 소스 바인드 마운트·`next dev`가 아니라 얼어붙은 standalone 산출물이
      # 뜬다. dev는 항상 dev 스테이지를 명시적으로 고른다.
      target: dev
    depends_on:
      backend:
        condition: service_started
    environment:
      # 컨테이너 안에서는 compose 네트워크 이름으로 백엔드에 붙는다. 호스트에서
      # `pnpm dev` 로 돌릴 때는 이 값이 없어 settings 의 기본값(127.0.0.1:58000)이 쓰인다.
      LAURIO_API_BASE_URL: http://backend:8000
      # 카카오 OAuth 앱 자격증명(#95/#96) — **dev는 일부러 비워 둔다**(코드리뷰
      # 지적, 되돌림). 예전에 여기 더미 값을 채웠더니 dev에서 카카오 버튼을
      # 누르면 authorize가 실제로 그 더미 client_id로 카카오
      # authorize URL(kauth.kakao.com)로 리다이렉트했고, 존재하지 않는 앱이라
      # 카카오 자신의 KOE101 에러 페이지로 이탈했다 — 스펙이 정한 "제공자의
      # 에러 페이지가 아니라 우리 문구"와 정반대였다. 비워 두면 authorize
      # 라우트가 카카오에 닿기 전에 "이 환경에는 카카오 앱이 설정되지 않았다"
      # 는 우리 문구로 돌아간다(dev의 정상 동작, .env.example·
      # config/settings.py 주석과 일치). authorize→callback의 state 발급·
      # 검증·next 검증처럼 자격증명이 있어야만 관찰되는 경로는
      # frontend/e2e/oauth-kakao.spec.ts가 카카오 자격증명이 감지되면 그
      # 부분만 실행하고 아니면 건너뛴다 — dev compose에 값을 채우지 않고도
      # 필요할 때(로컬에서 직접 값을 주입해) 검증할 수 있다.
    ports:
      # 이 머신은 3000·5432·8000·9000·9001 을 다른 프로젝트가, 55432·58000·19000·19001 을
      # 이 프로젝트가 이미 쓴다. 그래서 비켜 잡았고 환경변수로 바꿀 수 있다.
      - "${LAURIO_WEB_PORT:-53000}:3000"
    volumes:
      # 저장소 전체를 마운트한다(운영자 앱 04 #62부터) — pnpm 워크스페이스의
      # 락파일·workspace 정의가 저장소 루트에 있고, frontend/가 그 워크스페이스
      # 멤버 중 하나라서 frontend/만 떼어 마운트하면 `pnpm install`이 워크스페이스
      # 형태를 볼 수 없다. node_modules 는 이미지 것을 쓰도록 이름 있는 볼륨으로
      # 가린다 — 호스트(Windows)와 이미지(리눅스)의 바이너리가 다르다.
      - ..:/app
      # 이름 있는 볼륨이다 — 익명이면 컨테이너를 다시 만들 때 옛 것이 승계되는데,
      # 이름이 없으면 그것만 골라 지울 수가 없어 down -v(= dev DB·MinIO 소실)까지
      # 가야 한다. 이름이 있으면 하나만 버리고 나머지는 지킬 수 있다:
      #
      #   docker compose -f docker/compose.dev.yaml rm -sf frontend
      #   docker volume rm laurio-dev_laurio-dev-web-next
      #   docker compose -f docker/compose.dev.yaml up -d frontend
      #
      # **이 컨테이너 안에서 `pnpm build` 를 돌리지 말 것.** 프로덕션 산출물이
      # .next 볼륨에 남아 next dev 가 그 위에서 돌다 MODULE_NOT_FOUND 로 500 을
      # 낸다(실제로 겪었다). 프로덕션 빌드 확인은 CI 가 하고, 로컬에서 필요하면
      # 일회용 컨테이너에서 돌린다.
      #
      # 워크스페이스 멤버마다 자기 node_modules(심볼릭 링크 모음)를 갖는다 —
      # 루트 것 하나만 가리면 frontend/·packages/* 밑에는 여전히 호스트
      # 바인드 마운트가 그대로 남아 옛(또는 없는) node_modules 가 노출된다.
      - laurio-dev-web-node-modules:/app/node_modules
      - laurio-dev-web-frontend-node-modules:/app/frontend/node_modules
      - laurio-dev-web-shared-node-modules:/app/packages/bff-shared/node_modules
      - laurio-dev-web-bff-client-node-modules:/app/packages/bff-client/node_modules
      - laurio-dev-web-route-audit-node-modules:/app/packages/route-audit/node_modules
      - laurio-dev-web-next:/app/frontend/.next
      # node_modules 볼륨은 처음 만들어질 때 딱 한 번만 이미지 내용으로 채워진다
      # (도커의 명명된 볼륨 규칙). 그래서 이미 떠 있는 스택에 `pnpm add` 로 의존성을
      # 새로 추가하고 `up -d --build` 만 돌리면, 이미지는 새 패키지를 담고 있어도
      # 컨테이너는 볼륨에 남은 옛 node_modules 를 계속 쓴다 — globals.css 의
      # `@import "tailwindcss"` 같은 새 의존성이 컴파일에서 조용히 실패하고,
      # /healthz 는 백엔드 도달만 보므로 200 을 내려 CI 대기 스텝이 이 실패를
      # 가린다(실제로 겪었다). 그래서 backend 의 migrate 패턴처럼 컨테이너가 뜰
      # 때마다 lockfile 기준으로 스스로 수렴시킨다 — 볼륨이 비어 있든 오래됐든
      # 매번 같은 상태로 맞춰지므로 수동 볼륨 삭제가 필요 없다.
      - laurio-dev-web-pnpm-store:/pnpm/store
    # CI=true 는 install 에만 건다 — pnpm 이 낯선(이 시나리오에서는 옛) node_modules 를
    # 정리할 때 TTY 확인을 요구해(ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY) 실제로
    # 막혔다. 이 컨테이너는 TTY 없이 백그라운드로 뜬다. `pnpm dev` 자체에는 걸지
    # 않는다 — Next 의 CI 분기 동작까지 바꿀 이유는 없다.
    #
    # install은 워크스페이스 루트(/app)에서, dev는 이 앱 디렉터리(이미지의
    # WORKDIR인 /app/frontend, frontend.Dockerfile 참고)에서 돈다.
    #
    # **`--filter laurio-frontend...`를 반드시 쓴다**(코드리뷰 지적, 두 번 재현된
    # 사고). 필터 없는 평범한 `pnpm install`은 워크스페이스 전체(operator/까지)를
    # 설치한다 — 이 컨테이너는 `/app/operator/node_modules`를 볼륨으로 가리지
    # 않으므로, 그 설치가 호스트에 바인드 마운트된 `operator/node_modules`에
    # 리눅스 산출물을 그대로 쓴다. `operator` 서비스도 대칭으로
    # `/app/frontend/node_modules`를 가리지 않아 반대 방향으로 같은 사고가
    # 난다 — 실제로 스택을 띄운 뒤 호스트에서 `pnpm install --frozen-lockfile`을
    # 돌리면 "Already up to date"를 찍으면서도 `playwright: not found`가 나는
    # 것으로 재현된다(호스트가 기대하는 Windows 바이너리가 컨테이너의 리눅스
    # 산출물로 조용히 덮인 것이다 — pnpm의 최신성 판정은 락파일 해시만 보지
    # 실제 바이너리 플랫폼은 보지 않는다). `--filter <패키지>...`는 그 패키지와
    # 그 워크스페이스 의존성(laurio-frontend는 @laurio/bff-shared·@laurio/bff-client)만 설치 대상에
    # 넣는다 — operator/는 필터링 대상 밖이라 이 컨테이너가 그 디렉터리를 아예
    # 건드리지 않는다(`pnpm install --filter laurio-frontend... --frozen-lockfile`
    # 을 직접 돌려 "Scope: 3 of 5 workspace projects"로 확인했다 — bff-client 가 늘며 수도 늘었다). 두 컨테이너가
    # 서로의 node_modules를 볼륨으로 가리는 것보다 이 편이 근본적이다 — 애초에
    # 쓰지 않는 디렉터리를 아예 쓰지 않게 만든다.
    #
    # `--force`는 그대로 남긴다 — 이 서비스 자신의 node_modules 볼륨이 어떤
    # 이유로든(중단된 install, 이미지 교체 등) 반쪽짜리 상태로 남아 있어도 매번
    # 완전히 다시 링크해 같은 결과로 수렴시킨다(#63 커밋 메시지에 남긴 최초
    # 재현). `--filter`가 사고의 근본 원인(다른 앱 디렉터리를 건드리는 것)을
    # 막고, `--force`는 이 앱 자신의 디렉터리가 스스로 망가졌을 때의 복원력이다
    # — 서로 다른 문제를 막는다.
    command: >
      sh -c "cd /app && CI=true pnpm install --filter laurio-frontend... --frozen-lockfile --force &&
             cd /app/frontend && pnpm dev"

  # 운영자 앱(#63, ADR-0019/0021) — 공개 앱과 다른 오리진으로 뜬다. 같은
  # 워크스페이스 멤버라서 frontend 서비스와 거의 같은 모양이다: 저장소 전체를
  # 마운트하고, 워크스페이스 루트에서 install한 뒤 operator/에서 dev를 돈다.
  operator:
    build:
      context: ..
      dockerfile: docker/operator.Dockerfile
      target: dev
    depends_on:
      backend:
        condition: service_started
    environment:
      LAURIO_API_BASE_URL: http://backend:8000
      # dev에서는 비워 둔다 — backend/config/settings.py의 OPERATOR_WEB_ORIGIN도
      # dev에서는 비어 있고(IS_DEPLOYED_ENVIRONMENT가 아니라서 부팅 가드가 걸리지
      # 않는다), 양쪽 다 비어 있으면 둘 다 같은 값(Host 헤더로 유도한 도착지
      # 오리진)을 독립적으로 계산해 정확히 맞아떨어진다(lib/backend.ts의
      # operatorOrigin 주석 참고). 배포 환경(compose.staging/prod.yaml)에서는
      # 백엔드의 LAURIO_OPERATOR_ORIGIN과 반드시 같은 값을 준다 — #70의 몫이다.
    ports:
      # 공개 앱(53000)과 겹치지 않는 새 포트. 이 머신에서 이미 쓰는 포트를
      # 피했다(디스패치 지침) — 기본값은 CLAUDE.md 포트 표와 같다.
      - "${LAURIO_OPERATOR_WEB_PORT:-53001}:3000"
    volumes:
      - ..:/app
      - laurio-dev-operator-node-modules:/app/node_modules
      - laurio-dev-operator-app-node-modules:/app/operator/node_modules
      - laurio-dev-operator-shared-node-modules:/app/packages/bff-shared/node_modules
      - laurio-dev-operator-bff-client-node-modules:/app/packages/bff-client/node_modules
      - laurio-dev-operator-route-audit-node-modules:/app/packages/route-audit/node_modules
      - laurio-dev-operator-next:/app/operator/.next
      - laurio-dev-operator-pnpm-store:/pnpm/store
    # frontend 서비스 command 주석 참고 — `--filter laurio-operator...`가 이
    # 컨테이너의 install이 frontend/node_modules를 건드리지 않게 막는다(이
    # 서비스가 그 디렉터리를 볼륨으로 가리지 않으므로, 필터 없이는 호스트에
    # 바인드 마운트된 frontend/node_modules에 리눅스 산출물을 그대로 쓴다 —
    # 코드리뷰가 호스트에서 직접 재현한 사고). `--force`는 이 앱 자신의
    # node_modules 볼륨이 반쪽짜리 상태로 남아 있을 때의 복원력으로 별개로
    # 남긴다.
    command: >
      sh -c "cd /app && CI=true pnpm install --filter laurio-operator... --frozen-lockfile --force &&
             cd /app/operator && pnpm dev"

volumes:
  laurio-dev-redis:
  laurio-dev-db:
  laurio-dev-web-node-modules:
  laurio-dev-web-frontend-node-modules:
  laurio-dev-web-shared-node-modules:
  laurio-dev-web-bff-client-node-modules:
  laurio-dev-web-route-audit-node-modules:
  laurio-dev-web-next:
  laurio-dev-web-pnpm-store:
  laurio-dev-operator-node-modules:
  laurio-dev-operator-app-node-modules:
  laurio-dev-operator-shared-node-modules:
  laurio-dev-operator-bff-client-node-modules:
  laurio-dev-operator-route-audit-node-modules:
  laurio-dev-operator-next:
  laurio-dev-operator-pnpm-store:
  laurio-dev-minio:
