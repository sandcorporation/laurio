# agent-grader 검사(#999, `scripts/ci/agent-grader-check.sh`) — 운영 정의와 같은 격리 설정의 실행기를 내부 네트워크에
# 세우고, `llm-proxy` 자리에 가짜 벤더(`scripts/ci/agent_grader_fake_vendor.py`)를 둔다. 진짜 벤더·키는 없다.
# 격리 설정(read_only·tmpfs·cap_drop·security_opt·mem_limit·pids_limit·networks·environment)은 compose.prod.yaml 과
# 같아야 한다 — backend/tests/test_agent_runner.py 가 견준다. 하나만 다르다: `apparmor:unconfined` — 실행기
# (ubuntu-24.04-arm)의 docker 기본 AppArmor 프로필이 mount 를 막아 bwrap 이 「Failed to make / slave: Permission denied」로
# 멈춘다. 운영 호스트에는 AppArmor 가 없어 운영 정의에는 적지 않는다.
name: codemit-agent-grader-check

x-check-image: &check-image ${AGENT_GRADER_IMAGE:-codemit-agent-grader:check}

services:
  agent-grader:
    image: *check-image
    build:
      context: ..
      dockerfile: docker/agent-grader.Dockerfile
    read_only: true
    tmpfs:
      - /work:size=768m,mode=0700,uid=10001,gid=10001
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp:./agent-grader-seccomp.json
      - apparmor:unconfined  # 검사 실행기만 — 위 머리 주석
    mem_limit: 1536m
    pids_limit: 512
    environment:
      AGENT_GRADER_PROXY_BASE_URL: http://llm-proxy:8002
    networks:
      - agent
      - agent-call
    healthcheck:
      test: ["CMD", "python3", "/app/agent_runner.py", "health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
      start_interval: 1s

  # 가짜 벤더 — 운영의 프록시 이름·포트(`http://llm-proxy:8002`)에 선다. 같은 이미지의 파이썬으로 돈다.
  llm-proxy:
    image: *check-image
    read_only: true
    volumes:
      - ../scripts/ci:/checks:ro
    networks:
      - agent
      - default
    command: ["python3", "/checks/agent_grader_fake_vendor.py", "8002"]

  driver:
    image: *check-image
    profiles: ["driver"]
    read_only: true
    volumes:
      - ../scripts/ci:/checks:ro
    # 운영의 부르는 쪽(`celery-worker`)과 같은 자리 — `agent` 가 아니라 `agent-call` 로 실행기에 닿는다(#1031).
    # default 는 가짜 벤더의 기록(`/_requests`)을 읽으려고.
    networks:
      - default
      - agent-call
    depends_on:
      agent-grader:
        condition: service_healthy
      llm-proxy:
        condition: service_started
    command: ["python3", "/checks/agent_grader_check.py"]

networks:
  agent:
    internal: true
  agent-call:
    internal: true
