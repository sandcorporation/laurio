# staging 스택 — 검증용 서브 호스트에 올린다(#23). dev(compose.dev.yaml)와 분리된
# 별도 파일이라 dev의 fake 어댑터·기본 시크릿이 여기 섞여 들어올 길이 없다.
#
#   docker compose -f docker/compose.staging.yaml --env-file docker/.env.staging \
#     up -d --build
#
# `docker/.env.staging` 은 `docker/staging.env.example` 을 복사해 채운, 절대 커밋하지
# 않는 파일이다(.gitignore 의 `.env.*` 규칙). `--env-file` 을 명시하지 않으면 compose가
# 이 디렉터리의 `.env`(dev용, 없음)를 찾다가 그냥 빈 값으로 진행해 아래 `${VAR:?...}`
# 가드에 걸려 기동이 거부된다 — 즉 "시크릿 없이 조용히 뜨는" 실패 모드는 애초에 없다.
#
# **이 스택은 지금 뜨지 않는다 — 의도된 상태다(#83, 사용자 결정).** 저장소에
# `Real*` 어댑터 클래스가 하나도 없다 — 본인확인(#85)·결제(#87)·Seller 등록(#57)·
# LLM 채점/AI grill(#88)이 각각 실물을 붙이기 전까지, 아래 다섯 *_ADAPTER_MODE는
# `${VAR:?...}`로 값을 요구하고, 값을 채워도(dotted path가 아직 없으므로) 부팅
# 가드(#83, core.adapters.check_adapter_mode)가 거부한다. `example`을 그대로
# 복사해 `.env.staging`을 채워도 뜨지 않는 이유가 이것이다 — 그 네 티켓이 각자의
# dotted path를 채워 넣기 전까지는 정직하게 못 뜨는 편이 "떠 있는 척하며 아무
# 일도 안 하는 것"보다 낫다는 판단이다.
#
# 어댑터 바인딩(ADR-0007, 한눈에 보기용 — 실제 값은 .env.staging):
#   PG        : FakePGAdapter        -> 토스 "샌드박스"(dotted path, 아직 미구현 —
#               PAYMENT_ADAPTER_MODE=real 이라는 존재하지 않는 값을 하드코딩했던 것이
#               #83이 고친 버그다. 컨테이너는 뜨지만 첫 결제에서야 죽었다)
#   지급대행   : FakePayoutAdapter     -> 토스 지급대행 샌드박스(dotted path, 아직 미구현)
#   Seller 등록 : FakeSellerAdapter     -> 토스 지급대행 셀러 등록(dotted path, 아직
#               미구현 — #50/#57, Payout 확정 후에만 호출된다 — ADR-0020)
#   스토리지   : MinIO(dev)           -> MinIO(서브 호스트, TLS)  (STORAGE_BACKEND=s3)
#   소셜 로그인 : FakeSocialAdapter     -> 카카오/GitHub/구글 실물 (SOCIAL_AUTH_MODE=real)
#   본인확인   : FakeVerificationAdapter -> 실제 PortOne 통합인증 연동(dotted path,
#               아직 미구현 — #85)
#   LLM 채점   : FakeLLMScoringAdapter  -> 실제 OpenAI 어댑터(dotted path, 아직
#               미구현 — #88)
#   AI grill  : FakeRequirementChatAdapter -> contests.requirement_chat.
#               OpenAIRequirementChatAdapter(#55)
#   GitHub 저장소 : FakeGitHubAdapter    -> repositories.adapters.GitHubAPIAdapter(#193)
#   알림 채널  : Fake*Adapter           -> 실제 카카오 알림톡/SMS·LMS 벤더(dotted path로
#               지정, 아직 미구현 — .env.staging에서 반드시 채워야 하는 이유가 이것이다.
#               구현되지 않은 클래스 이름을 여기 하드코딩하지 않는다)
#   이벤트 버스 : FakeEventBus          -> core.events_redis.RedisEventBus(ADR-0046,
#               #380 — 강의실 실시간 신호. 다른 일곱과 달리 구현체는 이미 있다,
#               PG·본인확인 등과 달리 "아직 미구현"이 아니다)
# config/settings.py의 IS_DEPLOYED_ENVIRONMENT 가드가 이 중 하나라도 fake로 남으면
# (dotted path가 가리키는 클래스명이 Fake로 시작해도 마찬가지다) 부팅 자체를 거부한다.
# VERIFICATION_ADAPTER_MODE·PAYMENT_ADAPTER_MODE·PAYOUT_ADAPTER_MODE·SELLER_ADAPTER_MODE·
# LLM_ADAPTER_MODE·LLM_REQUIREMENT_CHAT_ADAPTER_MODE·GITHUB_ADAPTER_MODE(#193)·
# EVENT_BUS_ADAPTER_MODE(#380)는 그
# 값이 "fake"도 아니고 실제로 쓸 수도 없으면(임포트·인스턴스화·계약 충족 중 하나라도 실패하면) 역시
# 부팅을 거부한다(#83, core.adapters.check_adapter_mode — django.core.checks로
# 등록되어 django.setup() 이후에만 평가된다). 그래서 실물 클래스가 없는 지금은
# 알림 채널과 같은 원칙으로 `${VAR:?...}`로 필수값으로 비워 둔다. 실물이
# 생기면(#85/#87/#57/#88) 그 dotted path를 .env.staging에 채운다.
#
# 스케줄러(ADR-0003): redis 브로커 + celery-worker + celery-beat 세 서비스가 반드시
# 함께 떠야 한다. beat가 core/tasks.py에 정의된 여섯 개 내부 스캔 태스크(틱,
# Distribution 1/N 배분, 환불 재확인, Handover Escrow 해제, 야간 알림 발송, 채점 재시도
# — config/celery.py의 beat_schedule 참고)를 60초마다 큐에 넣고, worker가 그걸
# 실제로 실행해 `/api/internal/*`를 호출한다. 코디네이터 리뷰 지적: 이 세 서비스가
# 없으면 시간 기반 전이가 전부 조용히 멈춘다 — dev/CI가 초록인 것과 무관하게, 이
# 스택은 배포된 게 아니라 "떠 있기만 한" 상태가 된다.
#
# 이벤트 서비스(ADR-0046, #380): backend와 같은 이미지를 ASGI로 띄우는 별도
# 서비스(events)가 하나 더 떠야 강의실이 새로고침 없이 화면을 갱신한다 —
# 없어도 다른 기능은 모두 그대로 동작하고 강의실 화면만 폴링으로 물러난다
# (ADR-0046 결과, "신호는 진실의 출처가 아니다").
name: codemit-staging

# **컨테이너 로그를 무제한으로 쌓지 않는다**(2026-09-21). 도커 기본 json-file 은 크기
# 제한이 없어 오래 떠 있는 컨테이너 하나가 호스트 디스크를 먹는다 — sub 에는 이 저장소
# 밖의 컨테이너 로그가 319M·106M 쌓여 있었고, 디스크가 차면 DB·빌드·배포가 한꺼번에
# 멈춘다. 컨테이너당 20MB × 5개(최대 100MB)만 남긴다. 호스트 daemon.json 에도 같은
# 기본값을 써 두었지만 그것은 데몬이 다시 떠야 읽히므로(두 호스트 모두 live-restore
# 가 꺼져 있어 재시작이 곧 전 컨테이너 재시작이다), 우리 서비스는 여기서 직접 건다 —
# 다음 배포의 컨테이너 교체부터 적용된다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-backend-env: &backend-env
  # --- 배포 타깃(config/settings.py의 IS_DEPLOYED_ENVIRONMENT/IS_PRODUCTION_DEPLOYMENT
  # 가드가 이 값을 본다) ---
  CODEMIT_DEPLOYMENT_TARGET: staging
  DJANGO_DEBUG: "false"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?staging DJANGO_SECRET_KEY 를 .env.staging 에 설정하라}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?staging DJANGO_ALLOWED_HOSTS 를 .env.staging 에 설정하라}
  # --- 오류 수집 (GlitchTip, 2026-09-16) ---
  # DSN 이 없으면 SDK 가 꺼진 채로 돈다(core/observability.py) — 그래서 `:-` 다.
  # 릴리스는 deploy.sh 가 배포하는 커밋 SHA 를 넘긴다.
  SENTRY_DSN: ${SENTRY_DSN_BACKEND:-}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}

  # 공모전 제품 스위치 — 「공모전 / 유료 공모전」 둘 (#271/#413, `core.contest_switch`,
  # ADR-0048). 기본값은 둘 다 켜짐(config/settings.py)이지만, staging은 **유료만**
  # 이 기본을 꺼짐으로 겹쳐 쓴다 — 공모전 자체(목록·상세·무료 개최·제출·채점·수상)는
  # 이제 켜진 채다. `CODEMIT_DEPLOYMENT_TARGET`과는 무관한 독립 값들이다 —
  # `.env.staging`에 `CODEMIT_PAID_CONTEST_PRODUCT_ENABLED=true` 한 줄만 추가하면
  # (그리고 아래 frontend build.args도 같은 값을 읽으므로 frontend 재빌드까지 함께)
  # 유료도 다시 켜진다. 닫히는 표면 전체 목록은 `backend/core/contest_switch.py`
  # 모듈 docstring에 있다.
  CODEMIT_CONTEST_PRODUCT_ENABLED: ${CODEMIT_CONTEST_PRODUCT_ENABLED:-true}
  CODEMIT_PAID_CONTEST_PRODUCT_ENABLED: ${CODEMIT_PAID_CONTEST_PRODUCT_ENABLED:-false}

  POSTGRES_DB: ${POSTGRES_DB:?staging POSTGRES_DB 를 .env.staging 에 설정하라}
  POSTGRES_USER: ${POSTGRES_USER:?staging POSTGRES_USER 를 .env.staging 에 설정하라}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?staging POSTGRES_PASSWORD 를 .env.staging 에 설정하라}
  # 연결 풀러(pgbouncer, #453/#458) 뒤에 붙는다 — DB 를 직접 가리키지 않는다.
  # 되돌리는 법: 이 값을 다시 `db`로(포트는 5432) 돌리면 이전 상태로 즉시
  # 돌아간다(풀러 컨테이너 자체를 지울 필요는 없다).
  POSTGRES_HOST: pgbouncer
  POSTGRES_PORT: "6432"
  # 풀러가 트랜잭션 모드라 서버측(named) 커서가 깨진다 — dev pgbouncer
  # 프로필로 직접 재현해 확인했다(#457, CLAUDE.md·config/settings.py 참고).
  CODEMIT_DB_DISABLE_SERVER_SIDE_CURSORS: "true"
  # 연결 사용률 경고 스캔(#455)만은 **풀러를 건너뛰고 DB 자체**를 본다 —
  # 앱이 보는 수는 풀러가 흡수한 뒤의 것이라 「상한에 얼마나 가까운가」를
  # 말해 주지 못한다(2026-09-18 장애를 일으킨 숫자는 서버 연결 수였다).
  DB_MONITOR_HOST: db
  DB_MONITOR_PORT: "5432"
  DB_CONNECTION_MONITOR_ALIAS: monitor

  # --- 스토리지 어댑터 (ADR-0005, ADR-0007): 실제 S3/OCI 버킷 ---
  STORAGE_BACKEND: s3
  STORAGE_BUCKET: ${STORAGE_BUCKET:?}
  STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:?}
  # 브라우저가 presigned PUT 을 직접 쏘는 주소(ADR-0005). MinIO 를 쓰는 staging 에서는
  # 컨테이너가 붙는 주소와 갈릴 수 있어 명시한다 — 비면 STORAGE_ENDPOINT_URL 을
  # 물려받는다(config/settings.py).
  STORAGE_PUBLIC_ENDPOINT_URL: ${STORAGE_PUBLIC_ENDPOINT_URL:-}
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?}
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?}
  STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
  # 공개 이미지 버킷 (#233, ADR-0032) — 소스가 사는 위 버킷과 물리적으로 분리된다.
  STORAGE_IMAGES_BUCKET: ${STORAGE_IMAGES_BUCKET:?}
  STORAGE_IMAGES_BASE_URL: ${STORAGE_IMAGES_BASE_URL:?}

  # --- Authentication (ADR-0012) ---
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?}

  # --- 소셜 로그인 / 본인확인 어댑터 (ADR-0007, ADR-0011, ADR-0024) ---
  SOCIAL_AUTH_MODE: real
  # 카카오 OAuth 앱 자격증명(#95/#96) — authorize 리다이렉트・code→token 교환은
  # frontend 서비스(BFF)가 지므로 이 값들을 실제로 쓰는 건 backend가 아니라
  # frontend다(아래 frontend 서비스의 environment도 같은 .env.staging 줄을
  # 나눠 읽는다). 그런데도 여기서 요구하는 이유는 배포 스택의 "떴다/안 떴다"
  # 신호를 backend 컨테이너 하나로 모으기 위해서다(CODEMIT_OPERATOR_ORIGIN과
  # 같은 원칙) — 비면 core.settings의 부팅 가드가 거부한다.
  KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:?staging KAKAO_REST_API_KEY 를 .env.staging 에 설정하라}
  KAKAO_SECRET_KEY: ${KAKAO_SECRET_KEY:?staging KAKAO_SECRET_KEY 를 .env.staging 에 설정하라}
  # 카카오 콘솔에 등록한 값과 정확히 같아야 한다 — 한 글자만 달라도 code→token
  # 교환이 거절된다.
  KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:?staging KAKAO_REDIRECT_URI 를 .env.staging 에 설정하라 — 카카오 콘솔에 등록한 값과 정확히 같아야 한다}
  # 실물 PortOne V2 통합인증 어댑터가 #85로 생겼다 — "real"은 dotted path가
  # 아니라 부팅이 통과하고 첫 본인확인 요청에서야 죽었다(#83이 고친 버그).
  # 여기는 verification.adapters.PortOneV2VerificationAdapter를 채운다. 채널은
  # KG이니시스 통합인증이고, 카카오는 CI를 안 줘서 인증 수단에서 뺐다(ADR-0024)
  # — 코드는 그 설정이 되돌려져도 VerificationMissingCIError로 안전하다.
  VERIFICATION_ADAPTER_MODE: ${VERIFICATION_ADAPTER_MODE:?verification.adapters.PortOneV2VerificationAdapter를 .env.staging 에 채워라(#85)}
  VERIFICATION_ENCRYPTION_KEY: ${VERIFICATION_ENCRYPTION_KEY:?}
  # PortOneV2VerificationAdapter가 서버-투-서버 조회(GET /identity-verifications/{id})
  # 에 쓰는 자격증명 — 콜백 URL이 없어 도메인·TLS 없이도 동작한다. 채널키는
  # 브라우저 SDK가 인증창을 열 때도 쓰므로 프론트(CODEMIT_PUBLIC_PORTONE_CHANNEL_KEY)
  # 에도 같은 값을 준다.
  PORT_ONE_V2_STORE_ID: ${PORT_ONE_V2_STORE_ID:?}
  PORT_ONE_V2_SECRET_KEY: ${PORT_ONE_V2_SECRET_KEY:?}

  # --- 결제 · Escrow / Payout 어댑터 (ADR-0007, ADR-0008) ---
  # "샌드박스냐 실물이냐"는 이 모드 값이 아니라 실제 어댑터 구현체가 참조하는
  # TOSS_* 자격증명이 어느 엔드포인트를 가리키는지로 갈린다. 결제는
  # payments.adapters_toss.TossPGAdapter(#87), 지급대행/Seller 등록은
  # payouts.adapters_toss.TossPayoutAdapter/TossSellerAdapter(#57)를 dotted
  # path로 채운다 — 위 VERIFICATION_ADAPTER_MODE와 같은 이유로 필수값으로
  # 비워 둔다.
  PAYMENT_ADAPTER_MODE: ${PAYMENT_ADAPTER_MODE:?실제 PG 어댑터의 dotted path를 .env.staging 에 채워라 — 아직 구현 전이면(#87) 이 값 자체를 비워 둘 수 없다}
  PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?}
  PAYOUT_ADAPTER_MODE: ${PAYOUT_ADAPTER_MODE:?실제 지급대행 어댑터의 dotted path를 .env.staging 에 채워라 — 아직 구현 전이면 이 값 자체를 비워 둘 수 없다}
  PAYOUT_WEBHOOK_SECRET: ${PAYOUT_WEBHOOK_SECRET:?}
  # Seller(수취인) 등록은 지급과 별개 API·별개 시점이다(#50, ADR-0020) — Payout이
  # 확정된 뒤에만 호출된다.
  SELLER_ADAPTER_MODE: ${SELLER_ADAPTER_MODE:?실제 Seller 등록 어댑터의 dotted path를 .env.staging 에 채워라 — 아직 구현 전이면(#57) 이 값 자체를 비워 둘 수 없다}
  TOSS_SANDBOX_SECRET_KEY: ${TOSS_SANDBOX_SECRET_KEY:-}
  # 셀러 등록·수정·지급 요청 세 API의 JWE 암호화 + payout.changed/
  # seller.changed 웹훅 서명 검증에 쓰는 보안 키(#57) — TOSS_SANDBOX_SECRET_KEY와
  # 별개 값이다.
  TOSS_API_SECURE_KEY: ${TOSS_API_SECURE_KEY:-}

  # --- LLM 채점 · AI grill 어댑터 (ADR-0006/0007/0014) ---
  # AI 채점의 실물 어댑터는 scoring.adapters.OpenAIScoringAdapter다(#88) —
  # LLM_ADAPTER_MODE를 그 dotted path로 채운다. "real"은 dotted path가 아니라
  # core.adapters.check_adapter_mode(#83)가 부팅 시점에 거부한다(예전에는
  # "fake가 아니라는 것"만 봐서 부팅은 통과하고 첫 채점 시도에서야
  # NotImplementedError로 죽었다). AI grill의 실물 어댑터는 contests.
  # requirement_chat.OpenAIRequirementChatAdapter다(#55) — 채점과 같은
  # OPEN_AI_API_KEY를 공유하지만 설정 키(LLM_REQUIREMENT_CHAT_ADAPTER_MODE)는
  # 별개다. 값을 명시적으로 요구하는 이유는 그대로다 — 비워 두면 fake로
  # 조용히 뜨는 게 아니라 부팅이 거부되어야 한다(#83).
  LLM_ADAPTER_MODE: ${LLM_ADAPTER_MODE:?실제 LLM 채점 어댑터의 dotted path를 .env.staging 에 채워라 — scoring.adapters.OpenAIScoringAdapter(#88)}
  # 강의실 채점(#287, #340)은 이 값과 별개다 — classroom.scoring이 강사 본인의
  # 키로 어댑터를 직접 만들고(LLM_ADAPTER_MODE·OPEN_AI_API_KEY를 거치지 않는다),
  # 이 설정은 그 경로가 fake를 쓸지 실물(core.llm_scoring.OpenAIScoringAdapter)을
  # 쓸지만 가른다(ADR-0043). 비워 두면 위 다섯 값과 같은 이유로 부팅이 거부된다.
  CLASSROOM_SCORING_ADAPTER_MODE: ${CLASSROOM_SCORING_ADAPTER_MODE:?강의실 채점 어댑터의 dotted path를 .env.staging 에 채워라 — core.llm_scoring.OpenAIScoringAdapter(#340)}
  LLM_REQUIREMENT_CHAT_ADAPTER_MODE: ${LLM_REQUIREMENT_CHAT_ADAPTER_MODE:?실제 AI grill 어댑터의 dotted path를 .env.staging 에 채워라 — contests.requirement_chat.OpenAIRequirementChatAdapter(#55)}
  OPEN_AI_API_KEY: ${OPEN_AI_API_KEY:-}
  # scoring.adapters.OpenAIScoringAdapter가 읽는 선택 설정(#88 코드리뷰 지적 6)
  # — 여기 없으면 컨테이너 안에서는 항상 기본값(모델 gpt-4o-mini, temperature
  # 0)으로 고정되고 .env.staging에 무엇을 채워도 반영되지 않는다.
  LLM_OPENAI_MODEL: ${LLM_OPENAI_MODEL:-gpt-4o-mini}
  LLM_OPENAI_TEMPERATURE: ${LLM_OPENAI_TEMPERATURE:-0}
  # contests.requirement_chat.OpenAIRequirementChatAdapter의 전용 temperature다
  # (#55 코드리뷰 지적 4) — 위 LLM_OPENAI_TEMPERATURE(채점, 결정적이어야
  # 컷라인이 안정적이다)와 절대 같은 키를 쓰지 않는다. 비우면 기본값 0.7(대화가
  # 매 턴 기계적으로 똑같아지지 않게 한다).
  LLM_REQUIREMENT_CHAT_OPENAI_TEMPERATURE: ${LLM_REQUIREMENT_CHAT_OPENAI_TEMPERATURE:-0.7}

  # --- GitHub 저장소 어댑터 (#193, ADR-0007/0027) ---
  # 실물 어댑터는 repositories.adapters.GitHubAPIAdapter다 — GITHUB_ADAPTER_MODE를
  # 그 dotted path로 채운다. 위 다섯 값과 같은 이유로 비워 두면 fake로 조용히
  # 뜨는 게 아니라 부팅이 거부된다(#83).
  GITHUB_ADAPTER_MODE: ${GITHUB_ADAPTER_MODE:?실제 GitHub 어댑터의 dotted path를 .env.staging 에 채워라 — repositories.adapters.GitHubAPIAdapter(#193)}
  # 선택값이다 — 공개 저장소 조회·다운로드는 인증 없이도 되고(익명 요청은
  # 시간당 요청 한도만 낮다), 참가자의 GitHub 자격증명이 아니라 platform 자신의
  # 것이라 없어도 부팅을 막지 않는다(ADR-0027 — read-only 토큰을 받지 않는다는
  # 결정은 참가자 자격증명 이야기이지 이 값과는 다른 층위다).
  GITHUB_API_TOKEN: ${GITHUB_API_TOKEN:-}
  # 소스 변환 플러그인(#496) — Packet Tracer(#497)를 켠다(#498: 사용자 판단, 약관에
  # 면책 조항을 두고 켠다 — docs/legal/contracts-and-ip.md 열린 항목 13). staging 에서
  # 실제 .pkt 채점을 확인한 뒤 prod 를 켠다. 끄려면 빈 문자열("")로 둔다.
  SOURCE_CONVERTERS: core.source_converters.packet_tracer.PacketTracerConverter

  # --- 알림 채널 어댑터 (ADR-0007/0009) ---
  # 코디네이터 리뷰 지적: 여기 존재하지 않는 클래스 이름(RealAlimtalkAdapter 등)을
  # 하드코딩했었다 — notifications.adapters에 그런 클래스가 없으니 이 값을 쓰는
  # 순간(과거에는 그 시점에 500까지 났다. 지금은 notifications/services.py의
  # try/except가 다음 채널로 넘기지만, 여전히 "설정이 뭔가를 가리키는 척하지만 실제로는
  # 아무것도 안 한다"는 문제는 남는다) 매번 채널 폴백이 소모된다. 실제 벤더 어댑터가
  # 구현되면 그 dotted path를 .env.staging에 채워 넣는다 — 그 전까지는 필수값으로
  # 비워 둬 운영자가 "아직 없다"는 것을 명시적으로 알게 한다.
  # #51: 알리고(Aligo) SMS/LMS 실물 어댑터가 이제 존재한다 —
  # notifications.adapters_aligo.AligoSmsAdapter / AligoLmsAdapter. 알림톡은
  # 사업자등록·채널 개설·템플릿 사전심사가 끝나기 전까지 AligoAlimtalkAdapter가
  # 항상 실패를 돌려줘 SMS로 대체발송한다(ADR-0009) — 승인이 나면 이 값을 실제
  # 카카오 알림톡 어댑터로 바꾼다.
  NOTIFICATION_ALIMTALK_ADAPTER: ${NOTIFICATION_ALIMTALK_ADAPTER:?실제 알림톡 벤더 어댑터의 dotted path를 .env.staging 에 채워라 — 승인 전이면 notifications.adapters_aligo.AligoAlimtalkAdapter(#51)를 채운다}
  NOTIFICATION_SMS_ADAPTER: ${NOTIFICATION_SMS_ADAPTER:?실제 SMS 벤더 어댑터의 dotted path를 .env.staging 에 채워라 — notifications.adapters_aligo.AligoSmsAdapter(#51)}
  NOTIFICATION_LMS_ADAPTER: ${NOTIFICATION_LMS_ADAPTER:?실제 LMS 벤더 어댑터의 dotted path를 .env.staging 에 채워라 — notifications.adapters_aligo.AligoLmsAdapter(#51)}
  # 알리고 자격증명(#51) — AligoSmsAdapter/AligoLmsAdapter/AligoAlimtalkAdapter가
  # 인자 없이 생성되는 시점(core.adapters.resolve_adapter)에 읽는다. 비어 있으면
  # 그 생성 자체가 ImproperlyConfigured로 실패해 core.adapters.check_adapter_mode가
  # core.E002로 부팅을 거부한다(dev는 위 세 값이 기본 fake라 이 클래스 자체가
  # 생성되지 않으므로 영향받지 않는다).
  ALIGO_API_KEY: ${ALIGO_API_KEY:-}
  ALIGO_USER_ID: ${ALIGO_USER_ID:-}
  ALIGO_SENDER_PHONE_NUMBER: ${ALIGO_SENDER_PHONE_NUMBER:-}

  # --- 내부 인증(스케줄러 틱 외 5개 내부 스캔, ADR-0003) ---
  # staging의 존재 이유 중 하나: 운영자가 이 토큰으로 POST /api/internal/tick 을 직접
  # 쏴서 21일치 시나리오를 몇 초에 재현한다. 아래 backend 서비스의 ports: 로 서브
  # 호스트에 공개하는 이유가 이것이다 — prod(compose.prod.yaml)는 이 엔드포인트를
  # 운영자가 손으로 두드릴 일을 상정하지 않는다. celery-worker/celery-beat도 같은
  # 토큰으로 같은 엔드포인트들을 내부 네트워크에서 호출한다.
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
  INTERNAL_API_BASE_URL: http://backend:8000

  # --- Celery (ADR-0003) ---
  # Operator 세션(#43, ADR-0018) — 브로커와 같은 인스턴스, 다른 DB 인덱스.
  # 운영자 앱의 오리진(#43). 비면 부팅이 거부된다 — Host 헤더 유도는
  # 리버스 프록시 구성에 따라 어긋나 모든 변경 요청이 403 이 된다.
  CODEMIT_OPERATOR_ORIGIN: ${CODEMIT_OPERATOR_ORIGIN:?CODEMIT_OPERATOR_ORIGIN 을 설정해야 한다}
  # 강의실 앱의 공개 오리진(#512, ADR-0052) — 연결된 앱의 OAuth·MCP 메타데이터가
  # issuer·resource 로 내보내는 주소다. 강의실 서비스와 **같은 `.env` 줄**이다. 비어도
  # 부팅은 막지 않는다 — 그때는 강의실 앱이 실어 보낸 자기 오리진을 쓴다.
  CODEMIT_CLASSROOM_ORIGIN: ${CODEMIT_CLASSROOM_ORIGIN:-}
  SESSION_REDIS_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0

  # --- 이벤트 버스 (ADR-0046, #380) ---
  # 강의실 실시간 신호. 다른 *_ADAPTER_MODE와 같은 원칙 — fake로 남으면
  # config/settings.py의 IS_DEPLOYED_ENVIRONMENT 가드가 부팅을 거부한다(#380).
  # 실물 어댑터는 core.events_redis.RedisEventBus 하나뿐이다(dev와 같은 값).
  EVENT_BUS_ADAPTER_MODE: ${EVENT_BUS_ADAPTER_MODE:?이벤트 버스 어댑터의 dotted path를 .env.staging 에 채워라 — core.events_redis.RedisEventBus(ADR-0046)}
  # Celery 브로커(DB 0)·Operator 세션(DB 1)과 같은 Redis, 다른 DB 인덱스(2) —
  # compose.dev.yaml의 backend/events 서비스와 같은 값이다.
  EVENT_BUS_REDIS_URL: redis://redis:6379/2

  # --- 공모전 검색 (#450/#451, 부모 #444 스펙, ADR-0007) ---
  # 다른 *_ADAPTER_MODE와 다르다 — 값이 없어도 부팅이 막히지 않도록 **컴포즈
  # 레벨 기본값을 실물 dotted path로 준다**(#451 AC "첫 배포에서 막히지 않게",
  # 설정 이름은 코디네이터가 2026-09-17에 고정했다). `.env.staging`이 이 값을
  # 몰라도 검색 서비스가 뜨는 한 실물로 돈다 — 그래도 **일부러** fake로
  # 덮어쓰면(dev처럼) 아래 `IS_DEPLOYED_ENVIRONMENT` 가드가 그때는 부팅을
  # 거부한다. "값이 없다"와 "일부러 fake로 낮췄다"는 다른 사실이다.
  SEARCH_ADAPTER_MODE: ${SEARCH_ADAPTER_MODE:-contests.search_opensearch.OpenSearchContestSearch}
  # 아래 search 서비스 — 내부망 전용, 호스트 포트를 내지 않는다.
  OPENSEARCH_URL: ${OPENSEARCH_URL:-http://search:9200}

services:
  db:
    logging: *default-logging
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?staging POSTGRES_DB 를 .env.staging 에 설정하라}
      POSTGRES_USER: ${POSTGRES_USER:?staging POSTGRES_USER 를 .env.staging 에 설정하라}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?staging POSTGRES_PASSWORD 를 .env.staging 에 설정하라}
    volumes:
      - codemit-staging-db:/var/lib/postgresql/data
    healthcheck:
      # compose.dev.yaml과 같은 이유로 -h 를 명시한다 — 초기화 중 유닉스 소켓 임시
      # 서버에 healthy로 오판되는 걸 막는다.
      test: [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis: # Celery 브로커 + 결과 백엔드(ADR-0003). beat/worker 전용 — 호스트에 공개하지 않는다.
    logging: *default-logging
    image: redis:7-alpine
    # AOF 는 기본으로 꺼져 있다. 세션을 여기 얹었으므로(#43) 켜지 않으면 RDB
    # 스냅샷 창 안의 재시작이 조사 중인 운영자를 전부 튕긴다 — dev 와 같은 이유다.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - codemit-staging-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # 공모전 검색 실물 어댑터(#450/#451, 부모 #444 스펙)가 붙는 OpenSearch.
  # **backend와 같은 원칙으로 이미지는 CI가 굽고 여기서는 받기만 한다** —
  # amd64 태그(이 호스트=sub의 아키텍처). 단일 노드·JVM 힙 1GB·컨테이너 메모리
  # 한도 2GB(`mem_limit`), 보안 플러그인은 끈다(`DISABLE_SECURITY_PLUGIN`) —
  # dev `search` 프로필(docker/compose.dev.yaml)과 같은 값이다. **호스트
  # 포트를 내지 않는다** — `ports:`가 없다(위 redis와 같은 원칙, 내부망
  # 전용). 색인은 DB에서 언제든 다시 만들 수 있어(부모 스펙) 볼륨을
  # 백업하지 않는다 — `db-backups/`처럼 오브젝트 스토리지에 올리는 코드가
  # 없다.
  search:
    logging: *default-logging
    image: ${CODEMIT_IMAGE_REPO:-ghcr.io/sandcorporation}/codemit-search:${CODEMIT_IMAGE_TAG:-local}-amd64
    build:
      context: ..
      dockerfile: docker/search.Dockerfile
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    mem_limit: 2g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - codemit-staging-search:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Postgres 앞 연결 풀러(pgbouncer, #453/#457/#458) — dev pgbouncer 프로필과
  # 같은 이미지(docker/pgbouncer.Dockerfile), amd64 태그(이 호스트=sub의
  # 아키텍처). **backend·celery-worker·celery-beat·events 넷은 이제 DB 를
  # 직접 가리키지 않고 이 서비스를 가리킨다**(위 x-backend-env의
  # POSTGRES_HOST=pgbouncer) — search 와 반대로 이 서비스가 죽으면 그 넷은
  # 애초에 뜨지 못한다(그 넷의 depends_on이 `service_healthy`로 기다린다,
  # search 는 `service_started`뿐이다). **되돌리는 법**: x-backend-env의
  # POSTGRES_HOST/PORT를 다시 `db`/`5432`로(그리고
  # CODEMIT_DB_DISABLE_SERVER_SIDE_CURSORS를 `false`로) 되돌리면 앱이 DB를
  # 직접 가리키던 이전 상태로 즉시 돌아간다 — 이 서비스 자체를 지울 필요는
  # 없다. **호스트 포트를 내지 않는다** — search 와 같은 원칙, 내부망 전용.
  pgbouncer:
    logging: *default-logging
    image: ${CODEMIT_IMAGE_REPO:-ghcr.io/sandcorporation}/codemit-pgbouncer:${CODEMIT_IMAGE_TAG:-local}-amd64
    build:
      context: ..
      dockerfile: docker/pgbouncer.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?staging POSTGRES_USER 를 .env.staging 에 설정하라}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?staging POSTGRES_PASSWORD 를 .env.staging 에 설정하라}
      PGBOUNCER_POOL_MODE: transaction
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "6432"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    logging: *default-logging
    # **이미지는 CI 가 굽고 여기서는 받기만 한다**(2026-09-17). amd64 태그는 이 호스트의
    # 아키텍처다 — staging(sub)은 amd64, prod(oracle)는 arm64. backend·celery-worker·
    # celery-beat·events·grader 가 **같은 이미지 이름**을 쓴다 — 예전에는 공유 태그가 없어
    # compose 가 이미지를 넷 만들었고, 하나만 갈면 나머지가 옛 코드로 남았다.
    # `build:` 은 비상용 로컬 빌드(`DEPLOY_IMAGE_SOURCE=build`)를 위해 남긴다.
    image: ${CODEMIT_IMAGE_REPO:-ghcr.io/sandcorporation}/codemit-backend:${CODEMIT_IMAGE_TAG:-local}-amd64
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 헬스가 아니라 시작 순서만이다(`service_started`) — 검색이 죽어도
      # backend는 떠야 한다(DB 검색으로 물러난다, `contests.search.
      # search_contests`). 헬스로 묶으면 검색 하나 때문에 배포 전체가
      # 막힌다.
      search:
        condition: service_started
    environment: *backend-env
    # **호스트 포트를 열지 않는다**(#485). 배포는 이 서비스를 잠시 둘로 늘려 새 것을 먼저
    # 띄운 뒤 옛 것을 내린다(deploy.sh 의 rolling_replace) — 같은 서비스 둘이 한 호스트
    # 포트를 잡을 수 없다. 이 포트를 쓰던 곳이 없었다: 배포 헬스 체크는 컨테이너 안에서
    # 치고, 세 앱은 compose 네트워크의 `backend:8000` 으로 간다. 내부 API 를 손으로 칠
    # 때는 `docker exec <이 컨테이너>` 안에서 친다(CLAUDE.md).
    # **migrate 는 여기서 부르지 않는다**(#526, ADR-0053) — deploy.sh 가 넷을 바꾸기 전에
    # 새 이미지의 일회성 컨테이너에서 한 번 돌린다(run_migrations). 기동 때 돌리면 겹쳐
    # 바꾸는 동안 스키마가 바뀌는 시점을 배포가 고르지 못한다. 그래서 이 compose 로 손수
    # 처음 띄우는 DB 는 `docker compose run --rm backend python manage.py migrate` 를 먼저 친다.
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn -c config/gunicorn.conf.py config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  celery-worker:
    logging: *default-logging
    image: ${CODEMIT_IMAGE_REPO:-ghcr.io/sandcorporation}/codemit-backend:${CODEMIT_IMAGE_TAG:-local}-amd64
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        # 시작 순서만이다. 마이그레이션은 넷 중 누구도 돌리지 않는다 — deploy.sh 가 넷을
        # 바꾸기 전에 일회성 컨테이너 하나에서 돌린다(동시에 둘이 migrate 하지 않게, ADR-0053).
        condition: service_started
      search:
        condition: service_started
    environment: *backend-env
    # 기본 큐(`celery`)만 소비한다 — 스캔·알림·백업·검색 색인. 강의실 채점은 Celery 가
    # 아니라 아래 `grader` 가 한다(#584, ADR-0059).
    command: celery -A config worker -Q celery --loglevel info

  # 강의실 채점 grader(#584, ADR-0059) — 상주 프로세스 하나가 DB 의 큐(`scoring_queued_at`)에서
  # 시도를 집어 비동기로 채점한다(브로커 없음). 벤더를 기다리는 건 코루틴이라 전역 64건·연결(클래스)
  # 당 8건(`CLASSROOM_GRADER_*`)을 한 프로세스가 돌리고, 기다리는 동안 DB 연결·잠금이 없다. 한
  # 개만 띄운다 — 둘이 떠도 임대가 「벤더 한 번」을 지키지만 연결당 상한은 프로세스 안의 값이다.
  #
  # **따뜻한 종료를 4분 기다린다**(`stop_grace_period`) — 임대 시간(240초)만큼. SIGTERM 을 받은
  # grader 는 새 후보를 잡지 않고 하던 채점을 마저 끝낸다. 그래도 끊기면(SIGKILL) 그 시도는 임대가
  # 만료된 뒤 다시 줍힌다.
  grader:
    logging: *default-logging
    image: ${CODEMIT_IMAGE_REPO:-ghcr.io/sandcorporation}/codemit-backend:${CODEMIT_IMAGE_TAG:-local}-amd64
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      search:
        condition: service_started
    environment: *backend-env
    stop_grace_period: 4m
    # 상한이 없으면 메모리를 다 쓰는 일이 같은 호스트의 DB 까지 OOM 에 끌어들일 수 있다(#584 점검).
    # 64건의 요청·응답 본문(응답은 `SAFE_OUTBOUND_RESPONSE_MAX_BYTES` 까지)·소스 읽기에 넉넉한 값이다.
    mem_limit: 1g
    command: python manage.py grader

  celery-beat:
    logging: *default-logging
    image: ${CODEMIT_IMAGE_REPO:-ghcr.io/sandcorporation}/codemit-backend:${CODEMIT_IMAGE_TAG:-local}-amd64
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      search:
        condition: service_started
    environment: *backend-env
    # config/celery.py의 beat_schedule(틱 + 5개 내부 스캔)을 60초 주기로 큐에 넣는다.
    # 스케줄 상태 파일은 컨테이너 로컬이라 재시작하면 초기화되지만, ADR-0003이 이미
    # "스캔 주기만큼 늦어지는 건 무해하다"고 규정했으므로 영속 볼륨이 굳이 필요 없다.
    command: celery -A config beat --loglevel info

  # 이벤트 서비스(ADR-0046, #380) — 같은 backend 이미지를 ASGI로 띄우는 별도
  # 프로세스다(compose.dev.yaml의 events 서비스와 같은 설계). 기존 API
  # (`backend`)는 그대로 동기 gunicorn이다 — SSE 연결 하나가 그 워커 풀을
  # 붙잡지 않게 스트림만 이 프로세스가 연다. URLconf는 backend와 완전히
  # 같은 코드이고 settings.py도 하나뿐이므로, **backend와 같은 x-backend-env
  # 전체**를 받아야 한다 — STORAGE_*·PAYMENT_* 등 이 프로세스가 실제로 쓰지
  # 않는 값도 settings.py 모듈 임포트 시점에 똑같이 요구되기 때문이다(celery-
  # worker·beat가 스캔용 어댑터를 안 쓰면서도 같은 환경을 받는 것과 같은
  # 이유). `migrate`는 여기서 부르지 않는다 — deploy.sh 가 넷을 바꾸기 전에 한 번 돌린다(ADR-0053).
  events:
    logging: *default-logging
    image: ${CODEMIT_IMAGE_REPO:-ghcr.io/sandcorporation}/codemit-backend:${CODEMIT_IMAGE_TAG:-local}-amd64
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      search:
        condition: service_started
    # 강의실 BFF 는 `http://events:8001` 로 중계하므로 Host 가 `events` 다 — backend 의
    # 허용 목록(.env.staging 의 DJANGO_ALLOWED_HOSTS, 거기엔 `backend` 가 있다)만 받으면
    # Django 가 모든 스트림 요청을 400(DisallowedHost)으로 돌려보낸다. staging 첫 배포에서
    # 실제로 그렇게 막혀 화면이 폴링으로만 돌았다(#380 후속). 비밀 파일이 아니라 여기서
    # 이 서비스의 호스트 이름만 덧붙인다 — 첫 항목은 그대로라 헬스 체크 규약도 그대로다.
    environment:
      <<: *backend-env
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?staging DJANGO_ALLOWED_HOSTS 를 .env.staging 에 설정하라},events
    command: >
      sh -c "uvicorn config.asgi:application --host 0.0.0.0 --port 8001"
    # **열 수 있는 파일 개수를 올린다**(2026-09-18). SSE 스트림 하나가 소켓 1 +
    # Redis 구독 1 = 서술자 2개를 쓰는데, 컨테이너 기본 soft 한도가 1024 라
    # 동시 시청자 **약 500명**에서 `Too many open files` 로 막혔다 — staging 에서
    # 1500개를 붙여 실제로 그 지점을 쟀다(505개 성공, 나머지 500 오류). CPU·메모리는
    # 그때도 거의 놀고 있었으므로 이것은 자원이 아니라 한도의 문제다. hard 한도는
    # 이미 524288 이라 soft 만 올린다 — 검색 서비스가 쓰는 것과 같은 값이다.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # 프론트엔드 BFF(ADR-0016, FE-13 #38). frontend.Dockerfile의 runner 스테이지 —
  # 소스 바인드 마운트도 `next dev`도 없다, standalone 산출물을 `node server.js`로
  # 그대로 돈다. instrumentation.ts가 CODEMIT_DEPLOYMENT_TARGET=staging에서
  # CODEMIT_WEB_ORIGIN·CODEMIT_API_BASE_URL이 비어 있으면 이 컨테이너를 그 자리에서
  # 죽인다 — restart: unless-stopped라도 값이 안 채워지면 재시작을 반복할 뿐 절대
  # 뜨지 않는다(의도된 동작).
  frontend:
    logging: *default-logging
    # `-amd64` — 앱 이미지는 환경을 모르고 아키텍처로만 갈린다(#711, ADR-0062). 공개 값은
    # 아래 `environment:` 의 `CODEMIT_PUBLIC_*` 로 실행 때 받는다(`build:` 은 비상용 로컬 빌드용).
    image: ${CODEMIT_IMAGE_REPO:-ghcr.io/sandcorporation}/codemit-frontend:${CODEMIT_IMAGE_TAG:-local}-amd64
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      # 공개 설정(#711, ADR-0062) — 서버가 읽고 루트 레이아웃이 브라우저로 넘긴다
      # (`frontend/lib/public-config.ts`). 비밀을 `CODEMIT_PUBLIC_*` 이름으로 넣지 않는다.
      # 오류 수집(GlitchTip) — 앱마다 다른 프로젝트(DSN). release 는 deploy.sh 가 export 하는 배포 커밋이다.
      CODEMIT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_FRONTEND:-}
      CODEMIT_PUBLIC_SENTRY_ENVIRONMENT: staging
      CODEMIT_PUBLIC_SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      # 방문 메트릭 스니펫(Sandcorp 공통, #785) — 사용자가 보는 두 앱(frontend·classroom)만, operator 는 없다.
      # 비어 있으면 루트 레이아웃이 태그를 그리지 않는다(`<앱>/lib/public-config.ts` metricsSnippetSrc).
      CODEMIT_PUBLIC_METRICS_SNIPPET_URL: ${METRICS_SNIPPET_URL:-}
      # 포트원 본인확인 브라우저 SDK — 백엔드가 서버-투-서버 조회에 쓰는 것과 같은 줄을 나눠 읽는다.
      CODEMIT_PUBLIC_PORTONE_STORE_ID: ${PORT_ONE_V2_STORE_ID:?}
      CODEMIT_PUBLIC_PORTONE_CHANNEL_KEY: ${KG_INICIS_CHANNEL_KEY:?}
      # 토스 결제창 브라우저 SDK의 클라이언트 키(#112·#115) — 비면 compose 가 여기서 거부하고,
      # 그래도 빈 값으로 뜨면 instrumentation.ts 의 부팅 가드가 컨테이너를 죽인다.
      CODEMIT_PUBLIC_TOSS_CLIENT_KEY: ${TOSS_SANDBOX_CLIENT_KEY:?토스 결제창 브라우저 SDK 클라이언트 키를 .env.staging 의 TOSS_SANDBOX_CLIENT_KEY 에 설정하라}
      # 약관·방침의 문의 주소(개인정보 보호법 제30조 제1항의 필수 기재사항, #472 후속).
      CODEMIT_PUBLIC_SUPPORT_EMAIL: ${SUPPORT_EMAIL:?방침에 싣는 문의 주소를 .env.staging 의 SUPPORT_EMAIL 에 설정하라}
      # 공모전 제품 스위치(#271/#413) — 백엔드의 CODEMIT_CONTEST_PRODUCT_ENABLED 등과 같은 줄을 나눠
      # 읽는다(둘이 어긋나면 링크는 보이는데 API 가 404 다). ADR-0048: 공모전 켜짐·유료 꺼짐.
      CODEMIT_PUBLIC_CONTEST_PRODUCT_ENABLED: ${CODEMIT_CONTEST_PRODUCT_ENABLED:-true}
      CODEMIT_PUBLIC_PAID_CONTEST_PRODUCT_ENABLED: ${CODEMIT_PAID_CONTEST_PRODUCT_ENABLED:-false}
      # 로그인이 끝나고 강의실로 돌려보낼 때 대조하는 허용목록(#297 후속).
      # 강의실 컨테이너가 읽는 것과 **같은 `.env` 줄**이다(CODEMIT_OPERATOR_ORIGIN 과
      # 같은 원칙) — 어긋나면 복귀가 조용히 안 되고 사람은 공개 앱에 남는다.
      # 안전한 쪽으로 실패하지만 원인을 찾기 어려우니 한 줄로 맞춰 둔다.
      CODEMIT_CLASSROOM_ORIGIN: ${CODEMIT_CLASSROOM_ORIGIN:?staging CODEMIT_CLASSROOM_ORIGIN 을 .env.staging 에 설정하라 — 강의실 서비스와 같은 값이다}
      CODEMIT_DEPLOYMENT_TARGET: staging
      # 컨테이너 안에서는 compose 네트워크 이름으로 backend에 붙는다(compose.dev.yaml
      # 과 같은 패턴) — 이 값이 비면 lib/api/client.ts 등이 127.0.0.1로 조용히
      # 폴백하는 것을 instrumentation.ts가 부팅 시점에 막는다.
      CODEMIT_API_BASE_URL: http://backend:8000
      # frontend/lib/auth/origin.ts의 CSRF Origin 검증이 쓰는 값 — 비어 있으면
      # instrumentation.ts가 부팅을 거부한다. .env.staging에서 반드시 채운다.
      CODEMIT_WEB_ORIGIN: ${CODEMIT_WEB_ORIGIN:?staging CODEMIT_WEB_ORIGIN 를 .env.staging 에 설정하라}
      # 세션 쿠키의 domain 속성(ADR-0038) — 부모 도메인(.laurio.honeycombpizza.link)을
      # 주면 laurio.honeycombpizza.link에서 로그인한 쿠키가 강의실 등 형제
      # 서브도메인(classroom.laurio.honeycombpizza.link)에도 실린다.
      # frontend/lib/auth/cookies.ts가 비어 있으면(로컬 dev) domain을 아예 주지
      # 않으므로 여기서 빠뜨리면 staging에서도 조용히 호스트 전용으로 남는다 —
      # 그래서 다른 필수값과 같이 부팅을 거부하게 한다.
      CODEMIT_SESSION_COOKIE_DOMAIN: ${CODEMIT_SESSION_COOKIE_DOMAIN:?staging CODEMIT_SESSION_COOKIE_DOMAIN 을 .env.staging 에 설정하라 — 예컨대 .laurio.honeycombpizza.link}
      # 카카오 OAuth 앱 자격증명(#95/#96) — authorize 리다이렉트・code→token
      # 교환을 이 서비스(BFF)가 직접 한다(frontend/lib/auth/kakao.ts). backend의
      # x-backend-env 앵커와 같은 .env.staging 줄을 나눠 읽는다 — 두 서비스가
      # 각자 부팅 시점에 요구해야(여기는 instrumentation.ts) "한쪽만 채우고
      # 잊었다"는 사고를 막는다. KAKAO_SECRET_KEY는 이 값을 실제로 쓰는
      # 유일한 서비스가 여기라는 뜻이기도 하다 — client_secret이 브라우저로
      # 나가는 응답에는 절대 실리지 않는다.
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:?staging KAKAO_REST_API_KEY 를 .env.staging 에 설정하라}
      KAKAO_SECRET_KEY: ${KAKAO_SECRET_KEY:?staging KAKAO_SECRET_KEY 를 .env.staging 에 설정하라}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:?staging KAKAO_REDIRECT_URI 를 .env.staging 에 설정하라 — 카카오 콘솔에 등록한 값과 정확히 같아야 한다}
      # GitHub·구글 OAuth 앱 자격증명(#189) — 카카오와 달리 **선택**이다.
      # `:-`(비어 있으면 빈 문자열)라 .env.staging에 없어도 기동을 막지 않는다.
      # 비어 있으면 frontend/lib/auth/{github,google}.ts가 null을 돌려주고
      # 로그인 화면의 해당 버튼이 "준비 중"으로 남는다(app/login/page.tsx) —
      # 사람이 OAuth 앱을 등록하고 이 세 값을 채우면 재배포만으로 실제 링크가
      # 된다(docker/staging.env.example 참고).
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    ports:
      # staging은 검증용 서브 호스트에 직접 노출한다 — backend의
      # INTERNAL_API_PORT 노출과 같은 이유다. prod처럼 127.0.0.1로 좁히지
      # 않는다.
      #
      # **이 컨테이너 자신은 평문 HTTP로만 듣는다.** CODEMIT_WEB_ORIGIN이
      # https://laurio.honeycombpizza.link이고 이 앱의 세션 쿠키가 staging에서도
      # Secure를 거는 이상(lib/auth/cookies.ts의 isDeployedEnvironment),
      # `http://<서브호스트 IP>:${CODEMIT_WEB_PORT}`를 브라우저로 직접 열면
      # Origin이 어긋나 로그인이 403이 되거나(운 좋게 통과해도) Secure 쿠키가
      # 저장되지 않아 로그인 화면으로 무한히 돌아온다(#70 코드리뷰 지적) —
      # storage.honeycombpizza.link(MinIO, 이 파일이 관리하지 않는다)와 같은
      # 전제다: 이 호스트 앞단에 `laurio.honeycombpizza.link`를 이 평문 포트로
      # 넘겨주는 TLS 종단 리버스 프록시가 **반드시** 있어야 한다. "운영자·QA가
      # 브라우저로 들어간다"는 그 도메인을 통해서다 — 이 포트로 직접 들어가는
      # 것이 아니다.
      - "${CODEMIT_WEB_PORT:-3000}:3000"

  # 운영자 앱 BFF(#70, ADR-0019/0021). operator.Dockerfile의 runner 스테이지 —
  # frontend 서비스와 같은 산출물 모양(standalone, `node server.js`)이고 같은
  # 부팅 가드 원칙을 따른다(operator/instrumentation.ts) — CODEMIT_OPERATOR_ORIGIN·
  # CODEMIT_API_BASE_URL이 비어 있으면 이 컨테이너를 그 자리에서 죽인다.
  #
  # **CODEMIT_OPERATOR_ORIGIN을 위 x-backend-env 앵커의 backend가 요구하는 것과
  # 정확히 같은 환경변수에서 읽는다.** 두 서비스가 `.env.staging`의 같은 줄을
  # 그대로 나눠 읽으므로, 이 값이 서로 다른 곳에서 따로 채워져 어긋나는 사고
  # 자체가 구조적으로 불가능하다 — 이 티켓의 핵심 위험(오리진 정합성)에 대한
  # compose 수준의 방어다. e2e(frontend/e2e/operator/proxy.spec.ts)가 런타임에서
  # 같은 사실을 한 번 더 증명한다.
  operator:
    logging: *default-logging
    image: ${CODEMIT_IMAGE_REPO:-ghcr.io/sandcorporation}/codemit-operator:${CODEMIT_IMAGE_TAG:-local}-amd64
    build:
      context: ..
      dockerfile: docker/operator.Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      # 공개 설정(#711, ADR-0062) — 서버가 읽고 루트 레이아웃이 브라우저로 넘긴다
      # (`operator/lib/public-config.ts`). 비밀을 `CODEMIT_PUBLIC_*` 이름으로 넣지 않는다.
      # 오류 수집(GlitchTip) — 앱마다 다른 프로젝트(DSN). release 는 deploy.sh 가 export 하는 배포 커밋이다.
      CODEMIT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_OPERATOR:-}
      CODEMIT_PUBLIC_SENTRY_ENVIRONMENT: staging
      CODEMIT_PUBLIC_SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      CODEMIT_DEPLOYMENT_TARGET: staging
      CODEMIT_API_BASE_URL: http://backend:8000
      # backend의 OPERATOR_WEB_ORIGIN(위 x-backend-env)과 같은 변수, 같은 값.
      CODEMIT_OPERATOR_ORIGIN: ${CODEMIT_OPERATOR_ORIGIN:?CODEMIT_OPERATOR_ORIGIN 을 설정해야 한다}
    ports:
      # 공개 앱(CODEMIT_WEB_PORT)과 겹치지 않는 별도 포트 — frontend 서비스와
      # 같은 이유로 127.0.0.1로 좁히지 않는다.
      #
      # **이 컨테이너 자신은 평문 HTTP로만 듣는다 — frontend 서비스의 ports:
      # 주석과 정확히 같은 이유, 같은 결론이다**(#70 코드리뷰 지적).
      # CODEMIT_OPERATOR_ORIGIN이 https이고 이 앱의 세션 쿠키도 staging에서
      # Secure를 거는 이상(operator/lib/auth/cookies.ts), 이 평문 포트를 IP로
      # 직접 열면 Origin 불일치로 로그인이 403이 되거나 Secure 쿠키가 저장되지
      # 않아 /login으로 무한히 돌아온다. 운영자·QA는 이 포트가 아니라
      # CODEMIT_OPERATOR_ORIGIN이 가리키는 도메인(예:
      # operator.laurio.honeycombpizza.link)으로 들어간다 — 이 호스트 앞단에
      # 그 도메인을 이 포트로 넘겨주는 TLS 종단 리버스 프록시가 반드시 있어야
      # 한다.
      - "${CODEMIT_OPERATOR_WEB_PORT:-3001}:3000"

  # 강의실 앱(#276/#277, ADR-0037). classroom.Dockerfile의 runner 스테이지 —
  # frontend·operator 서비스와 같은 산출물 모양(standalone, `node server.js`)이고
  # 같은 부팅 가드 원칙을 따른다(classroom/instrumentation.ts) —
  # CODEMIT_CLASSROOM_ORIGIN·CODEMIT_API_BASE_URL·CODEMIT_SESSION_COOKIE_DOMAIN이
  # 비어 있으면 이 컨테이너를 그 자리에서 죽인다.
  classroom:
    logging: *default-logging
    image: ${CODEMIT_IMAGE_REPO:-ghcr.io/sandcorporation}/codemit-classroom:${CODEMIT_IMAGE_TAG:-local}-amd64
    build:
      context: ..
      dockerfile: docker/classroom.Dockerfile
      target: runner
    restart: unless-stopped
    # **열 수 있는 파일 개수를 올린다**(2026-09-18, 이벤트 서비스와 같은 이유).
    # 강의실 실시간 신호는 이 앱이 중계하므로 스트림 하나가 브라우저 쪽 소켓 1 +
    # 이벤트 서비스로 나가는 소켓 1 = 서술자 2개를 쓴다 — 기본 soft 한도 1024 는
    # 동시 시청자 약 500명에서 막힌다.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      backend:
        condition: service_started
      events:
        condition: service_started
    environment:
      # 공개 설정(#711, ADR-0062) — 서버가 읽고 루트 레이아웃이 브라우저로 넘긴다
      # (`classroom/lib/public-config.ts`). 비밀을 `CODEMIT_PUBLIC_*` 이름으로 넣지 않는다.
      # 오류 수집(GlitchTip) — 앱마다 다른 프로젝트(DSN). release 는 deploy.sh 가 export 하는 배포 커밋이다.
      CODEMIT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_CLASSROOM:-}
      CODEMIT_PUBLIC_SENTRY_ENVIRONMENT: staging
      CODEMIT_PUBLIC_SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      # 방문 메트릭 스니펫(Sandcorp 공통, #785) — 사용자가 보는 두 앱(frontend·classroom)만, operator 는 없다.
      # 비어 있으면 루트 레이아웃이 태그를 그리지 않는다(`<앱>/lib/public-config.ts` metricsSnippetSrc).
      CODEMIT_PUBLIC_METRICS_SNIPPET_URL: ${METRICS_SNIPPET_URL:-}
      CODEMIT_DEPLOYMENT_TARGET: staging
      CODEMIT_API_BASE_URL: http://backend:8000
      # 실시간 신호 SSE 전용 베이스 URL(ADR-0046, #380) — 나머지 API는 전부
      # 위 backend(동기 gunicorn)를 그대로 친다. 강의실 BFF가
      # `/api/classroom/events/stream` 경로 하나만 이쪽으로 갈라 보낸다
      # (`lib/proxy/forward.ts`). 비면 classroom/lib/auth/backend.ts의
      # eventsBaseUrl이 127.0.0.1:58001(이 컨테이너 자신)로 조용히
      # 폴백한다 — 부팅은 막지 않는다(스트림이 없어도 화면은 폴링으로
      # 물러난다, ADR-0046 결과), 그래도 실제로 뜨지 않으면 스트림
      # 연결 자체가 항상 실패하므로 compose 네트워크 이름으로 명시한다.
      CODEMIT_EVENTS_BASE_URL: http://events:8001
      # 이 앱 자신의 Origin 검증이 쓰는 값 — frontend·operator와 같은 원칙으로
      # 자기 서브도메인을 요구한다(공개 앱·운영자 앱과 다른 서브도메인이어야
      # 한다, 셋 다 ADR-0016의 같은 이유).
      CODEMIT_CLASSROOM_ORIGIN: ${CODEMIT_CLASSROOM_ORIGIN:?CODEMIT_CLASSROOM_ORIGIN 을 설정해야 한다}
      # 「로그인이 필요합니다」 화면이 공개 앱 로그인으로 안내하는 링크를 지을
      # 때 읽는다(classroom/lib/auth/public-app.ts) — frontend 서비스가 요구하는
      # CODEMIT_WEB_ORIGIN과 같은 변수, 같은 값이다.
      CODEMIT_WEB_ORIGIN: ${CODEMIT_WEB_ORIGIN:?staging CODEMIT_WEB_ORIGIN 를 .env.staging 에 설정하라}
      # frontend 서비스가 요구하는 것과 같은 변수, 같은 값(ADR-0038) — 공개 앱이
      # 심은 세션 쿠키가 이 서브도메인에도 실려야 「한 번 로그인하면 두 제품이
      # 다 열린다」가 staging에서 실제로 성립한다.
      CODEMIT_SESSION_COOKIE_DOMAIN: ${CODEMIT_SESSION_COOKIE_DOMAIN:?staging CODEMIT_SESSION_COOKIE_DOMAIN 을 .env.staging 에 설정하라 — 예컨대 .laurio.honeycombpizza.link}
    ports:
      # 공개 앱·운영자 앱과 겹치지 않는 별도 포트 — 같은 이유로 127.0.0.1로
      # 좁히지 않는다. **이 컨테이너 자신도 평문 HTTP로만 듣는다** — frontend·
      # operator 서비스의 ports: 주석과 같은 이유, 같은 결론이다. 강의실·QA는
      # 이 포트가 아니라 CODEMIT_CLASSROOM_ORIGIN이 가리키는 도메인(예:
      # classroom.laurio.honeycombpizza.link)으로 들어간다 — 이 호스트 앞단에
      # 그 도메인을 이 포트로 넘겨주는 TLS 종단 리버스 프록시가 반드시 있어야
      # 한다.
      - "${CODEMIT_CLASSROOM_WEB_PORT:-3002}:3000"

volumes:
  codemit-staging-db:
  codemit-staging-redis:
  codemit-staging-search:
