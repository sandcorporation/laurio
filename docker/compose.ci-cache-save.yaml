# GitHub Actions PR 검사의 이미지 층 캐시 — 저장 쪽(#932). **main push 실행에서만** 더한다(PR 은 복원만).
# backend 이미지만 여기서 내보낸다 — events·grader·celery-worker 는 같은 이미지라 한 번이면 된다.
# 세 앱 이미지는 guard 잡이 `docker build --cache-to` 로 내보낸다.
# 내보내는 곳(`CODEMIT_BK_CACHE_NEW`)은 복원한 폴더와 다르다 — 옛 층이 쌓이지 않게 한 세대만 남긴다.
services:
  backend:
    build:
      cache_to:
        - type=local,dest=${CODEMIT_BK_CACHE_NEW}/backend,mode=max
