# CI 전용 오버라이드 — **CI 는 배포되는 산출물을 친다.**
#
# `compose.dev.yaml` 은 개발용이다. 앱 서비스가 `target: dev` 로 지어져
# `pnpm dev` 를 돌리고, 저장소를 `..:/app` 으로 마운트해 코드를 고치면 즉시
# 반영되게 한다. 그 마운트는 **핫리로드 장치**이고 체크아웃이 고정인 CI 에는
# 있을 이유가 없다.
#
# 그리고 그것이 틀린 코드를 실행시킬 수 있다. CI 러너가 컨테이너 안에서 호스트
# Docker 소켓을 쓰면 바인드 경로가 호스트 기준으로 풀려 러너 안의 체크아웃을
# 가리키지 못하고 `/app` 이 빈 채로 마운트된다 — 실측:
# `python: can't open file '/app/manage.py'`,
# `Scope: all 0 workspace projects` → `Command "dev" not found`.
# 호스티드 러너에서는 러너의 파일시스템이 곧 Docker 호스트라 우연히 맞아떨어져
# 이 차이가 드러나지 않았다.
#
# **그래서 CI 는 `runner` 타깃을 쓴다** — 배포 compose 가 고르는 바로 그 스테이지다
# (`docker/frontend.Dockerfile`·`operator.Dockerfile` 의 3스테이지 중 마지막,
# `CMD ["node", "<app>/server.js"]`). 코드가 이미지에 구워지므로 마운트가 필요 없고,
# 덤으로 **CI 가 실제로 배포되는 산출물을 검증하게 된다** — dev 서버가 아니라.
#
# backend 는 스테이지가 하나뿐이지만 `backend.Dockerfile` 이 `COPY backend/ ./` 로
# 코드를 굽는다. 마운트만 걷으면 같은 코드가 돈다.
#
# `!reset` 은 Compose 2.24+ 가 필요하다. 못 알아들으면 파싱 단계에서 크게 실패한다 —
# 조용히 마운트가 남는 것보다 낫다.
# **CI 는 dev 의 개발용 장치를 하나도 상속하지 않는다 — 마운트도, 포트도**(#194).
# 이 파일이 마운트에 대해서만 그 규율을 갖고 있어서 포트가 조용히 따라왔다.
#
# **그리고 남은 포트도 번호를 고르지 않는다**(#196). #194 가 안 쓰는 노출을 걷었지만
# 「쓰는 포트를 고정 슬롯으로 잡는다」는 것 자체가 남은 문제였다 — 러너에 남은
# `docker-proxy` 하나가 그 번호를 물고 있으면 잡이 통째로 죽고, 사전 정리의
# `docker ps --filter publish=` 는 컨테이너가 사라진 그 누수를 못 본다. 실측으로
# 두 번(#190·#195 머지) 그렇게 죽었다. 번호를 커널이 고르면 그 실패 종류가 사라진다.
#
# 대신 **잡이 번호를 읽어야 한다** — `docker compose port <service> <container-port>`.
services:
  db:
    # 호스트에서 Postgres 에 붙는 CI 잡이 없다 (#194). 마지막 사용처였던 e2e 의
    # 서브프로세스 시드 둘이 HTTP 로 옮겨졌다 — pytest 는 이 스택을 쓰지 않고
    # (GitHub `services:` 의 postgres 를 쓴다) 나머지는 전부 컨테이너 안이다.
    ports: !reset []
    # **느린 질의와 잠금 대기를 적는다**(#699). e2e 시험 하나는 3초 한도라, 스택이 몇 초
    # 멈추면 여러 시험이 한꺼번에 붉어지는데(열차 #1840) 무엇이 멈췄는지 남는 줄이 없었다.
    # 300ms 넘는 문장과 300ms 넘게 잠금을 기다린 세션을 적는다 — 잠금 대기 줄은
    # `deadlock_timeout` 이 지나야 찍히므로 그것도 300ms 로 당긴다. dev 의
    # `synchronous_commit=off` 는 command 를 통째로 덮으므로 여기서 다시 적는다.
    command:
      - postgres
      - -c
      - synchronous_commit=off
      - -c
      - log_min_duration_statement=300
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=300ms

  minio:
    # **콘솔(9001)은 CI 에서 아무도 안 연다** — 사람이 브라우저로 보는 관리 UI 다.
    # API(9000)는 남긴다: 업로드 e2e 에서 브라우저가 presigned URL 로 직접 PUT 하고,
    # 그 URL 은 `STORAGE_PUBLIC_ENDPOINT_URL`(=127.0.0.1:${CODEMIT_MINIO_PORT})을
    # 가리킨다.
    #
    # **호스트 포트를 커널이 고른다**(#196) — 번호를 적지 않으면 임의 포트다.
    # `ports` 는 병합될 때 이어붙으므로 줄이려면 `!override` 여야 한다.
    #
    # **이 서비스만 두 단계로 띄운다.** 다른 셋과 달리 이 번호가 **기동 시점에**
    # 필요하다 — backend 컨테이너가 `STORAGE_PUBLIC_ENDPOINT_URL` 로 그 값을 받고,
    # 브라우저가 presigned URL 로 그 주소에 직접 PUT 하기 때문이다. 그래서 잡은
    # minio 를 먼저 띄우고 `docker compose port` 로 번호를 읽은 뒤 나머지를 띄운다.
    ports: !override
      - "9000"

  redis:
    # 호스트에서 Redis 에 붙는 CI 잡이 없다 — pytest 세션 캐시가 LocMem 이 된 뒤로
    # 필요가 사라졌고(CLAUDE.md 「테스트는 서로를 밟지 않는다」), compose 안의
    # 서비스들은 서비스 이름 `redis` 로 통한다. 열어 두면 셀프호스티드 러너에서
    # 충돌 표면만 넓힌다.
    ports: !reset []

  backend:
    volumes: !reset []
    # 호스트가 이 API 를 친다 — e2e 시드(`seed-http.ts`)와 헬스 체크. 번호는
    # 커널이 고르고 잡이 `docker compose port` 로 읽는다(#196).
    ports: !override
      - "8000"
    # **배포처럼 gunicorn 워커 넷으로 돈다**(2026-10-02). dev 의 `runserver` 는
    # 프로세스 하나라 Playwright 워커 여럿의 시드와 화면 요청이 GIL 하나를 두고
    # 줄을 섰다 — 혼자 돌면 1.2초인 이의 시험이 병렬에서는 시드 대기만으로
    # 3초(시험 하나 한도)를 넘었다. 코드가 이미지에 구워진 CI 에서는 자동
    # 재시작도 필요 없다. 워커 수는 prod compose 와 같다.
    #
    # **요청마다 한 줄을 stdout 에 적는다**(#699) — 메서드·경로·상태·응답 바이트·걸린 ms·
    # 워커 pid. 시각은 `e2e.sh` 가 로그를 거둘 때 붙이는 Docker 타임스탬프(나노초)가 맡는다
    # (gunicorn 의 `%(t)s` 는 초 단위라 3초 정지를 가르지 못한다). 배포 compose 는 그대로다.
    # 옵션은 gunicorn 과 한 줄에 둔다 — 더 들여 쓴 줄은 접힘(`>`)에서도 줄바꿈이 남아 sh 가
    # 다른 명령으로 읽고, 줄 끝 `\` 은 compose 가 먹는다(실측).
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_dev_data &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --access-logfile - --access-logformat '%(r)s %(s)s %(B)s %(M)sms pid=%(p)s'"

  # 이벤트 서비스(ADR-0046, #379) — `backend`와 같은 이유로 마운트를 걷는다.
  # dev 의 `--reload`(uvicorn watchfiles)는 코드가 이미지에 구워진 CI 에서는
  # 아무것도 안 바뀌니 무해하다 — command 자체를 다시 적지 않는다. 강의실
  # e2e 잡만 이 서비스를 띄운다.
  events:
    volumes: !reset []
    ports: !override
      - "8001"

  # 강의실 채점 grader(#584) — 코드가 이미지에 구워져 있다.
  grader:
    volumes: !reset []

  frontend:
    build:
      target: runner
    # dev compose 의 command 는 `pnpm install && pnpm dev` 다 — 마운트된 소스를
    # 전제한다. 비우면 이미지의 CMD(standalone 서버)가 그대로 돈다.
    command: !reset null
    volumes: !reset []
    # Playwright 가 호스트에서 친다. 번호는 커널이 고른다(#196).
    ports: !override
      - "3000"

  operator:
    build:
      target: runner
    command: !reset null
    volumes: !reset []
    ports: !override
      - "3000"

  classroom:
    build:
      target: runner
    command: !reset null
    volumes: !reset []
    ports: !override
      - "3000"
