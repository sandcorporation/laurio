# CI 전용 오버라이드 — dev 의 **핫리로드 마운트**만 걷어낸다.
#
# `compose.dev.yaml` 의 backend 서비스는 `../backend:/app` 을 마운트한다. 그것은
# 개발 중 코드를 고치면 즉시 반영되게 하는 장치이고, **CI 에는 있을 이유가 없다** —
# 체크아웃이 고정이고, `backend.Dockerfile` 이 `COPY backend/ ./` 로 코드를 이미
# 이미지에 굽는다. 마운트를 걷어도 같은 코드가 돈다.
#
# 걷어내야 하는 이유는 그것이 **틀린 코드를 실행시키기 때문**이다. CI 러너가
# 컨테이너 안에서 호스트 Docker 소켓을 쓰면 바인드 경로가 호스트 기준으로 풀려
# 러너 안의 체크아웃을 가리키지 못하고, `/app` 이 빈 채로 마운트된다 — 실측:
# `python: can't open file '/app/manage.py'`. 호스티드 러너에서는 러너의
# 파일시스템이 곧 Docker 호스트라 이 차이가 드러나지 않았다.
#
# `!reset` 은 Compose 2.24+ 가 필요하다. 못 알아들으면 파싱 단계에서 크게 실패한다 —
# 조용히 마운트가 남는 것보다 낫다.
services:
  backend:
    volumes: !reset []
