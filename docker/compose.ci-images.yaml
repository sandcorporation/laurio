# CI 오버라이드 셋째 장 — **스택이 굽지 않고, 배포될 바로 그 이미지를 받아 띄운다**(#712).
#
#   docker compose -f compose.dev.yaml -f compose.ci.yaml -f compose.ci-images.yaml …
#   CODEMIT_IMAGE_TAG=<커밋 sha>-<arch>   (반드시) — `scripts/ci/images.sh <arch>` 가 올린 커밋 태그
#   CODEMIT_IMAGE_REGISTRY               (선택) 기본 ghcr.io/sandcorporation
#
# 열차(`Jenkinsfile.train`)의 macos 가지가 `images.sh arm64` 로 여섯을 굽고(바뀌지 않은 것은 ctx 로
# 건너뛰어 커밋 태그만 더한다) 그 커밋 태그로 e2e·celery 를 돈다. 그래서 e2e 가 본 이미지의 digest 가
# 곧 prod 에 가는 이미지의 digest 다 — 예전처럼 스택이 `up --build` 로 따로 구운 이미지가 아니다.
# 초록이면 열차가 ctx 태그를 붙이고, 병합 뒤 codemit-deploy-staging 은 같은 문맥을 「건너뛴다」로 두어 태그만 더한다.
#
# `compose.ci.yaml` 이 정한 것(`runner` 타깃, 마운트·포트 걷기, gunicorn 명령)은 그대로 받는다 — 여기서는
# `build` 를 걷고 `image` 만 준다. backend 계열 다섯(backend·events·grader·celery-worker·celery-beat)은
# 배포처럼 `codemit-backend` 하나를 같이 쓴다. `pull_policy: always` — 노드에 같은 이름이 남아 있어도
# 레지스트리의 매니페스트와 맞춰 본다(같으면 받지 않는다). 그래서 띄운 이미지 = 레지스트리의 그 digest.
x-backend-image: &backend-image
  image: ${CODEMIT_IMAGE_REGISTRY:-ghcr.io/sandcorporation}/codemit-backend:${CODEMIT_IMAGE_TAG:?CODEMIT_IMAGE_TAG 가 없다 — images.sh 가 올린 <sha>-<arch>}
  build: !reset null
  pull_policy: always

services:
  backend: *backend-image
  events: *backend-image
  grader: *backend-image
  celery-worker: *backend-image
  celery-beat: *backend-image

  frontend:
    image: ${CODEMIT_IMAGE_REGISTRY:-ghcr.io/sandcorporation}/codemit-frontend:${CODEMIT_IMAGE_TAG:?CODEMIT_IMAGE_TAG 가 없다}
    build: !reset null
    pull_policy: always

  operator:
    image: ${CODEMIT_IMAGE_REGISTRY:-ghcr.io/sandcorporation}/codemit-operator:${CODEMIT_IMAGE_TAG:?CODEMIT_IMAGE_TAG 가 없다}
    build: !reset null
    pull_policy: always

  classroom:
    image: ${CODEMIT_IMAGE_REGISTRY:-ghcr.io/sandcorporation}/codemit-classroom:${CODEMIT_IMAGE_TAG:?CODEMIT_IMAGE_TAG 가 없다}
    build: !reset null
    pull_policy: always
