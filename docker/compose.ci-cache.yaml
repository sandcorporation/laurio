# GitHub Actions PR 검사의 이미지 층 캐시 — 복원 쪽(#932, docs/ops/ci.md 「캐시」).
#
# `CODEMIT_BK_CACHE`(워크플로가 actions/cache 로 복원한 디렉터리) 아래 앱별 폴더에서 층을 읽는다.
# 같은 Dockerfile 을 쓰는 서비스는 같은 폴더를 본다. 폴더가 비어 있으면 그냥 처음부터 굽는다.
# 저장은 여기서 하지 않는다 — main push 실행만 `compose.ci-cache-save.yaml` 을 더한다.
services:
  backend: &backend
    build:
      cache_from:
        - type=local,src=${CODEMIT_BK_CACHE}/backend
  events: *backend
  grader: *backend
  celery-worker: *backend
  frontend:
    build:
      cache_from:
        - type=local,src=${CODEMIT_BK_CACHE}/frontend
  operator:
    build:
      cache_from:
        - type=local,src=${CODEMIT_BK_CACHE}/operator
  classroom:
    build:
      cache_from:
        - type=local,src=${CODEMIT_BK_CACHE}/classroom
