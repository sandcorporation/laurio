# main push → 이미지 → production 승격(#938, ADR-0077). production 브랜치 머리 = 운영 버전.
# Jenkins `codemit/deploy` 는 production push 만 보고, 굽지도 검사하지도 않고 그 sha 의 이미지를 받아 oracle 에 배포한다
# (Jenkinsfile → jenkins-shared sandcorpDeploy deployFrom: 'production').
#
# 배포 가능 판정은 병합 대기열 한 번이다(#1090) — release 는 검사하지 않는다. main 은 대기열로만 움직이고(ruleset: 대기열·
# 필수 검사 「결과」, bypass 없음), 대기열이 돈 머지 커밋이 그대로 main 머리가 된다. 그래서 main 의 트리 = 대기열이 초록으로
# 돈 트리이고, 그걸 다시 증명하던 verify(verified_tree.py, #959)와 다시 돌던 check(pr-check.yml)를 뺐다.
# amd64 부팅 가드(guard)는 대기열의 PR 검사가 돈다. arm64 부팅 가드는 image.yml 이 그대로 돈다.
#
#   image   image.yml(workflow_call) — 여섯 이미지마다 matrix 잡 하나, ghcr codemit-<서비스>:<sha>-arm64(+ :<sha>), 부팅 가드(arm64).
#   (cache·cache-node 는 release-cache.yml — 이름별 concurrency 대기열에서 밀려 취소돼도 이 실행의 결론이 cancelled 가 되지 않게 떼어 냈다, #1151)
#   main_only 수동 실행(workflow_dispatch)의 ref 가 main 이 아니면 실패 — 아래 잡이 모두 이 잡 success 를 기다린다(#1018)
#   promote needs main_only·image — image 초록일 때만. production 을 이 sha 로 fast-forward 만(scripts/ci/promote.sh ff).
#           production 이 이미 더 새 판이면(옛 실행이 늦게 끝남) 실패가 아니라 건너뜀.
#   notify  image 가 붉으면 승격이 없다 = 배포가 없다 — ci-red 이슈를 연다(#1015). 초록이 되면 「복구됨」 댓글로 닫는다.
# production 은 앞으로만 간다(ruleset: 강제 push·삭제 금지). 되돌리기는 main 에 revert PR — 이 흐름을 그대로 탄다.
# 급하면 Jenkins 「Build with Parameters」의 ROLLBACK_SHA(production 은 그대로) — docs/ops/deploy.md 「되돌리기」.
#
# 보안 규칙(공개 저장소, scripts/test_public_repo.py 가 본다):
#   - push: main 만. pull_request·pull_request_target 없음. GitHub 호스팅 실행기만. 액션은 SHA 고정. secrets 없음.
#   - 워크플로 기본 권한은 contents: read. packages: write 는 image 잡에만, contents: write 는 promote 잡에만, issues: write 는 notify·e2e_watch 잡에만.
#   - GITHUB_TOKEN 의 push 는 다른 워크플로를 깨우지 않는다(production push 로 Actions 가 다시 돌지 않는다).
#     저장소 웹훅(Jenkins)은 깨운다.
name: release

on:
  push:
    branches: [main]
  # 수동 실행(#1018) — release 를 꺼 뒀다 켠 뒤 그동안 병합된 main 머리를 내보낸다: `gh workflow run release.yml --ref main`.
  # main 이 아닌 ref 로 고르면 main_only 잡이 실패해 뒤 잡(승격 포함)이 모두 멈춘다.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 승격은 main 에서만(#1018) — 수동 실행으로 브랜치를 골라도 production 이 그 머리로 가지 않게, 모든 잡이 이 잡 success 를 기다린다
  main_only:
    # 포크(#1084)에서는 돌지 않는다 — 운영 이미지 저장소·production 을 건드리지 않게. 본 저장소에서는 늘 참이라 무해하다.
    if: github.repository == 'sandcorporation/laurio'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: main 인가
        env:
          REF: ${{ github.ref }}
        run: |
          [ "$REF" = refs/heads/main ] || { echo "release 는 main 에서만 돈다(받은 ref: $REF)"; exit 1; }

  image:
    needs: main_only
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write

  # image 가 붉으면 승격이 없다 = 배포가 없다 — 아무도 모르고 지나가지 않게 ci-red 이슈를 연다(#1015). 초록이 되면 「복구됨」 댓글로 닫는다.
  notify:
    needs: [main_only, image]
    if: ${{ !cancelled() && needs.main_only.result == 'success' && (needs.image.result == 'failure' || needs.image.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: 결과를 이슈로
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_RED_ASSIGNEE: ${{ vars.CI_RED_ASSIGNEE }}
          SHA: ${{ github.sha }}
          RESULT: ${{ needs.image.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="release 이미지 실패 — production 승격·배포 멈춤"
          if [ "$RESULT" = success ]; then
            bash scripts/ci/ci-issue.sh ok "$title" "복구됨 ${SHA} — ${RUN_URL}"
            exit 0
          fi
          # 직전 초록 = production 머리(마지막으로 승격된 sha)
          green=$(gh api "repos/${GH_REPO}/git/ref/heads/production" -q .object.sha || true)
          jobs=$(gh run view ${{ github.run_id }} --json jobs -q '[.jobs[]|select(.conclusion=="failure")|.name]|join(", ")' || true)
          body="main \`${SHA}\` 의 release 이미지(image)가 실패했다. 실패한 잡: ${jobs:-?}. 승격이 돌지 않아 이 커밋은 배포되지 않는다. 실행: ${RUN_URL}"
          if [ -n "$green" ] && [ "$green" != "$SHA" ]; then
            body="${body}"$'\n\n'"직전 초록(production) \`${green}\` … 이번 \`${SHA}\`: https://github.com/${GH_REPO}/compare/${green}...${SHA}"
          fi
          bash scripts/ci/ci-issue.sh fail "$title" "$body"

  # 매시 e2e 예약이 멈췄는지(#1122) — 예약은 부하 때 건너뛰어지므로 예약이 아닌 방아쇠(main 병합)에서 본다. 이미지·승격과 무관하다.
  e2e_watch:
    needs: main_only
    if: ${{ !cancelled() && needs.main_only.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: 마지막 예약 실행이 오래됐는가
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_RED_ASSIGNEE: ${{ vars.CI_RED_ASSIGNEE }}
        run: bash scripts/ci/e2e-stale.sh

  promote:
    needs: [main_only, image]
    if: ${{ !cancelled() && needs.main_only.result == 'success' && needs.image.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    # 승격이 겹치지 않게 저장소 전체에서 하나씩. 끊지 않고 줄 세운다 —
    # 기다리는 실행이 둘이면 GitHub 이 앞 것을 취소한다(뒤 것이 더 새 sha 라 괜찮다).
    concurrency:
      group: production-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # production 이 이 sha 의 조상인지 보려면 이력이 있어야 한다
      - name: production fast-forward
        env:
          SHA: ${{ github.sha }}
        run: bash scripts/ci/promote.sh ff "$SHA"
