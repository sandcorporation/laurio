# e2e 전부 — main 의 화면 전체를 도는 곳(#1111, 대표 결정 2026-11-20). 방아쇠는 main 병합 사건이 주(#1154)이고 예약(매시)은 보조다. PR 검사의 e2e 는 바뀐 앱의 것만 돌고 「결과」 필수,
# 병합 대기열은 e2e 를 돌지 않는다 — 그 대가로 두 PR 이 함께 깨뜨린 화면은 최대 한 시간 main 에 있을 수 있다.
# 본 저장소의 e2e.yml(#1015·#1020)을 되살린 꼴이다: gate(같은 sha 건너뜀)·알림 시험 입력·고정 제목 이슈(scripts/ci/ci-issue.sh).
#   workflow_dispatch  `-f source=merge` — main 병합 사건: release.yml 의 `e2e_dispatch` 잡이 병합마다 부른다(#1154). GitHub 예약은 이 저장소에서
#                      29시간에 4번만 왔고 한 시간에 네 번 두드려도 여섯 번 연달아 안 왔다(#1138) — 예약에만 기대지 않는다. 50분 안에 실제로 도는 전체 실행이
#                      있으면(또는 같은 sha 를 초록으로 돌았으면) 부르지도 돌지도 않는다(`scripts/ci/e2e-gate.sh`). 붉으면 이슈를 연다.
#   schedule           매시(한 시간에 네 번 두드리고 하나만 돈다, #1122) — 보조: 병합이 없는 동안에도 가끔은 돈다. 같은 gate 판정.
#   workflow_dispatch  그 밖(`gh workflow run e2e.yml --ref <브랜치>`) — 브랜치에서도 돈다, 늘 돈다, 이슈는 만들지 않는다(main 의 알림 시험만).
# 「main 의 전체 실행」 = schedule + source=merge dispatch. 실행 이름(run-name)이 `e2e [schedule]`·`e2e [merge]` 로 시작해 gate·notify·감시(e2e-stale.sh)가 거른다.
# 조각은 PR 검사와 같은 `e2e_plan.py --all`, Playwright 는 공식 이미지(#1109). 이미지 층·pnpm 캐시는 복원만 한다(저장은 release-cache.yml).
# 이 워크플로가 저장하는 캐시는 e2e 조각 시간 기록(`e2e-durations-*`, durations 잡, #1112) 하나다.
# main 에서 붉으면 고정 제목 이슈 「e2e 실패 — main 의 화면이 깨졌을 수 있다」를 열거나 댓글을 달고(직전 초록 sha … 이번 sha 비교 링크와
# 그 사이 커밋), 초록이 되면 「복구됨」 댓글을 달고 닫는다. 같은 잡이 씨앗 기록 낡음도 고정 이슈 「e2e 씨앗 기록이 낡았다」로 알린다(#1251). **제목을 바꾸지 않는다** — 조율자 점검(stall-check.sh)이 이 제목으로 찾는다.
# 실제 실패 이슈는 본 저장소에서만 만든다(포크 #1084 는 알림 시험만).
# 보안(공개 저장소): secrets 없음(github.token 하나), 호스팅 실행기, 액션 SHA 고정, 쓰기 권한은 notify 잡의 issues 하나(부르는 쪽 release.yml 의 e2e_dispatch 는 actions: write 하나).
name: e2e

# 실행 이름 — gh 는 입력으로 실행을 거를 수 없어 종류를 이름에 새긴다(scripts/ci/e2e-gate.sh·e2e-stale.sh 가 앞부분으로 거른다)
run-name: e2e [${{ github.event_name == 'schedule' && 'schedule' || inputs.simulate != 'none' && 'sim' || inputs.source == 'merge' && 'merge' || 'manual' }}]

on:
  schedule:
    # 한 시간에 네 번 두드린다(#1122) — GitHub 예약은 부하 때 실행을 건너뛴다(문서: 지연·누락 가능). 한 번뿐이던 때 23시간에 2번 돌았다.
    # 실제로 도는 것은 한 시간에 하나다: gate 가 50분 안에 이미 전체 실행(예약·병합 사건)이 있으면 건너뛴다. 방아쇠의 주는 병합 사건이다(#1154).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      # main 병합 사건(#1154) — release.yml 의 e2e_dispatch 가 `-f source=merge` 로 부른다. 이 실행만 schedule 처럼 gate 판정·실패 이슈를 가진다.
      source:
        description: "부른 곳 — merge(main 병합 사건)·manual(그 밖)"
        type: choice
        options: [manual, merge]
        default: manual
      # 알림 시험(#1020) — e2e 는 돌리지 않고 notify 잡만 fail(실패로)·ok(초록으로) 흉내 낸다. main 에서만 이슈를 건드리며,
      # 제목에 「(알림 시험)」이 붙어 실제 e2e 실패 이슈·gate 판정(전체 실행만 본다)·직전 초록 조회를 흐리지 않는다.
      simulate:
        description: "알림 시험 — none(실제 e2e)·fail·ok"
        type: choice
        options: [none, fail, ok]
        default: none

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  CODEMIT_CI_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
  BUILDX_BAKE_ENTITLEMENTS_FS: "0"
  CODEMIT_BK_CACHE: /tmp/bk

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      e2e_matrix: ${{ steps.gate.outputs.e2e_matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # e2e 조각 시간 기록(#1112) — 매시 e2e.yml 의 durations 잡이 저장한 가장 새 것. 없으면 e2e_plan.py 가 씨앗 기록을 쓴다.
      - name: e2e 시간 기록 복원
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .e2e-durations/record.json
          key: e2e-durations-latest
          restore-keys: e2e-durations-
      - id: gate
        name: 바뀐 것이 있는가·조각
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          SIM: ${{ inputs.simulate || 'none' }}
          SOURCE: ${{ inputs.source || '' }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # 알림 시험이면 실제 e2e 는 돌리지 않는다. 전체 실행(예약·병합 사건)이면 같은 sha 초록·50분 안 실행을 본다(scripts/ci/e2e-gate.sh)
          decision=$(EVENT="$EVENT" SIM="$SIM" SOURCE="$SOURCE" SHA="$SHA" RUN_ID="$RUN_ID" bash scripts/ci/e2e-gate.sh)
          sed '$d' <<<"$decision"
          run=$(sed -n '$s/^run=//p' <<<"$decision")
          plan=$(python3 scripts/ci/e2e_plan.py --all --durations .e2e-durations/record.json)
          echo "조각: $(sed -n 's/^MATRIX=//p' <<<"$plan")"
          {
            echo "run=$run"
            echo "e2e_matrix=$(sed -n 's/^MATRIX=//p' <<<"$plan")"
          } >>"$GITHUB_OUTPUT"

  e2e:
    name: e2e ${{ matrix.name }}
    needs: gate
    if: needs.gate.outputs.run == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # PR 검사와 같은 조각(e2e_plan.py --all) — 조각마다 실행기가 하나라 스택을 따로 굽고 나란히 돈다(일꾼은 그대로 1개)
        include: ${{ fromJSON(needs.gate.outputs.e2e_matrix).include }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - run: mkdir -p /tmp/bk && cd /tmp/bk && mkdir -p backend frontend operator classroom ci
      - id: bk-keys
        name: 이미지 층 캐시 키(앱 빌드 문맥 해시, #1137)
        run: bash scripts/ci/bk-keys.sh >>"$GITHUB_OUTPUT"
      - id: bk-backend
        name: 이미지 층 캐시 복원(backend)
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/bk/backend
          key: bk-backend-${{ hashFiles('docker/backend.Dockerfile','backend/uv.lock') }}
          restore-keys: bk-backend-
      - id: bk-frontend
        name: 이미지 층 캐시 복원(frontend)
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/bk/frontend
          key: ${{ steps.bk-keys.outputs.frontend }}
          restore-keys: bk-frontend-
      - id: bk-operator
        name: 이미지 층 캐시 복원(operator)
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/bk/operator
          key: ${{ steps.bk-keys.outputs.operator }}
          restore-keys: bk-operator-
      - id: bk-classroom
        name: 이미지 층 캐시 복원(classroom)
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/bk/classroom
          key: ${{ steps.bk-keys.outputs.classroom }}
          restore-keys: bk-classroom-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - id: pnpm-store
        name: pnpm 저장소 경로
        run: |
          corepack enable
          echo "path=$(pnpm store path --silent)" >>"$GITHUB_OUTPUT"
      - id: bk-pnpm
        name: pnpm 저장소 복원
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-
      # 브라우저·시스템 라이브러리는 설치하지 않는다(#1109) — Playwright 는 e2e.sh 가 공식 이미지에서 돌린다. 여기서는 node_modules 만.
      - name: pnpm 의존
        run: pnpm install --frozen-lockfile
      - name: e2e(e2e.sh)
        env:
          # Playwright 를 scripts/ci/playwright-image(판·다이제스트 고정, 판 ≠ lockfile 이면 실패)에서 — apt·브라우저 CDN 없음(#1109)
          CODEMIT_E2E_PLAYWRIGHT_IMAGE: 1
          # 호스팅 실행기는 코어가 적어(비공개 2·공개 4) 앱 셋·백엔드와 일꾼 둘이 다투면 3초 한도를 넘는다
          CODEMIT_E2E_WORKERS: 1
          CODEMIT_E2E_TARGETS: ${{ matrix.project }}
          CODEMIT_E2E_PATHS: ${{ matrix.paths }}
        run: bash scripts/ci/e2e.sh
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-test-results-${{ matrix.name }}
          path: test-results/
          retention-days: 7
      # 시험 시간 리포트(#1112) — 붉어도 올린다(통과한 파일은 잰 것이다). durations 잡이 모아 기록을 다시 쓴다.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-timings-${{ matrix.name }}
          path: test-results/timings/
          retention-days: 3
          if-no-files-found: ignore

  # e2e 조각 시간 기록(#1112) — 조각마다의 JSON 리포트를 직전 기록에 합쳐 Actions 캐시에 둔다. PR 검사·다음 시간의 계획 잡이
  # 가장 새 것을 복원한다. 커밋하지 않는다(대기열·PR 에 쓰기 권한을 더하지 않는다). 캐시 키는 실행마다 새것 — 캐시는 덮어쓸 수 없다.
  # main 에서 저장한 캐시만 PR 이 읽는다(브랜치 수동 실행이 저장한 것은 그 브랜치 몫). 씨앗 기록을 다시 쓸 때는 산출물 e2e-durations 를 커밋한다 — 언제인지는 notify 의 「씨앗 기록 낡음」 이슈가 말한다(#1251).
  durations:
    needs: [gate, e2e]
    if: ${{ !cancelled() && needs.gate.outputs.run == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # e2e 조각 시간 기록(#1112) — 매시 e2e.yml 의 durations 잡이 저장한 가장 새 것. 없으면 e2e_plan.py 가 씨앗 기록을 쓴다.
      - name: e2e 시간 기록 복원
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .e2e-durations/record.json
          key: e2e-durations-latest
          restore-keys: e2e-durations-
      - name: 조각 리포트 받기
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: e2e-timings-*
          path: .e2e-timings
      - name: 기록 다시 쓰기
        run: |
          reports=()
          while IFS= read -r f; do reports+=("$f"); done < <(find .e2e-timings -name '*.json' 2>/dev/null | sort)
          python3 scripts/ci/e2e_durations.py update --from .e2e-durations/record.json --out .e2e-durations/next/record.json ${reports[@]+"${reports[@]}"}
          mv .e2e-durations/next/record.json .e2e-durations/record.json
      - name: e2e 시간 기록 저장
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .e2e-durations/record.json
          key: e2e-durations-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-durations
          path: .e2e-durations/record.json
          retention-days: 30

  notify:
    needs: [gate, e2e]
    # 실제 결과는 본 저장소 main 에서만 이슈로(포크는 알림 시험만, #1111). 알림 시험은 main 이면 어디서나.
    # 실제 결과 이슈는 전체 실행(예약·병합 사건 dispatch)만 만든다(#1154) — 수동 dispatch 는 돌아도 이슈를 만들지 않는다.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && ((needs.gate.outputs.run == '1' && (github.event_name == 'schedule' || inputs.source == 'merge') && github.repository == 'sandcorporation/laurio' && (needs.e2e.result == 'failure' || needs.e2e.result == 'success')) || (inputs.simulate || 'none') != 'none') }}  # leak-guard:allow — 본 저장소 이름(이미 공개된 워크플로 조건)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: 결과를 이슈로
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_RED_ASSIGNEE: ${{ vars.CI_RED_ASSIGNEE }}
          SHA: ${{ github.sha }}
          SIM: ${{ inputs.simulate || 'none' }}
          RESULT: ${{ needs.e2e.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 직전 초록 = 이 실행 앞의 가장 새 성공 실행의 sha(건너뛴 실행도 같은 sha 라 그대로 맞다)
          # (전체 실행 — 예약·병합 사건 dispatch — 만 본다: 수동·알림 시험 실행은 e2e 를 안 돌았을 수 있다)
          green=$(gh run list --workflow e2e.yml --branch main --status success --limit 30 --json databaseId,headSha,displayTitle \
            -q "[.[]|select(.displayTitle|test(\"^e2e \\\\[(schedule|merge)\\\\]\"))|select(.databaseId != $RUN_ID)][0].headSha // empty" || true)
          title="e2e 실패 — main 의 화면이 깨졌을 수 있다"
          if [ "$SIM" != none ]; then
            title="${title} (알림 시험)"
            green=$(git rev-parse HEAD~1)   # 시험이니 바로 앞 커밋을 직전 초록으로 쓴다(compare 링크·커밋 목록 확인용)
            if [ "$SIM" = fail ]; then RESULT=failure; else RESULT=success; fi
          fi
          if [ "$RESULT" = success ]; then
            bash scripts/ci/ci-issue.sh ok "$title" "복구됨 ${SHA} — ${RUN_URL}"
            exit 0
          fi
          jobs=$(gh run view "$RUN_ID" --json jobs -q '[.jobs[]|select(.conclusion=="failure")|.name]|join(", ")' || true)
          [ "$SIM" = none ] || jobs="(알림 시험 — 실제 실패 아님)"
          body="main \`${SHA}\` 의 e2e 가 실패했다. 실패한 잡: ${jobs:-?}. 실행: ${RUN_URL}"
          if [ -n "$green" ] && [ "$green" != "$SHA" ]; then
            body="${body}"$'\n\n'"직전 초록 \`${green}\` … 이번 \`${SHA}\`: https://github.com/${GH_REPO}/compare/${green}...${SHA}"
            body="${body}"$'\n\n'"그 사이 커밋:"$'\n'"$(gh api "repos/${GH_REPO}/compare/${green}...${SHA}" -q '.commits[]|"- \(.sha[0:8]) \(.commit.message|split("\n")[0])"' || true)"
          fi
          bash scripts/ci/ci-issue.sh fail "$title" "$body"
      # 씨앗 기록 낡음(#1251) — 씨앗에 없는 시험이 문턱(SEED_SLACK)을 넘으면 고정 제목 이슈 「e2e 씨앗 기록이 낡았다」, 돌아오면 닫는다.
      # PR 검사는 그 PR 이 더한 시험을 빼고 세니 main 의 빚은 여기서 알린다. e2e 결과와 상관없이 돈다(알림 시험은 빼고).
      - name: 씨앗 기록 낡음
        if: ${{ !cancelled() && (inputs.simulate || 'none') == 'none' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_RED_ASSIGNEE: ${{ vars.CI_RED_ASSIGNEE }}
        run: bash scripts/ci/e2e-seed-stale.sh
