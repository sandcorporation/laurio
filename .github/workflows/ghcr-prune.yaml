name: ghcr 옛 버전 정리

# **ghcr 에 쌓인 옛 이미지 버전을 지운다**(2026-09-20).
#
# CI 는 커밋마다 이미지 여섯을 올리는데(`images-staging`·`images-prod`), 그 **옛
# 버전을 지우는 것이 아무 데도 없었다.** `deploy.sh prune` 은 배포 호스트의 도커
# 디스크만 비우고 레지스트리는 건드리지 않는다. 실측(2026-09-20): 이미지 여섯이
# 99 버전, 빌드 캐시(`codemit-buildcache`)가 **176 버전** — 캐시 쪽은 대부분 태그
# 없는 블롭이라 사람 눈에 보이지도 않는다.
#
# 그 결과가 **ghcr 쓰기 403** 이었다: 09-18 까지 초록이던 이미지 잡이 09-20 부터
# 전부 토큰 교환에서 403 으로 죽어 staging·prod 배포가 이틀 멈췄다. 읽기는 그대로
# 됐다(배포 에이전트의 PAT 로 매니페스트 조회 성공) — **쓰기만** 막힌 것이 비공개
# 패키지 저장 용량의 전형적인 모양이다.
#
# **왜 Actions 토큰으로 지울 수 있나.** 레지스트리(ghcr.io) 쓰기가 막힌 것과 패키지
# REST API 의 삭제는 다른 문이다 — 용량을 줄이는 행위까지 막으면 빠져나갈 길이 없으므로
# 삭제는 열려 있다. 그래서 새 PAT 를 만들지 않고 `packages: write` 를 가진
# `GITHUB_TOKEN` 하나로 끝낸다.
#
# **되돌릴 수 없다.** 지운 버전은 복구되지 않는다 — 그래서 남기는 개수를 입력으로
# 받고(기본값은 아래), 실수로 지우는 것을 막는 쪽으로 기울여 둔다. 다만 **돌고 있는
# 컨테이너는 영향을 받지 않는다**: 배포된 이미지는 이미 그 호스트에 내려와 있고,
# ghcr 의 버전은 「다시 받을 수 있는가」에만 쓰인다. 지워서 잃는 것은 **그 커밋으로의
# 되돌리기를 pull 로 하는 길** 하나이고, 그것도 최근 몇 커밋은 남는다.
#
# 빌드 캐시는 더 적게 남긴다 — 캐시가 없으면 빌드가 느려질 뿐 깨지지 않는다.

on:
  workflow_dispatch:
    inputs:
      keep_images:
        description: 이미지 패키지마다 남길 버전 수 (커밋 하나가 2개를 만든다 — staging·prod)
        required: false
        default: "12"
      keep_cache:
        description: 빌드 캐시에 남길 버전 수
        required: false
        default: "10"
  schedule:
    # 매일 새벽 4시(서울) — DB 백업(2시)과 겹치지 않는 시각이다.
    - cron: "0 19 * * *"

# GitHub 호스티드 러너는 과금이 막혀 못 쓴다 — 이 저장소의 모든 잡과 같은 규약으로
# 셀프호스티드(sub)에서 돈다.
jobs:
  prune:
    runs-on: [self-hosted, sub]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: codemit-backend
            keep: images
          - package: codemit-frontend
            keep: images
          - package: codemit-operator
            keep: images
          - package: codemit-classroom
            keep: images
          - package: codemit-search
            keep: images
          - package: codemit-pgbouncer
            keep: images
          - package: codemit-buildcache
            keep: cache
    steps:
      - name: 남길 개수를 고른다
        id: keep
        run: |
          if [ "${{ matrix.keep }}" = "cache" ]; then
            echo "count=${{ inputs.keep_cache || '10' }}" >> "$GITHUB_OUTPUT"
          else
            echo "count=${{ inputs.keep_images || '12' }}" >> "$GITHUB_OUTPUT"
          fi

      # 지우기 전에 무엇이 있는지 로그에 남긴다 — 되돌릴 수 없는 행위라 「몇 개였다」가
      # 나중에 필요하다.
      - name: 지금 몇 버전인가
        run: |
          gh api --paginate \
            "orgs/${{ github.repository_owner }}/packages/container/${{ matrix.package }}/versions" \
            -q '.[] | "\(.created_at[0:16]) \(.metadata.container.tags | if length == 0 then "<태그없음>" else join(",") end)"' \
            | sort -r | head -40
          echo "---"
          gh api --paginate \
            "orgs/${{ github.repository_owner }}/packages/container/${{ matrix.package }}/versions" \
            -q '.[].id' | wc -l | sed 's/^/전체 버전: /'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/delete-package-versions@v5
        with:
          owner: ${{ github.repository_owner }}
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: ${{ steps.keep.outputs.count }}
          token: ${{ secrets.GITHUB_TOKEN }}
