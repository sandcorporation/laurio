# PR 검사 — GitHub 호스팅 실행기에서 도는 PR 검사의 유일한 길이다(#930, ADR-0076 — Jenkins PR 검사는 2026-11-09 에 꺼졌다, #932).
# 검사 내용은 이 파일에 쓰지 않고 scripts/ci/ 의 스크립트들을 그대로 부른다.
#
#   plan    문서(.md·docs/)만 바뀌었나(`changed.sh`) — 그러면 ADR 상태 검사만
#   checks  `sub-checks.sh` — Django check·check --deploy·pytest 전체·생성물·문서 검사·단위 시험·타입 검사
#   guard   (PR 에서는 건너뜀, release 에서만 — #1015) 세 앱 prod 이미지(amd64)를 여기서 굽고 `deploy-guard.sh` — 설정 없이는 죽고, 완전한 설정으로는 뜬다
#   (e2e 는 PR·release 에서 빠졌다 — e2e.yml 이 main 을 매시 돈다, #1015)
#   celery  `celery-broker.sh` — 실제 Redis 브로커로 beat → worker
#   결과    위가 모두 초록(또는 문서만이라 건너뜀)이면 초록 — 브랜치 보호의 필수 검사로 걸 이름 하나
#
# main 에서는 release.yml(#938, ADR-0077)이 이 워크플로를 workflow_call 로 부른다 — 같은 검사가 초록이어야 image.yml 이
# 이미지를 굽고 production 이 승격된다. 이 파일만 따로 main push 로 도는 일은 없다.
#
# 캐시(#932): 이미지 층은 buildx `type=local` 캐시를 actions/cache 로 옮긴다(키 = Dockerfile·lockfile 해시).
# **저장은 main 실행(release.yml 의 check)만**, PR 은 복원만(`actions/cache/restore`) — PR 이 만든 캐시는 다른 PR 이 못 쓴다.
# 별도 권한(`actions: write`)이 필요 없다 — GHA 캐시 백엔드(type=gha) 대신 actions/cache 를 쓰는 까닭이다.
#
# 여기서 굽는 이미지는 amd64 시험용이고 레지스트리에 올리지 않는다(ctx·e2e 태그 없음). 배포할 arm64 이미지는
# image.yml 이 main 에서 굽고 부팅 가드를 다시 돈다.
#
# 보안(공개 저장소): `pull_request` 만(`pull_request_target` 금지), 호스팅 실행기만, secrets 를 쓰지 않는다(값은
# scripts/ci/*.env 의 CI 전용 가짜 값), 권한은 contents: read, 액션은 SHA 로 고정한다.
name: PR 검사

on:
  pull_request:
  # main 에서는 release.yml 이 이 워크플로를 workflow_call 로 부른다(#938) — 통과해야 이미지·승격으로 간다.
  # 그때 github.event_name·github.ref 는 부른 쪽의 것(push, refs/heads/main)이라 캐시 저장(CODEMIT_BK_CACHE_SAVE)이 그대로 돈다.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CODEMIT_CI_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
  # 이미지 층 캐시(#932) — 복원은 어디서나, 저장은 main push 실행에서만(PR 이 만든 캐시는 다른 PR 이 못 쓴다)
  # compose(bake)가 로컬 캐시 폴더 읽기·쓰기를 허락받으라고 멈춘다 — 이 실행기 안의 /tmp 폴더라 끈다
  BUILDX_BAKE_ENTITLEMENTS_FS: "0"
  CODEMIT_BK_CACHE: /tmp/bk
  CODEMIT_BK_CACHE_NEW: /tmp/bk-new
  CODEMIT_BK_CACHE_SAVE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.plan.outputs.tests }}
      # PR 에서 뺄 잡을 고르는 한 곳(#1015) — PR 이 아닐 때만 '1'. release.yml 이 workflow_call 로 부르면 github.event_name 은
      # 부른 쪽 이벤트(push)다(GitHub 문서 「Reusing workflows」: the github context is the same as the caller) — 그래서 배포 전에는 돈다.
      guard: ${{ github.event_name != 'pull_request' && '1' || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # release.yml 의 verify 잡(#959)이 jobs API 로 이 단계 이름을 읽어 「이 트리는 이미 초록」을 증명한다 — 이름 꼴을 바꾸지 않는다
      # (scripts/ci/verified_tree.py 의 TESTED_STEP). PR 이면 github.sha 는 refs/pull/N/merge 커밋이다.
      - name: 검사한 커밋 ${{ github.sha }}
        run: echo "트리 $(git rev-parse HEAD^{tree})"
      - id: plan
        name: 무엇을 돌릴지
        run: |
          base=$(git merge-base origin/main HEAD 2>/dev/null || true)
          # main push 는 기준이 HEAD 자신이라 「바뀐 것 없음」→ 전부 돈다(changed.sh)
          plan=$(bash scripts/ci/changed.sh "$base")
          echo "돌릴 것: $plan (기준 ${base:0:12})"
          echo "tests=${plan#TESTS=}" >>"$GITHUB_OUTPUT"
      - name: ADR 상태
        run: python3 scripts/check_adr_status.py
      - name: 공개해도 되는 HEAD 인가(내부 호스트·OCI 실값·워크플로 보안)
        run: python3 scripts/test_public_repo.py
      - name: 승격 흐름(워크플로 셋·Jenkinsfile 이미지 목록·promote.sh)
        run: |
          python3 scripts/test_release_flow.py
          bash scripts/ci/promote_test.sh

  checks:
    name: checks ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.tests == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # sub-checks.sh 의 묶음(#932) — pytest 는 시험 파일을 넷으로 나눈다
        include:
          - {name: static, args: static}
          - {name: pytest-1of4, args: pytest 1/4}
          - {name: pytest-2of4, args: pytest 2/4}
          - {name: pytest-3of4, args: pytest 3/4}
          - {name: pytest-4of4, args: pytest 4/4}
          - {name: web, args: web}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - run: mkdir -p /tmp/bk /tmp/bk-new && cd /tmp/bk && mkdir -p backend frontend operator classroom ci
      - id: bk-ci
        name: 이미지 층 캐시 복원(ci)
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/bk/ci
          key: bk-ci-${{ hashFiles('docker/ci.Dockerfile','backend/uv.lock','pnpm-lock.yaml') }}
          restore-keys: bk-ci-
      - name: 검사 묶음(sub-checks.sh)
        run: bash scripts/ci/sub-checks.sh ${{ matrix.args }}
      - if: success() && env.CODEMIT_BK_CACHE_SAVE != '' && steps.bk-ci.outputs.cache-hit != 'true'
        name: 이미지 층 캐시 저장(ci, main push 만)
        run: rm -rf /tmp/bk/ci && mv /tmp/bk-new/ci /tmp/bk/ci
      - if: success() && env.CODEMIT_BK_CACHE_SAVE != '' && steps.bk-ci.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/bk/ci
          key: bk-ci-${{ hashFiles('docker/ci.Dockerfile','backend/uv.lock','pnpm-lock.yaml') }}
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checks-test-results-${{ matrix.name }}
          path: test-results/
          retention-days: 7

  guard:
    needs: plan
    if: needs.plan.outputs.tests == '1' && needs.plan.outputs.guard == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, operator, classroom]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - run: mkdir -p /tmp/bk /tmp/bk-new && cd /tmp/bk && mkdir -p backend frontend operator classroom ci
      - id: bk-app
        name: 이미지 층 캐시 복원(${{ matrix.app }})
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/bk/${{ matrix.app }}
          key: bk-${{ matrix.app }}-${{ hashFiles(format('docker/{0}.Dockerfile', matrix.app), 'pnpm-lock.yaml') }}
          restore-keys: bk-${{ matrix.app }}-
      - name: prod 이미지 굽기(amd64)
        run: |
          target=$(python3 scripts/ci/image_context.py field "${{ matrix.app }}" target)
          cache=(--cache-from "type=local,src=$CODEMIT_BK_CACHE/${{ matrix.app }}")
          if [ -n "$CODEMIT_BK_CACHE_SAVE" ]; then
            cache+=(--cache-to "type=local,dest=$CODEMIT_BK_CACHE_NEW/${{ matrix.app }},mode=max")
          fi
          docker build -q --load -f "docker/${{ matrix.app }}.Dockerfile" ${target:+--target "$target"} \
            "${cache[@]}" -t "codemit-${{ matrix.app }}:gha-guard" .
      - name: 부팅 가드(deploy-guard.sh)
        env:
          CODEMIT_GUARD_ARCH: amd64
          CODEMIT_GUARD_IMAGE: codemit-${{ matrix.app }}:gha-guard
        run: bash scripts/ci/deploy-guard.sh "${{ matrix.app }}"
      - if: success() && env.CODEMIT_BK_CACHE_SAVE != '' && steps.bk-app.outputs.cache-hit != 'true'
        name: 이미지 층 캐시 저장(main push 만)
        run: rm -rf /tmp/bk/${{ matrix.app }} && mv /tmp/bk-new/${{ matrix.app }} /tmp/bk/${{ matrix.app }}
      - if: success() && env.CODEMIT_BK_CACHE_SAVE != '' && steps.bk-app.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/bk/${{ matrix.app }}
          key: bk-${{ matrix.app }}-${{ hashFiles(format('docker/{0}.Dockerfile', matrix.app), 'pnpm-lock.yaml') }}
  celery:
    needs: plan
    if: needs.plan.outputs.tests == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - run: mkdir -p /tmp/bk /tmp/bk-new && cd /tmp/bk && mkdir -p backend frontend operator classroom ci
      - id: bk-cbackend
        name: 이미지 층 캐시 복원(backend)
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/bk/backend
          key: bk-backend-${{ hashFiles('docker/backend.Dockerfile','backend/uv.lock') }}
          restore-keys: bk-backend-
      - id: bk-cfrontend
        name: 이미지 층 캐시 복원(frontend)
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/bk/frontend
          key: bk-frontend-${{ hashFiles('docker/frontend.Dockerfile','pnpm-lock.yaml') }}
          restore-keys: bk-frontend-
      - id: bk-coperator
        name: 이미지 층 캐시 복원(operator)
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/bk/operator
          key: bk-operator-${{ hashFiles('docker/operator.Dockerfile','pnpm-lock.yaml') }}
          restore-keys: bk-operator-
      - id: bk-cclassroom
        name: 이미지 층 캐시 복원(classroom)
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/bk/classroom
          key: bk-classroom-${{ hashFiles('docker/classroom.Dockerfile','pnpm-lock.yaml') }}
          restore-keys: bk-classroom-
      - name: celery 브로커(celery-broker.sh)
        env:
          CODEMIT_BK_CACHE_SAVE: ""  # 저장은 guard 잡(과 e2e.yml)이 한다 — 같은 키를 두 잡이 쓰지 않는다
        run: bash scripts/ci/celery-broker.sh

  result:
    name: 결과
    needs: [plan, checks, guard, celery]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # skipped 를 통과로 세지 않는다(#1015) — 조건을 잘못 걸어 필수 잡이 통째로 건너뛰어져도 초록이 되던 구멍.
      # 돌아야 할 잡은 이벤트·plan 이 정한다: plan 이 시험 없음(문서만)이면 나머지는 skipped 여야 하고,
      # 아니면 checks·celery 는 success, guard 는 PR 이 아닐 때(plan 출력 guard=1) success 이고 PR 에서만 skipped.
      - name: 돌아야 할 잡이 success 인가
        env:
          PLAN: ${{ needs.plan.result }}
          TESTS: ${{ needs.plan.outputs.tests }}
          GUARD_ON: ${{ needs.plan.outputs.guard }}
          CHECKS: ${{ needs.checks.result }}
          GUARD: ${{ needs.guard.result }}
          CELERY: ${{ needs.celery.result }}
        run: |
          echo "plan=$PLAN tests=$TESTS guard_on=$GUARD_ON checks=$CHECKS guard=$GUARD celery=$CELERY"
          [ "$PLAN" = success ] || { echo "plan 이 success 가 아니다"; exit 1; }
          if [ "$TESTS" = 1 ]; then
            want_checks=success; want_celery=success
            if [ "$GUARD_ON" = 1 ]; then want_guard=success; else want_guard=skipped; fi
          else
            want_checks=skipped; want_celery=skipped; want_guard=skipped
          fi
          bad=0
          for pair in "checks:$CHECKS:$want_checks" "guard:$GUARD:$want_guard" "celery:$CELERY:$want_celery"; do
            IFS=: read -r name got want <<<"$pair"
            [ "$got" = "$want" ] || { echo "$name: $got (기대 $want)"; bad=1; }
          done
          exit $bad
