# PR 검사 — GitHub 호스팅 실행기에서 도는 PR 검사의 유일한 길이다(#930, ADR-0076 — Jenkins PR 검사는 2026-11-09 에 꺼졌다, #932).
# 검사 내용은 이 파일에 쓰지 않고 scripts/ci/ 의 스크립트들을 그대로 부른다.
#
#   plan    문서(.md·docs/)만 바뀌었나(`changed.sh`) — 그러면 ADR 상태 검사만
#   checks  `sub-checks.sh` — Django check·check --deploy·마이그레이션 호환(#1091)·pytest·생성물·문서 검사·단위 시험·타입 검사
#           pytest(#1088)는 PR 이면 바뀐 앱과 그 앱에 기대는 앱의 시험만, 병합 대기열은 전부를 조각 나란히로(`pytest_plan.py`)
#   guard   (PR 에서는 건너뜀, 병합 대기열에서만 — #1015·#1090) 세 앱 prod 이미지(amd64)를 여기서 굽고 `deploy-guard.sh` — 설정 없이는 죽고, 완전한 설정으로는 뜬다
#   e2e     (#1089) PR 에서만 — 바뀐 앱의 시험을 조각 나란히로(`e2e_plan.py`), 「결과」 필수. 병합 대기열은 돌지 않는다(#1111) —
#           e2e 전부는 매시 main 의 `e2e.yml` 이 돈다
#   celery  `celery-broker.sh` — 실제 Redis 브로커로 beat → worker
#   agent-grader  `agent-grader-check.sh` — 에이전트 채점 실행기 이미지를 arm64 실행기에서 굽고, 운영과 같은 격리 설정으로
#           가짜 벤더(`llm-proxy` 자리)에 Claude Code·Codex 를 한 번씩 돌린다(#999). 진짜 벤더·키 없음
#   결과    위가 모두 초록(또는 문서만이라 건너뜀)이면 초록 — 브랜치 보호의 필수 검사로 걸 이름 하나
#
# 배포 가능 판정은 병합 대기열의 이 검사 한 번이다(#1090) — main 은 대기열로만 움직이고, release.yml 은 검사하지 않고
# 이미지·승격만 한다. 그래서 이 워크플로는 main push 로도, workflow_call 로도 돌지 않는다.
#
# 캐시(#932): 이미지 층은 buildx `type=local` 캐시를 actions/cache 로 옮긴다(키 = Dockerfile·lockfile 해시).
# 여기서는 복원만(`actions/cache/restore`) 한다 — PR·대기열 ref 에서 저장한 캐시는 다른 PR 이 못 읽는다.
# 저장은 release.yml 의 cache 잡이 main 에서 한다(키가 없을 때만 굽는다).
# 별도 권한(`actions: write`)이 필요 없다 — GHA 캐시 백엔드(type=gha) 대신 actions/cache 를 쓰는 까닭이다.
#
# 여기서 굽는 이미지는 amd64 시험용이고 레지스트리에 올리지 않는다(ctx·e2e 태그 없음). 배포할 arm64 이미지는
# image.yml 이 main 에서 굽고 부팅 가드를 다시 돈다.
#
# 보안(공개 저장소): `pull_request` 만(`pull_request_target` 금지), 호스팅 실행기만, secrets 를 쓰지 않는다(값은
# scripts/ci/*.env 의 CI 전용 가짜 값), 권한은 contents: read, 액션은 SHA 로 고정한다.
name: PR 검사

on:
  pull_request:
  # 병합 대기열(#1084) — 대기열이 만든 머지 커밋을 같은 검사로 판정한다. 필수 검사 「결과」가 여기서도 나온다.
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CODEMIT_CI_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
  # 이미지 층 캐시(#932) — 복원만 한다(저장은 release.yml 의 cache 잡)
  # compose(bake)가 로컬 캐시 폴더 읽기·쓰기를 허락받으라고 멈춘다 — 이 실행기 안의 /tmp 폴더라 끈다
  BUILDX_BAKE_ENTITLEMENTS_FS: "0"
  CODEMIT_BK_CACHE: /tmp/bk

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.plan.outputs.tests }}
      # 바뀐 경로가 고르는 묶음(#1082, changed.sh) — back: pytest·celery·agent-grader, front: web, matrix: checks 잡의 조각
      back: ${{ steps.plan.outputs.back }}
      front: ${{ steps.plan.outputs.front }}
      matrix: ${{ steps.plan.outputs.matrix }}
      # pytest 선택 실행(#1088, pytest_plan.py) — pytest_files 는 PR 이 고른 시험 파일(전부면 빈 값), pytest_all 은 전부를 도는가
      pytest_files: ${{ steps.plan.outputs.pytest_files }}
      pytest_all: ${{ steps.plan.outputs.pytest_all }}
      # PR 에서 뺄 잡을 고르는 한 곳(#1015) — PR 이 아닐 때만 '1', 곧 병합 대기열에서 돈다(#1090: 배포 전 amd64 부팅 가드는 대기열 몫).
      guard: ${{ github.event_name != 'pull_request' && '1' || '' }}
      # e2e(#1089) — PR 에서만 바뀐 앱의 시험을 조각 나란히로(e2e_plan.py). 대기열은 돌지 않는다(#1111).
      e2e: ${{ steps.plan.outputs.e2e }}
      e2e_matrix: ${{ steps.plan.outputs.e2e_matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # e2e 조각 시간 기록(#1112) — 매시 e2e.yml 의 durations 잡이 저장한 가장 새 것. 없으면 e2e_plan.py 가 씨앗 기록을 쓴다.
      - name: e2e 시간 기록 복원
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .e2e-durations/record.json
          key: e2e-durations-latest
          restore-keys: e2e-durations-
      - id: plan
        name: 무엇을 돌릴지
        run: |
          base=$(git merge-base origin/main HEAD 2>/dev/null || true)
          # 기준을 못 찾거나 HEAD 자신이면 「바뀐 것 없음」→ 전부 돈다(changed.sh)
          plan=$(bash scripts/ci/changed.sh "$base")
          echo "돌릴 것: $plan (기준 ${base:0:12})"
          tests=$(sed -n 's/^TESTS=//p' <<<"$plan"); back=$(sed -n 's/^BACK=//p' <<<"$plan"); front=$(sed -n 's/^FRONT=//p' <<<"$plan")
          # static 은 시험이 있으면 늘 돈다(schema.gen.ts 최신성 포함). pytest 는 백엔드, web 은 프런트가 바뀌었을 때만.
          # pytest 조각(#1088): PR 은 바뀐 앱의 시험만, 대기열은 전부 — 조각 수는 시간 기록으로 pytest_plan.py 가 정한다
          include='[{"name":"static","args":"static"}]'
          pytest_files=''; pytest_all=0
          if [ "$back" = 1 ]; then
            if [ "${{ github.event_name }}" = pull_request ]; then
              pytest_plan=$(python3 scripts/ci/pytest_plan.py --base "$base")
            else
              pytest_plan=$(python3 scripts/ci/pytest_plan.py --all)
            fi
            pytest_files=$(sed -n 's/^FILES=//p' <<<"$pytest_plan"); pytest_all=$(sed -n 's/^ALL=//p' <<<"$pytest_plan")
            echo "pytest: $(sed -n 's/^MATRIX=//p' <<<"$pytest_plan") 전부=$pytest_all 파일 $(wc -w <<<"$pytest_files")개(0 이면 전부)"
            include=$(jq -c --argjson p "$(sed -n 's/^MATRIX=//p' <<<"$pytest_plan")" '. + $p.include' <<<"$include")
          fi
          if [ "$front" = 1 ]; then include=$(jq -c '. + [{"name":"web","args":"web"}]' <<<"$include"); fi
          matrix="{\"include\":$include}"
          e2e=0; e2e_matrix='{"include":[]}'
          if [ "$tests" = 1 ]; then
            case "${{ github.event_name }}" in
              pull_request) e2e_plan=$(python3 scripts/ci/e2e_plan.py --base "$base" --durations .e2e-durations/record.json) ;;
              # 병합 대기열은 e2e 를 돌지 않는다(#1111, 대표 결정 2026-11-20) — PR 에서 바뀐 앱의 것을 돌았고, 전부는 매시 e2e.yml
              *) e2e_plan="" ;;
            esac
            if [ -n "$e2e_plan" ]; then
              e2e=$(sed -n 's/^E2E=//p' <<<"$e2e_plan"); e2e_matrix=$(sed -n 's/^MATRIX=//p' <<<"$e2e_plan")
            fi
          fi
          {
            echo "e2e=$e2e"
            echo "e2e_matrix=$e2e_matrix"
            echo "tests=$tests"
            echo "back=$back"
            echo "front=$front"
            echo "matrix=$matrix"
            echo "pytest_files=$pytest_files"
            echo "pytest_all=$pytest_all"
          } >>"$GITHUB_OUTPUT"
      - name: ADR 상태
        run: python3 scripts/check_adr_status.py
      - name: 공개해도 되는 HEAD 인가(내부 호스트·OCI 실값·워크플로 보안)
        run: python3 scripts/test_public_repo.py
      - name: 승격 흐름(워크플로 셋·Jenkinsfile 이미지 목록·promote.sh)
        run: |
          python3 scripts/test_release_flow.py
          python3 scripts/test_changed_paths.py
          python3 scripts/test_e2e_plan.py
          python3 scripts/test_playwright_image.py
          python3 scripts/test_pytest_plan.py
          bash scripts/ci/promote_test.sh

  checks:
    name: checks ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.tests == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # sub-checks.sh 의 묶음(#932) — pytest 는 시험 파일을 조각으로 나눈다. 어느 묶음·어느 시험을 돌지는 plan 이 바뀐 경로로 고른다(#1082·#1088)
        include: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - run: mkdir -p /tmp/bk && cd /tmp/bk && mkdir -p backend frontend operator classroom ci
      - id: bk-ci
        name: 이미지 층 캐시 복원(ci)
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/bk/ci
          key: bk-ci-${{ hashFiles('docker/ci.Dockerfile','backend/uv.lock','pnpm-lock.yaml') }}
          restore-keys: bk-ci-
      - name: 검사 묶음(sub-checks.sh)
        env:
          # 마이그레이션 호환 검사(#1091)의 base — PR 은 병합 대상, 대기열은 그 머지 커밋의 base
          CODEMIT_MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          # PR 의 선택 실행이 고른 시험 파일(#1088) — 빈 값이면 전부(pytest_shards.py pick)
          CODEMIT_PYTEST_FILES: ${{ needs.plan.outputs.pytest_files }}
        run: bash scripts/ci/sub-checks.sh ${{ matrix.args }}
      # pytest 조각의 시간 기록(#1083) — 초록이어도 올린다. scripts/ci/pytest-durations-update.sh 가 받아 기록을 다시 쓴다.
      # 전부를 돈 실행만(#1088) — 일부만 돈 PR 의 junit 으로 기록을 쓰면 안 돈 파일이 0초가 된다
      - if: success() && startsWith(matrix.name, 'pytest-') && needs.plan.outputs.pytest_all == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-junit-${{ matrix.name }}
          path: test-results/backend-junit-*.xml
          retention-days: 14
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checks-test-results-${{ matrix.name }}
          path: test-results/
          retention-days: 7

  guard:
    needs: plan
    if: needs.plan.outputs.tests == '1' && needs.plan.outputs.guard == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, operator, classroom]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - run: mkdir -p /tmp/bk && cd /tmp/bk && mkdir -p backend frontend operator classroom ci
      - id: bk-app
        name: 이미지 층 캐시 복원(${{ matrix.app }})
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/bk/${{ matrix.app }}
          key: bk-${{ matrix.app }}-${{ hashFiles(format('docker/{0}.Dockerfile', matrix.app), 'pnpm-lock.yaml') }}
          restore-keys: bk-${{ matrix.app }}-
      - name: prod 이미지 굽기(amd64)
        run: |
          target=$(python3 scripts/ci/image_context.py field "${{ matrix.app }}" target)
          docker build -q --load -f "docker/${{ matrix.app }}.Dockerfile" ${target:+--target "$target"} \
            --cache-from "type=local,src=$CODEMIT_BK_CACHE/${{ matrix.app }}" -t "codemit-${{ matrix.app }}:gha-guard" .
      - name: 부팅 가드(deploy-guard.sh)
        env:
          CODEMIT_GUARD_ARCH: amd64
          CODEMIT_GUARD_IMAGE: codemit-${{ matrix.app }}:gha-guard
        run: bash scripts/ci/deploy-guard.sh "${{ matrix.app }}"
  celery:
    needs: plan
    if: needs.plan.outputs.tests == '1' && needs.plan.outputs.back == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - run: mkdir -p /tmp/bk && cd /tmp/bk && mkdir -p backend frontend operator classroom ci
      - id: bk-cbackend
        name: 이미지 층 캐시 복원(backend)
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/bk/backend
          key: bk-backend-${{ hashFiles('docker/backend.Dockerfile','backend/uv.lock') }}
          restore-keys: bk-backend-
      - id: bk-cfrontend
        name: 이미지 층 캐시 복원(frontend)
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/bk/frontend
          key: bk-frontend-${{ hashFiles('docker/frontend.Dockerfile','pnpm-lock.yaml') }}
          restore-keys: bk-frontend-
      - id: bk-coperator
        name: 이미지 층 캐시 복원(operator)
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/bk/operator
          key: bk-operator-${{ hashFiles('docker/operator.Dockerfile','pnpm-lock.yaml') }}
          restore-keys: bk-operator-
      - id: bk-cclassroom
        name: 이미지 층 캐시 복원(classroom)
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/bk/classroom
          key: bk-classroom-${{ hashFiles('docker/classroom.Dockerfile','pnpm-lock.yaml') }}
          restore-keys: bk-classroom-
      - name: celery 브로커(celery-broker.sh)
        run: bash scripts/ci/celery-broker.sh

  agent-grader:
    needs: plan
    if: needs.plan.outputs.tests == '1' && needs.plan.outputs.back == '1'
    # 운영 호스트와 같은 arm64 — Codex 의 bubblewrap 샌드박스가 이 커널·docker 에서 도는지까지 본다.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # 이 실행기(Ubuntu 24.04)는 AppArmor 가 비특권 사용자 네임스페이스에 능력을 주지 않는다 — Codex 의 bwrap 이 loopback 을
      # 못 세운다(「bwrap: loopback: Failed RTM_NEWADDR」, #999). 운영 호스트에는 AppArmor 가 없어 이 제한 자체가 없다 —
      # 일회용 실행기에서 그 조건을 흉내 내는 것이고, 운영 호스트의 sysctl 은 건드릴 일이 없다.
      - name: 운영 호스트와 같은 조건 — AppArmor 의 사용자 네임스페이스 제한 끄기
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: agent-grader 이미지·두 CLI(agent-grader-check.sh)
        run: bash scripts/ci/agent-grader-check.sh
  e2e:
    name: e2e ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.e2e == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # e2e_plan.py 가 기록된 시험 시간으로 나눈 조각(#1112) — 조각마다 실행기가 하나라 스택을 따로 굽고 나란히 돈다(일꾼은 그대로 1개)
        include: ${{ fromJSON(needs.plan.outputs.e2e_matrix).include }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - run: mkdir -p /tmp/bk && cd /tmp/bk && mkdir -p backend frontend operator classroom ci
      - id: bk-backend
        name: 이미지 층 캐시 복원(backend)
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/bk/backend
          key: bk-backend-${{ hashFiles('docker/backend.Dockerfile','backend/uv.lock') }}
          restore-keys: bk-backend-
      - id: bk-frontend
        name: 이미지 층 캐시 복원(frontend)
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/bk/frontend
          key: bk-frontend-${{ hashFiles('docker/frontend.Dockerfile','pnpm-lock.yaml') }}
          restore-keys: bk-frontend-
      - id: bk-operator
        name: 이미지 층 캐시 복원(operator)
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/bk/operator
          key: bk-operator-${{ hashFiles('docker/operator.Dockerfile','pnpm-lock.yaml') }}
          restore-keys: bk-operator-
      - id: bk-classroom
        name: 이미지 층 캐시 복원(classroom)
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/bk/classroom
          key: bk-classroom-${{ hashFiles('docker/classroom.Dockerfile','pnpm-lock.yaml') }}
          restore-keys: bk-classroom-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - id: pnpm-store
        name: pnpm 저장소 경로
        run: |
          corepack enable
          echo "path=$(pnpm store path --silent)" >>"$GITHUB_OUTPUT"
      - id: bk-pnpm
        name: pnpm 저장소 복원
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-
      # 브라우저·시스템 라이브러리는 설치하지 않는다(#1109) — Playwright 는 e2e.sh 가 공식 이미지에서 돌린다. 여기서는 node_modules 만.
      - name: pnpm 의존
        run: pnpm install --frozen-lockfile
      - name: e2e(e2e.sh)
        env:
          # Playwright 를 scripts/ci/playwright-image(판·다이제스트 고정, 판 ≠ lockfile 이면 실패)에서 — apt·브라우저 CDN 없음(#1109)
          CODEMIT_E2E_PLAYWRIGHT_IMAGE: 1
          # 호스팅 실행기는 코어가 적어(비공개 2·공개 4) 앱 셋·백엔드와 일꾼 둘이 다투면 3초 한도를 넘는다
          CODEMIT_E2E_WORKERS: 1
          CODEMIT_E2E_TARGETS: ${{ matrix.project }}
          CODEMIT_E2E_PATHS: ${{ matrix.paths }}
        run: bash scripts/ci/e2e.sh
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-test-results-${{ matrix.name }}
          path: test-results/
          retention-days: 7

  result:
    name: 결과
    needs: [plan, checks, guard, celery, agent-grader, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # skipped 를 통과로 세지 않는다(#1015) — 조건을 잘못 걸어 필수 잡이 통째로 건너뛰어져도 초록이 되던 구멍.
      # 돌아야 할 잡은 이벤트·plan 이 정한다: plan 이 시험 없음(문서만)이면 나머지는 skipped 여야 하고,
      # 아니면 checks·celery·agent-grader 는 success, guard 는 PR 이 아닐 때(plan 출력 guard=1) success 이고 PR 에서만 skipped.
      - name: 돌아야 할 잡이 success 인가
        env:
          PLAN: ${{ needs.plan.result }}
          TESTS: ${{ needs.plan.outputs.tests }}
          BACK: ${{ needs.plan.outputs.back }}
          GUARD_ON: ${{ needs.plan.outputs.guard }}
          CHECKS: ${{ needs.checks.result }}
          GUARD: ${{ needs.guard.result }}
          CELERY: ${{ needs.celery.result }}
          AGENT_GRADER: ${{ needs.agent-grader.result }}
          E2E_ON: ${{ needs.plan.outputs.e2e }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "plan=$PLAN tests=$TESTS back=$BACK guard_on=$GUARD_ON checks=$CHECKS guard=$GUARD celery=$CELERY agent_grader=$AGENT_GRADER"
          [ "$PLAN" = success ] || { echo "plan 이 success 가 아니다"; exit 1; }
          if [ "$TESTS" = 1 ]; then
            # checks 는 static 이 늘 있어 success. celery·agent-grader 는 백엔드·공통 경로가 바뀌었을 때만 돈다(#1082)
            want_checks=success
            if [ "$BACK" = 1 ]; then want_celery=success; want_agent_grader=success; else want_celery=skipped; want_agent_grader=skipped; fi
            if [ "$GUARD_ON" = 1 ]; then want_guard=success; else want_guard=skipped; fi
          else
            want_checks=skipped; want_celery=skipped; want_guard=skipped; want_agent_grader=skipped
          fi
          # e2e: plan 이 조각을 냈으면 success, 아니면 skipped(바뀐 앱에 시험이 없다)
          if [ "$E2E_ON" = 1 ]; then want_e2e=success; else want_e2e=skipped; fi
          bad=0
          for pair in "checks:$CHECKS:$want_checks" "guard:$GUARD:$want_guard" "celery:$CELERY:$want_celery" "agent-grader:$AGENT_GRADER:$want_agent_grader" "e2e:$E2E:$want_e2e"; do
            IFS=: read -r name got want <<<"$pair"
            [ "$got" = "$want" ] || { echo "$name: $got (기대 $want)"; bad=1; }
          done
          exit $bad
