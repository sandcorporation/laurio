name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: laurio
          POSTGRES_USER: laurio
          POSTGRES_PASSWORD: laurio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laurio -d laurio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # 러너에서는 서비스 컨테이너가 표준 포트로 붙으므로 dev 기본값을 덮어쓴다.
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: laurio
      POSTGRES_USER: laurio
      POSTGRES_PASSWORD: laurio
      DJANGO_SECRET_KEY: ci-only-insecure-key
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "*"
      # 티켓 02(#3): DEBUG=false 인데 비어 있으면 config/settings.py 가 부팅을 거부한다.
      INTERNAL_API_TOKEN: ci-only-insecure-internal-token

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies from lockfile
        working-directory: backend
        run: uv sync --locked

      # --deploy 는 프로덕션 설정이 생기는 티켓 22(#23)에서 켠다. 지금 켜면
      # HSTS·SSL 리다이렉트·보안 쿠키 경고가 매번 떠서 검사가 소음이 된다.
      - name: Django system checks
        working-directory: backend
        run: uv run python manage.py check --fail-level WARNING

      - name: Run tests
        working-directory: backend
        run: uv run pytest
