name: CI

on:
  push:
    branches: [main]
  pull_request:

# **잡을 셀프호스티드 러너(`sub`)에서 돌린다.** GitHub 호스티드 러너가 계정 결제
# 문제로 잡을 시작조차 못 하게 되면서(9잡 전부 2~3초 만에 "The job was not started
# because recent account payments have failed…"), CLAUDE.md 문서 한 줄만 바꾼 커밋까지
# 빨갛게 났다 — 코드로는 깨뜨릴 수 없는 커밋이라 원인이 계정 쪽임이 분명했다.
#
# **되돌리려면** 아래 `runs-on` 을 `ubuntu-latest` 로 되돌리면 된다. 라벨은 그 러너에
# 실제로 붙어 있는 것 중 이 호스트를 특정하는 값(`sub`)을 쓴다 — `linux`·`x64` 같은
# 자동 라벨만으로는 다른 러너가 생겼을 때 엉뚱한 곳으로 간다.
#
# **이 러너는 staging 스택과 같은 호스트에 있다.** 그래서 두 가지를 확인하고 붙였다:
#
# 1. **데이터는 섞이지 않는다.** compose 파일이 프로젝트 이름을 박아 둔다
#    (`compose.dev.yaml` = `codemit-dev`, `compose.staging.yaml` = `codemit-staging`).
#    아래 celery 잡의 `down -v` 는 `codemit-dev` 만 지우므로 staging 볼륨에 닿지 못한다.
# 2. **포트가 겹치면 조용히 붙지 않고 죽는다.** dev 스택은 55432·58000·16379·19000·
#    53000·53001 을, staging 은 8000·3000·3001 만 호스트에 낸다. 겹칠 일이 없지만,
#    설령 겹쳐도 `docker compose up` 이 포트 바인딩 실패로 멈춘다 —
#    `docker/dev-env.sh` 가 적어 둔 그대로 "조용히 남의 스택에 붙는 것보다 못 뜨는
#    편이 낫다".
#
#    `test` 잡의 postgres 서비스 컨테이너는 호스트 포트를 **고정하지 않는다**(#243) —
#    Docker 가 그때그때 비어 있는 포트를 골라 주므로 이 호스트의 어떤 것과도, 그리고
#    이 워크플로 자신의 동시 실행과도 겹치지 않는다. 이유는 `test` 잡 정의 옆
#    주석에 있다.

# **한 번에 한 실행만 돈다.** 러너 호스트가 공유 자원이라(같은 프로젝트 이름의 dev
# 스택을 여러 잡이 띄운다) 두 실행이 겹치면 서로의 컨테이너를 건드린다. 그래서
# `cancel-in-progress: false` 로 도는 것을 죽이지 않고 줄을 세운다.
#
# **다만 「하나도 버리지 않는다」는 사실이 아니다**(2026-09-18 에 고친 문장 — 예전에
# 여기 그렇게 적혀 있었다). GitHub 은 한 그룹에 **pending 을 하나만** 둔다: 하나가
# 도는 중이고 하나가 대기하는데 세 번째가 도착하면, **대기 중이던 것이 잡 하나도
# 돌리지 못한 채 cancelled 로 끝난다.** 실측으로 그렇게 났다 — 커밋 셋을 몇 분 안에
# 연달아 push 했더니 가운데 것이 잡 0개로 취소됐다.
#
# **그래서 main 에 빠르게 연달아 push 하면 중간 커밋은 CI 를 아예 못 받는다.** 마지막
# 커밋만 초록이면 그 앞의 것들은 검증되지 않은 채 지나간다. `production` 승격은
# 「CI 를 통과한 main 커밋」만 따라가므로 안전하다. **그 커밋의 push 에만 붙은 잡은
# 기회를 잃는다** — `glitchtip-resolve` 가 그랬고, 지금은 범위를 「직전에 그 잡이
# 성공한 실행 이후」로 잡아 다음 실행이 줍는다(그 잡 정의 옆 주석 참고). 그런 잡을
# 새로 만들 때는 같은 문제를 같은 방식으로 풀어야 한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: [self-hosted, sub]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: codemit
          POSTGRES_USER: codemit
          POSTGRES_PASSWORD: codemit
        ports:
          # **호스트 포트를 고정하지 않는다(#243).** 예전엔 `55532:5432` 로 고정했다 —
          # 표준 포트(5432)를 피하고(이 러너 호스트에서 5432 가 이미 점유돼 「Initialize
          # containers」가 죽은 적이 있다) dev 스택의 55432(CLAUDE.md 포트 표)와도
          # 겹치지 않게 한 칸 더 옮긴 값이었다. 그런데 그 고정값 자체가 새 충돌점이
          # 됐다: 이 워크플로엔 `concurrency: ci-${{ github.ref }}` 가 있어 **같은**
          # ref 의 실행은 큐에 서지만, **다른** ref(다른 브랜치·PR)의 실행은 같은
          # 셀프호스티드 러너에서 동시에 돌 수 있다 — 두 실행이 똑같이 55532 를
          # 잡으려 하면 나중 것이 `failed to bind host port 0.0.0.0:55532/tcp:
          # address already in use` 로 「Initialize containers」에서 죽는다(실제로
          # 한 번 그렇게 죽었다, 원인은 이 워크플로 자체 조사로는 확정하지 못했지만
          # 이게 남은 유력한 설명이다). 고정값을 아무리 옮겨도 이 워크플로의 두
          # 동시 실행끼리는 항상 같은 값을 다시 잡으므로 이 충돌은 번호를 바꿔서는
          # 못 없앤다.
          #
          # 그래서 호스트 포트를 아예 비워 둔다 — 컨테이너 포트(5432)만 적으면
          # Docker 가 그 순간 비어 있는 포트를 골라 매핑한다(GitHub Actions 문서가
          # 보장하는 동작). 그러면 5432·55432 와 겹칠 일도, 이 워크플로의 다른
          # 실행과 겹칠 일도 구조적으로 없어진다 — 특정 번호를 다시 고르는 문제가
          # 아니라 번호를 고르지 않는 것으로 치웠다. 실제로 배정된 포트는 실행
          # 중에만 알 수 있으므로, 아래 "Resolve dynamically assigned postgres
          # port" 스텝이 `${{ job.services.postgres.ports['5432'] }}` 로 읽어
          # `POSTGRES_PORT` 로 내려 준다.
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U codemit -d codemit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    # **redis 서비스는 없앴다.** 예전 주석은 「테스트가 실제 Redis 를 상대로 돈다」고
    # 적었지만 더 이상 사실이 아니다 — `config/settings.py` 의 `_RUNNING_TESTS` 가
    # 테스트에서 세션 캐시를 LocMem 으로 바꾼다(CLAUDE.md 도 「pytest 에 Redis 가
    # 필요 없다, 예전 문장은 더 이상 사실이 아니다」라고 못박는다). 공유 호스트에서
    # 6379 를 잡을 이유가 없다.

    env:
      POSTGRES_HOST: 127.0.0.1
      # POSTGRES_PORT 는 여기 없다 — 위 services.postgres.ports 가 호스트 포트를
      # 고정하지 않으므로(#243) 잡이 시작되는 시점엔 아직 그 값을 모른다. 아래
      # "Resolve dynamically assigned postgres port" 스텝이 `$GITHUB_ENV` 로
      # 내려 준 뒤에야 이후 스텝에서 쓸 수 있다.
      POSTGRES_DB: codemit
      POSTGRES_USER: codemit
      POSTGRES_PASSWORD: codemit
      DJANGO_SECRET_KEY: ci-only-insecure-key
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "*"
      # DJANGO_DEBUG=false 인데 비어 있으면 config/settings.py 가 부팅을 거부하는
      # 항목들. CI는 운영 배포가 아니지만(CODEMIT_DEPLOYMENT_TARGET 미설정 =
      # "development"), DEBUG=false로 실행하는 이상 이 값들은 그대로 요구된다 —
      # 여기서 요구하는 건 "값이 비어 있지 않을 것"뿐이지 "진짜 운영 비밀일 것"이
      # 아니다.
      INTERNAL_API_TOKEN: ci-only-insecure-internal-token
      JWT_SIGNING_KEY: ci-only-insecure-jwt-signing-key
      PAYMENT_WEBHOOK_SECRET: ci-only-insecure-fake-pg-webhook-secret
      PAYOUT_WEBHOOK_SECRET: ci-only-insecure-fake-toss-payout-webhook-secret
      # Fernet 키는 형식이 고정돼 있다(urlsafe base64 32바이트) — settings.py의 dev
      # fallback과 같은 값을 그대로 쓴다(둘 다 저장소에 이미 공개돼 있어 새로 유출될
      # 비밀이 아니다).
      VERIFICATION_ENCRYPTION_KEY: A0crfksMrBmbSY37jIyOwcPRFpK9rc_eIaNnL89lIfo=
      # #10 리뷰: "어떤 어댑터 구현체를 쓸지"는 DEBUG(=이게 진짜 운영 배포인지)와
      # 다른 질문이다. 기본값이 이미 fake이므로 없어도 같은 값이지만, CI가 반드시
      # fake로 돈다는 것을 여기 명시적으로 남긴다 — staging/production 배포(#23)만
      # real(또는 실제 어댑터의 dotted path)로 바꾼다.
      STORAGE_BACKEND: fake
      SOCIAL_AUTH_MODE: fake
      VERIFICATION_ADAPTER_MODE: fake
      PAYMENT_ADAPTER_MODE: fake
      PAYOUT_ADAPTER_MODE: fake
      LLM_ADAPTER_MODE: fake
      # #340: 강의실 채점의 어댑터 모드도 같은 원칙 — 기본값이 이미 fake이므로
      # 없어도 같은 값이지만 명시적으로 남긴다.
      CLASSROOM_SCORING_ADAPTER_MODE: fake
      LLM_REQUIREMENT_CHAT_ADAPTER_MODE: fake

    steps:
      - uses: actions/checkout@v4

      # postgres 서비스 컨테이너의 호스트 포트가 동적으로 배정되므로(위
      # services.postgres.ports 주석, #243) 이후 스텝이 쓸 POSTGRES_PORT 를 여기서
      # 한 번 계산해 `$GITHUB_ENV` 에 적어 둔다. `job.services.<서비스 id>.ports`
      # 는 컨테이너 포트 → 실제 배정된 호스트 포트 매핑을 주는, GitHub Actions 가
      # 문서로 보장하는 컨텍스트다 — 호스트 포트를 비워 둔 서비스 컨테이너에서
      # 그 값을 읽는 표준적인 방법이다.
      - name: Resolve dynamically assigned postgres port
        run: echo "POSTGRES_PORT=${{ job.services.postgres.ports['5432'] }}" >> "$GITHUB_ENV"

      # **`timeout` 값은 러너 속도에 민감하다.** 이 가드들은 「컨테이너가 부팅을
      # 거부하고 죽는가」를 보고, 124(타임아웃)를 「안 죽었다 = 가드가 깨졌다」로
      # 읽는다. 그 판정은 맞지만 숫자가 호스티드 러너 속도에 맞춰 20초였고,
      # 셀프호스티드 러너에서 그 문턱을 넘겨 **멀쩡한 가드가 깨진 것으로 보고됐다**.
      # 60초로 올린다 — 45초 걸려 거부해도 거부는 거부다. 타임아웃은 「죽지 않는
      # 컨테이너가 CI 를 영원히 붙잡지 않게」 하는 상한이지 성능 단언이 아니다.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies from lockfile
        working-directory: backend
        run: uv sync --locked

      # --deploy 는 이 잡(CODEMIT_DEPLOYMENT_TARGET 미설정 = "development")에는 켜지
      # 않는다 — HSTS·SSL 리다이렉트·secure 쿠키는 config/settings.py에서 production
      # 에만 켜지도록 설계했으므로(#23), 여기서 --deploy를 켜면 이 잡의 목적과 무관한
      # 경고가 매번 뜬다. production 구성이 실제로 --deploy를 통과하는지는 아래
      # `deploy-check` 잡이 별도로 검증한다.
      - name: Django system checks
        working-directory: backend
        run: uv run python manage.py check --fail-level WARNING

      # 문법 검사(#409) 테스트가 쓰는 tree-sitter 문법을 먼저 받는다 — 채점 코드는 문법을
      # 내려받지 않으므로(없으면 AI 판정으로 넘김) 캐시가 빈 러너에서는 파서 판정 테스트가
      # 어긋난다. 이미지에서는 docker/backend.Dockerfile 이 같은 명령을 부른다.
      - name: Prefetch tree-sitter grammars
        working-directory: backend
        run: uv run python manage.py prefetch_syntax_grammars --skip-checks

      - name: Run tests
        working-directory: backend
        run: uv run pytest

  deploy-check:
    # 티켓 01(#1)이 "HSTS·SSL 리다이렉트·보안 쿠키 경고가 매번 떠서 소음이 된다"는
    # 이유로 미룬 `manage.py check --deploy`를 여기서 켠다(#23). production
    # 배포에서만 요구되는 하드닝(config/settings.py의 IS_PRODUCTION_DEPLOYMENT
    # 블록)이라 위 `test` 잡(development)과는 별도 잡으로 분리했다 — 그래야 이
    # 검사가 걸려도 `test` 잡의 매 커밋 시그널이 이 경고로 오염되지 않는다.
    #
    # 여기 쓰는 값은 전부 CI 전용 더미다(`test` 잡의 기존 주석과 같은 원칙) — 다만
    # DJANGO_SECRET_KEY만은 config/settings.py의 production 강도 가드(50자 이상·
    # 고유 문자 5종 이상·django-insecure- 접두 아님)를 실제로 통과해야 하므로 그
    # 조건을 만족하는 무작위스러운 더미 문자열을 쓴다. `manage.py check`는 DB에
    # 붙지 않으므로 postgres 서비스 컨테이너가 필요 없다.
    runs-on: [self-hosted, sub]

    env:
      CODEMIT_DEPLOYMENT_TARGET: production
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: "ci-deploy-check-only-Kx8f3Kq0mN2pR7tYcVbGhJkLdSaWeUiOaXzCvBnMqWeRtYuIoPaSdFgHjKlZxCvB"
      DJANGO_ALLOWED_HOSTS: "api.codemit.example"
      # #43: 배포 환경에서 비면 부팅을 거부한다 — 이 잡의 env가 그 가드를
      # 실제로 통과하는지도 함께 검증한다(코디네이터 리뷰 지적 — 이 값이 없어서
      # 이 잡은 어댑터 모드와 무관하게 이미 실패하고 있었다).
      CODEMIT_OPERATOR_ORIGIN: "https://operator.codemit.example"
      POSTGRES_DB: codemit
      POSTGRES_USER: codemit
      POSTGRES_PASSWORD: ci-deploy-check-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      INTERNAL_API_TOKEN: ci-deploy-check-only-internal-token
      JWT_SIGNING_KEY: ci-deploy-check-only-jwt-signing-key
      PAYMENT_WEBHOOK_SECRET: ci-deploy-check-only-payment-webhook-secret
      PAYOUT_WEBHOOK_SECRET: ci-deploy-check-only-payout-webhook-secret
      VERIFICATION_ENCRYPTION_KEY: A0crfksMrBmbSY37jIyOwcPRFpK9rc_eIaNnL89lIfo=
      STORAGE_BACKEND: s3
      STORAGE_BUCKET: codemit-prod
      STORAGE_ENDPOINT_URL: https://s3.amazonaws.com
      STORAGE_ACCESS_KEY: ci-deploy-check-only-access-key
      STORAGE_SECRET_KEY: ci-deploy-check-only-secret-key
      STORAGE_REGION: us-east-1
      # 공개 이미지 버킷의 기준 주소(#233, ADR-0032) — 배포 환경에서 비면
      # config/settings.py 의 부팅 가드가 거부한다. 위 STORAGE_* 자격증명과 같은
      # 이유로 여기 있다: 이 잡이 검증하는 "배포 하드닝이 통과하는가"에 포함된다.
      # 실제로 이 주소를 치지는 않는다(backend 만 도는 잡이다).
      STORAGE_IMAGES_BASE_URL: https://cdn.ci-deploy-check-only.invalid/codemit-prod-public-images
      SOCIAL_AUTH_MODE: real
      # 카카오 OAuth 앱 자격증명(#95/#96) — authorize・code→token 교환은
      # frontend BFF가 지므로 이 잡(backend만 돈다)은 실제로 쓰지 않지만,
      # SOCIAL_AUTH_MODE=real인 배포 환경에서 이 값들이 비면 config/settings.py
      # 의 부팅 가드가 거부한다 — 이 잡이 검증하는 "배포 하드닝이 통과하는가"에
      # 포함된다.
      KAKAO_REST_API_KEY: ci-deploy-check-only-kakao-rest-api-key
      KAKAO_SECRET_KEY: ci-deploy-check-only-kakao-secret-key
      KAKAO_REDIRECT_URI: https://api.codemit.example/api/auth/social/kakao/callback
      # 실제 벤더 어댑터(#85 PortOne, #87 Toss, #57 Seller 등록, #88 OpenAI)는
      # 아직 구현되지 않았다(#23/#83 범위 밖) — 이 잡이 검증하려는 건 "배포
      # 하드닝이 통과하는가"이지 "어댑터가 실물인가"가 아니다. `core.adapters.
      # check_adapter_mode`(#83)는 "fake"도 아니고 실제로 쓸 수도 없는 값(import·
      # 인스턴스화·계약 충족 중 하나라도 실패)을 거부하므로, 문자 그대로 "real"은
      # 더 이상 통과하지 못한다(dotted path가 아니다) — `tests/adapter_stubs.py`가
      # 제공하는, 각 Protocol을 구조적으로 만족하는 최소 stub을 대신 가리킨다.
      # 실물 어댑터가 생기면 그 dotted path로 바뀐다.
      VERIFICATION_ADAPTER_MODE: tests.adapter_stubs.StubVerificationAdapter
      PAYMENT_ADAPTER_MODE: tests.adapter_stubs.StubPGAdapter
      PAYOUT_ADAPTER_MODE: tests.adapter_stubs.StubPayoutAdapter
      SELLER_ADAPTER_MODE: tests.adapter_stubs.StubSellerAdapter
      LLM_ADAPTER_MODE: tests.adapter_stubs.StubLLMScoringAdapter
      # #340: 강의실 채점(classroom/scoring.py)의 어댑터 모드 — LLM_ADAPTER_MODE와
      # 별개의 설정 키라 여기도 명시하지 않으면 부팅 가드가 이 잡을 거부한다.
      CLASSROOM_SCORING_ADAPTER_MODE: tests.adapter_stubs.StubLLMScoringAdapter
      LLM_REQUIREMENT_CHAT_ADAPTER_MODE: tests.adapter_stubs.StubRequirementChatAdapter
      # #193 — 일곱 번째 어댑터. 이 값이 빠져 있으면 부팅 가드가 거부해 이 잡이
      # 통째로 실패한다. 실제로 #193 머지에서 그랬다: 배포 파일 넷(compose 둘,
      # env.example 둘)은 갱신됐는데 이 잡의 env 만 빠졌고, 체인의 로컬 게이트
      # (pytest·typecheck)는 이 잡을 돌리지 않아 볼 수 없었다.
      GITHUB_ADAPTER_MODE: tests.adapter_stubs.StubGitHubAdapter
      # #380 — 이벤트 버스도 배포 부팅 가드 대상이 됐다. #193 과 똑같이 스텁(StubEventBus)은
      # 저장소에 들어갔는데 이 잡의 env 만 빠져 main 에서 이 잡이 빨갛게 났다(8ffa788).
      EVENT_BUS_ADAPTER_MODE: tests.adapter_stubs.StubEventBus
      # #450/#451 — 검색 어댑터도 배포 부팅 가드 대상이 됐다. #193·#380 과 같은
      # 이유로 이 잡의 env 에도 채운다 — 빠지면 이 잡이 빨갛게 난다.
      SEARCH_ADAPTER_MODE: tests.adapter_stubs.StubContestSearchAdapter
      # #89: RealAlimtalkAdapter/RealSmsAdapter/RealLmsAdapter는 저장소에 없는
      # 클래스였다 — 그 사실이 부팅 가드 없이는 드러나지 않았다. 실물 벤더
      # 어댑터(#51, notifications.adapters_aligo)는 이제 존재하지만, 이 잡은
      # PAYMENT_ADAPTER_MODE가 TossPGAdapter가 나온 뒤에도 계속 stub을 가리키는
      # 것과 같은 이유로 여전히 stub을 가리킨다 — "배포 하드닝이 통과하는가"를
      # 벤더 자격증명 없이 검증하는 것이 이 잡의 목적이다. 실물 Aligo 어댑터가
      # 자격증명과 함께 실제로 부팅되는지는 tests/test_deployment_config.py의
      # 전용 테스트가 별도로 검증한다.
      NOTIFICATION_ALIMTALK_ADAPTER: tests.adapter_stubs.StubAlimtalkChannelAdapter
      NOTIFICATION_SMS_ADAPTER: tests.adapter_stubs.StubSmsChannelAdapter
      NOTIFICATION_LMS_ADAPTER: tests.adapter_stubs.StubLmsChannelAdapter

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies from lockfile
        working-directory: backend
        run: uv sync --locked

      - name: Django system checks (production, --deploy)
        working-directory: backend
        run: uv run python manage.py check --deploy --fail-level WARNING

  # FE-03(#28) — 프론트 타입이 백엔드의 OpenAPI 스키마에서 생성한 그대로 최신인지
  # 확인한다. `frontend/scripts/generate-api-types.mjs` 를 그대로 돌린 뒤
  # `git diff --exit-code` 로 커밋된 산출물과 다르면 실패시킨다 — 재생성했을 때
  # diff 가 나면 실패한다는 티켓의 요구사항 그대로다.
  #
  # 이 검사는 dev compose 스택을 띄우지 않는다. django-ninja 의 스키마 생성은
  # DB 접속 없이 등록된 라우터·스키마 클래스를 읽어들이는 것뿐이라
  # (`backend/core/management/commands/export_openapi_schema.py` 참고),
  # `uv sync` 만 된 신선한 체크아웃에서도 돈다 — frontend-test 잡처럼 컨테이너가
  # 뜨고 헬스체크가 통과하길 기다릴 필요가 없어 더 빠르고 스택 기동 실패에
  # 영향받지 않는다.
  frontend-openapi-types:
    runs-on: [self-hosted, sub]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend dependencies from lockfile
        working-directory: backend
        run: uv sync --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install frontend dependencies from lockfile
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Regenerate types from the backend's OpenAPI schema
        working-directory: frontend
        run: pnpm generate:api

      - name: Fail if the committed types are stale
        run: |
          if ! git diff --exit-code -- packages/bff-client/src/schema.gen.ts; then
            echo "::error::packages/bff-client/src/schema.gen.ts 가 backend 의 현재 OpenAPI 스키마와" \
                 "다릅니다. 'pnpm --dir frontend generate:api' 로 다시 만들어 커밋하세요."
            exit 1
          fi

  # 금칙어 목록(spec #474, #475/#476, ADR-0051)이 backend/core/banned_words.py 의
  # 현재 값과 같은지 확인한다 — frontend-openapi-types 와 같은 모양(재생성 후
  # `git diff` 로 최신성을 본다)이고 같은 이유로 dev compose 스택을 기다리지 않는다:
  # `export_banned_words` 도 순수 파이썬 모듈을 읽어들일 뿐 DB 에 접속하지 않는다.
  # **다른 잡에 얹지 않는다** — frontend-openapi-types·adr-status·screen-language 와
  # 같은 이유로, 이 검사가 frontend-pure-unit-tests 안에서 실패하면 빨간 잡 이름이
  # 무엇이 깨졌는지 거짓말한다.
  banned-words-generated:
    runs-on: [self-hosted, sub]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend dependencies from lockfile
        working-directory: backend
        run: uv sync --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install workspace dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Regenerate the list from the backend's banned-word lists
        working-directory: packages/banned-words
        run: pnpm run generate

      - name: Fail if the committed list is stale
        run: |
          if ! git diff --exit-code -- packages/banned-words/src/generated/banned-words.gen.ts; then
            echo "::error::packages/banned-words/src/generated/banned-words.gen.ts 가 backend 의 현재" \
                 "금칙어 목록과 다릅니다. 'pnpm --dir packages/banned-words generate' 로 다시 만들어 커밋하세요."
            exit 1
          fi

  # 순수 함수 시임(#160, ADR-0026) — react·next(next/server 제외)를 임포트하지 않는
  # 모듈만 대상으로 한다. dev compose 스택을 기다리지 않는다(frontend-openapi-types와
  # 같은 이유 — 백엔드도 브라우저도 필요 없다). `vitest.shared.mts`의
  # `pureModuleGuard()`가 그 경계를 CI에서 실제로 강제한다: 대상 모듈이 react나
  # next의 렌더링/라우팅 표면을 임포트하면 이 잡이 빨간불로 끝난다(리뷰가 아니라
  # 러너가 거부한다).
  # **문서가 스스로 낡았다고 말하게 한다** (#docs-freshness). ADR 은 「그때의 판단」이고
  # 현재 상태는 CLAUDE.md 가 말한다 — 그 구분이 서려면 모든 ADR 이 Status 줄을 가져야
  # 한다. **표시가 없는 것이 정보가 되려면 조용히 깨지지 않아야 하기 때문**이다: 일부에만
  # 붙어 있으면 표시 없는 ADR 이 「살아있다」인지 「아무도 안 고쳤다」인지 구별되지 않는다.
  #
  # **다른 잡에 얹지 않는다.** 이 검사가 `frontend-pure-unit-tests` 안에서 실패하면 빨간
  # 잡 이름이 무엇이 깨졌는지 거짓말한다 — 이 저장소가 내내 경계하는 「코드 회귀와
  # 구분되지 않는 모양」이다. 10초짜리 잡 하나가 그 값을 한다.
  #
  # ADR 템플릿은 이 저장소가 아니라 플러그인 스킬 안에 있어, 저장소가 새 ADR 의 모양을
  # 강제할 다른 수단이 없다.
  adr-status:
    runs-on: [self-hosted, sub]

    steps:
      - uses: actions/checkout@v4

      - name: Every ADR says whether it is still in force
        run: python3 scripts/check_adr_status.py

  # 공개 앱 화면 문자열 + 백엔드가 공개 앱으로 던지는 오류 메시지에 영어
  # 도메인 용어·ADR/이슈 번호가 다시 새지 않게 막는다(#267, #268) — #266이 그
  # 시점의 프론트 19곳을, #268이 백엔드 `HttpError(...)` 메시지들을 치웠지만
  # 사람도 에이전트도 CONTEXT.md 의 `_화면에서_` 줄을 매번 찾아보지는
  # 않으므로 기계가 매 커밋 확인한다. 용어 목록은 두 스크립트 다
  # CONTEXT.md 에서 직접 읽는다 — 이 워크플로에 따로 베끼지 않는다.
  # `check_backend_error_language`는 `check_screen_language`를 그대로
  # 임포트해 용어·예외 표시 로직을 공유한다(#268). adr-status 와 같은 이유로
  # 별도 잡이다: 컨테이너도 pnpm install 도 필요 없어 1분 안에 끝나고,
  # 실패하면 잡 이름 자체가 무엇이 깨졌는지 말한다.
  screen-language:
    runs-on: [self-hosted, sub]

    steps:
      - uses: actions/checkout@v4

      - name: Public app screen strings stay in Korean
        run: python3 scripts/check_screen_language.py

      - name: Internal-vocabulary gate is wired correctly (#308)
        run: python3 scripts/test_check_screen_language.py

      - name: Backend error messages reaching the public app stay in Korean
        run: python3 scripts/check_backend_error_language.py

  # 자동 진단(`.claude/skills/glitchtip-triage/`)이 고친 오류를 GlitchTip 에서
  # 닫는다 — 커밋 메시지의 `GlitchTip: <id>` 줄 하나를 읽는다. **세션이 직접
  # 닫지 않는 이유**가 이 잡의 존재 이유다: 「고친 것 같다」와 「고쳤다」를 가르는
  # 것은 CI 이고, 그래서 진단 세션에는 읽기 전용 토큰만 준다.
  #
  # `main` push 에서만 돈다(PR 에서는 아직 고쳐진 것이 아니다). `needs: test` 로
  # 백엔드 테스트가 초록일 때만 표시한다 — 그 앞의 다른 잡까지 기다리게 하지는
  # 않는다(표시가 조금 늦는 것과 영원히 안 나는 것은 다르고, 여기서 막고 싶은
  # 것은 뒤쪽이다). 스크립트는 어떤 실패에도 exit 0 한다: 이미 머지된 수정을
  # 되돌릴 수는 없고, 표시 실패는 배포를 세울 일이 아니다(이유는 그 파일에).
  #
  # **범위는 「직전에 이 잡이 성공한 실행 이후」다**(2026-09-22). 예전에는
  # `before..sha` 였는데, 위 concurrency 주석의 「pending 은 하나만」 때문에 대기
  # 중에 취소된 커밋은 다음 push 의 범위에도 들지 않아 **영영 읽히지 않았다.**
  # 9-18 에 이 구멍을 적으며 「자동화가 push 한 직후엔 사람이 기다린다」를 완화책으로
  # 뒀는데, 정작 **자동화 자신이** 2분 간격으로 셋을 밀어 가운데 오류 75 가 남았다 —
  # 사람이 기다리는 규칙으로는 막을 수 없는 경우였다.
  #
  # 지금은 취소된 커밋을 **다음에 이 잡이 성공하는 실행이 줍는다.** 그러면서도 넓은
  # 창의 위험(재발을 숨기는 것)은 없다: 기준이 「이 잡이 성공한 실행」이라 커밋 하나는
  # 그런 실행 **하나에만** 속하고, 한 번 읽힌 커밋은 다시 읽히지 않는다. 기준을 「실행
  # 전체가 초록」으로 잡지 않은 이유도 같다 — 테스트는 초록인데 e2e 가 빨개 실행이
  # 실패하면 이 잡은 이미 돌아서 닫았는데, 그 실행을 빼면 다음에 같은 커밋을 다시 읽어
  # 그 사이 재발한 오류를 해결로 덮는다.
  #
  # 둘 다 실제 실행으로 재현해 확인했다: 오류 75 를 놓쳤던 실행(52d0fea)은 새 방식으로
  # 75·77 을 둘 다 줍고, 그다음 실행은 기준을 52d0fea 로 잡아 둘을 다시 읽지 않는다.
  #
  # 손으로 만회해야 할 일이 생기면 범위를 직접 준다: `scripts/glitchtip_resolve.py
  # <놓친커밋>~1 <놓친커밋>`.
  # **push 직후 GlitchTip 에 「수정이 들어갔다」를 적는다 — `needs` 가 없다.**
  # 해결 표시는 `needs: test` 뒤에 오므로 push 와 GlitchTip 사이에 5~10분이 있다
  # (실측: 커밋 05:03:19 → 표시 05:11:06). 그 사이 화면은 **「아직 안 닫혔다」와
  # 「배선이 고장났다」를 구별해 주지 않는다** — 실제로 그 질문을 받았다(2026-09-18).
  # 이 잡은 그 갈림을 화면에 적기만 하고 상태는 건드리지 않는다: 닫는 판정은 여전히
  # 아래 `glitchtip-resolve` 의 것이다.
  glitchtip-ack:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, sub]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: This push carries a fix — say so in GlitchTip
        env:
          GLITCHTIP_TOKEN_FOR_AUTOMATION: ${{ secrets.GLITCHTIP_TOKEN_FOR_AUTOMATION }}
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="${{ github.sha }}~1"
          fi
          python3 scripts/glitchtip_resolve.py --ack "$BASE" "${{ github.sha }}"

  glitchtip-resolve:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: [self-hosted, sub]
    # **`actions: read` 를 명시해야 한다**(2026-09-22). 저장소 기본 워크플로 권한이
    # `read` 인데, GitHub 에서 그 값은 「저장소 콘텐츠와 패키지 읽기」만 뜻하고
    # **Actions 실행 목록은 포함하지 않는다** — 명시하지 않았더니 실행 목록 API 가
    # 403 을 냈다. 잡에 권한을 적으면 적은 것만 받으므로 체크아웃용 `contents` 도 함께
    # 적는다.
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # 커밋 메시지를 읽으려면 이 push 의 범위가 다 있어야 한다. 얕은
          # 체크아웃(기본값 depth 1)에서는 `before..sha` 가 성립하지 않는다.
          fetch-depth: 0

      - name: Errors fixed since this job last succeeded are closed in GlitchTip
        env:
          GLITCHTIP_TOKEN_FOR_AUTOMATION: ${{ secrets.GLITCHTIP_TOKEN_FOR_AUTOMATION }}
          # 직전에 이 잡이 성공한 실행을 찾으려고 Actions API 를 읽는다(위 permissions).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # 범위는 `before..sha` 가 아니라 **직전에 이 잡이 성공한 실행 이후**다
          # (2026-09-22). 짧은 간격으로 연달아 push 하면 가운데 실행이 대기 중에
          # 취소되는데(위 concurrency 주석), `before..sha` 는 그 커밋을 포함하지 않아
          # 그 커밋의 `GlitchTip:` 줄이 영영 읽히지 않았다 — 자동 진단이 2분 간격으로
          # 셋을 밀어 오류 75 가 그렇게 남았다. 이유와 재발을 덮지 않는 근거는
          # 스크립트의 `_last_resolved_head` 에 있다.
          #
          # **API 가 실패하면 옛 범위(`before..sha`)로 물러난다** — 옛 방식보다 나빠지지
          # 않으려는 것이다. 처음에는 「이 커밋 하나만」으로 물러나게 했는데, 권한이 없어
          # 실제로 물러났을 때 그건 **push 하나에 담긴 여러 커밋 중 마지막만 읽는 것**이라
          # 고치기 전보다 좁았다.
          python3 scripts/glitchtip_resolve.py auto "${{ github.sha }}" \
            --fallback-base "${{ github.event.before }}"

  frontend-pure-unit-tests:
    runs-on: [self-hosted, sub]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install workspace dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Shared BFF package — path safety·allowlist·origin
        working-directory: packages/bff-shared
        run: pnpm run test

      # 마크다운 렌더러의 허용 목록·파일 이름 계산(2026-09-16 에 강의실에서 패키지로
      # 옮겼다). 강의실에 있던 동안 이 세 파일은 **CI 에서 한 번도 돌지 않았다** —
      # 이 잡이 세 군데(bff-shared·frontend·operator)만 불렀고 강의실은 빠져 있었다.
      # 옮기면서 그 구멍을 같이 막는다.
      - name: Shared markdown renderer — allow-list·file names
        working-directory: packages/markdown
        run: pnpm run test

      # 금칙어 판정 순수 함수(spec #474, #476) — 우회 표기를 잡지 않는다는 결정과
      # 백엔드와 같은 판정을 고정한다.
      - name: Shared banned-word package — impersonation·profanity judgement
        working-directory: packages/banned-words
        run: pnpm run test

      - name: Public app — pure modules
        working-directory: frontend
        run: pnpm run test:unit

      - name: Operator app — pure modules
        working-directory: operator
        run: pnpm run test:unit

      # 강의실도 같은 이유로 여기 든다 — 토큰·로고 사본 대조(#298·#392)와
      # 런타임 설정 구조 검사(#297)가 이 잡 밖에서는 아무도 돌리지 않았다.
      - name: Classroom app — pure modules
        working-directory: classroom
        run: pnpm run test:unit

  # 프론트엔드 e2e. ADR-0017 — 시임은 **실행 중인 Next 앱 하나**이므로, 모킹하지 않고
  # dev compose 로 전체 스택(db·minio·backend·frontend)을 실제로 띄운 뒤 그걸 친다.
  # dev compose 는 모든 어댑터가 fake 로 바인딩되므로 실제 PG·LLM·알림 벤더가 필요 없다.
  celery-broker:
    # #40 — celery 가 redis 트랜스포트 없이 선언돼 있어서 staging·prod 의 worker·beat
    # 가 브로커에 붙지 못하는 상태였다. 의존성만 고치고 끝내면 같은 일이 조용히
    # 되돌아온다(이 저장소는 .dockerignore 에서 「파일에 적혀 있다」를 증명으로
    # 착각해 두 번 데었다). 그래서 **실제로 붙는지**를 매번 확인한다.
    runs-on: [self-hosted, sub]

    # **이 잡만의 스택으로 가른다.** 셀프호스티드 러너에서는 잡들이 같은 호스트를
    # 나눠 쓰는데, dev compose 를 띄우는 잡이 셋이라 기본값 그대로면 셋이 같은
    # 프로젝트(`codemit-dev`)를 잡는다 — 동시에 돌면 서로의 컨테이너를 건드리고,
    # celery 잡의 `down -v` 가 남의 스택을 지운다.
    #
    # **포트 슬롯은 더 이상 여기서 정하지 않는다**(#196). `compose.ci.yaml` 이
    # 호스트 포트를 임의 포트로 두고, 아래 스텝이 `docker compose port` 로 읽어
    # `$GITHUB_ENV` 에 넣는다 — 번호를 손으로 나눠 갖는 한 러너에 남은
    # `docker-proxy` 하나가 그 번호를 물고 있으면 잡이 통째로 죽었다(실측 두 번).
    env:
      # 포트 슬롯이 없다 — 이 잡은 호스트 포트를 하나도 열지 않고(#194,
      # `compose.ci-internal-only.yaml`) e2e 도 돌리지 않는다. 프로젝트 이름만
      # 갈라 다른 잡의 컨테이너·볼륨과 섞이지 않게 한다.
      COMPOSE_PROJECT_NAME: codemit-ci-celery

    steps:
      - uses: actions/checkout@v4

      # **`up` 전에 자기 스택을 먼저 치운다.** 아래 `if: always()` 뒷정리가 있어도
      # 그것만으로는 부족하다 — 러너가 잡 도중에 재시작하거나 실행이 강제로 끊기면
      # 컨테이너와 볼륨이 남는다. 남의 컨테이너는 건드리지 않는다(이 러너는 staging
      # 배포 호스트와 같은 머신이다) — 우리 compose 프로젝트만 내린다.
      #
      # **포트 점유자를 찾아 경고하던 루프는 지웠다**(#196). 두 가지가 틀렸다:
      # 이제 고정 포트가 없어 검사할 번호가 없고, 애초에 그 검사는 **한 번도
      # 잡아내지 못했다** — `docker ps --filter publish=` 는 running 컨테이너만
      # 보는데 실제 원인은 컨테이너가 사라진 뒤 남은 `docker-proxy` 였다.
      # 실측 두 번(#190·#195 머지) 모두 경고 없이 bind 만 실패했다.
      - name: Clear anything left behind by an earlier run
        run: |
          docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml -f docker/compose.ci-internal-only.yaml down -v --remove-orphans || true

      - name: Bring up the stack with celery
        # dev 기본 기동에는 celery 가 빠져 있다(beat 의 60초 스캔이 e2e 시드를
        # 건드리면 비결정적 실패가 된다) — 이 잡만 프로필로 켠다.
        run: docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml -f docker/compose.ci-internal-only.yaml --profile celery up -d --build

      - name: The redis transport driver is actually in the image
        # 파일에 적힌 의존성이 아니라 빌드된 이미지 안을 본다.
        run: |
          docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml -f docker/compose.ci-internal-only.yaml exec -T celery-worker             python -c "import redis, kombu; print('redis', redis.__version__, 'kombu', kombu.__version__)"

      - name: The worker is actually connected to the broker
        # inspect ping 은 브로커를 통해 왕복한다 — 드라이버가 없거나 붙지 못하면
        # 여기서 끝난다.
        run: |
          for i in $(seq 1 30); do
            if docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml -f docker/compose.ci-internal-only.yaml exec -T celery-worker                  celery -A config inspect ping | grep -q pong; then
              echo "worker: pong"; exit 0
            fi
            sleep 3
          done
          echo "worker 가 브로커에 붙지 못했다"
          docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml -f docker/compose.ci-internal-only.yaml logs celery-worker | tail -50
          exit 1

      - name: Beat publishes a due task and the worker executes it
        # beat -> 브로커 -> worker 경로 전체를 한 번에 증명한다. 태스크가
        # "succeeded" 로 끝났다는 것은 내부 API 호출까지 통했다는 뜻이다
        # (토큰이 어긋나면 401 로, 등록부 밖의 스캔 이름이면 404 로 실패해
        # "succeeded" 로 끝나지 않는다).
        #
        # 찾는 태스크 이름은 core/tasks.py 에서 직접 읽는다 — 손으로 적으면
        # 이번(#163)처럼 스캔 등록부 도입으로 태스크 이름이 바뀌어도 검사는
        # 낡은 문자열을 찾은 채 조용히 상수가 된다. beat 스케줄은 등록부
        # (`core.scans.SCAN_REGISTRY`)에서 파생되고 스캔마다 이 태스크 하나를
        # 부르므로(#137), 이 이름이 succeeded 로 찍혔다는 것은 등록부의 스캔
        # 중 하나가 실제로 beat -> 브로커 -> worker 경로를 타고 돈 것이다.
        run: |
          TASK_NAME=$(docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml -f docker/compose.ci-internal-only.yaml exec -T celery-worker \
            python -c "from core.tasks import run_scan; print(run_scan.name)" | tr -d '\r\n')
          if [ -z "$TASK_NAME" ]; then
            echo "core.tasks.run_scan 의 태스크 이름을 읽지 못했다"
            exit 1
          fi
          echo "찾는 태스크: $TASK_NAME"
          for i in $(seq 1 40); do
            if docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml -f docker/compose.ci-internal-only.yaml logs celery-worker \
                 | grep -q "${TASK_NAME}.*succeeded"; then
              echo "beat -> worker 경로 확인"; exit 0
            fi
            sleep 3
          done
          echo "beat 가 쏜 태스크를 worker 가 실행하지 못했다"
          docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml -f docker/compose.ci-internal-only.yaml logs celery-beat | tail -50
          docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml -f docker/compose.ci-internal-only.yaml logs celery-worker | tail -50
          exit 1

      - name: Tear down
        if: always()
        run: docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml -f docker/compose.ci-internal-only.yaml --profile celery down -v

  # **공개 앱 e2e.** 운영자 e2e 와 나눠 **동시에** 돈다 (#104) — 한 잡이 둘을
  # 이어 돌리면 직렬로 남는 부분(공개 배타 패스 2.8분 + 운영자 6.4분)이 병렬
  # 이득을 먹는다. 나누면 그 둘이 겹친다. 각 잡은 자기에게 필요한 컨테이너만
  # 띄운다 — 운영자 잡은 공개 앱이 뜨기를 기다리지 않아도 된다.
  frontend-e2e-public:
    runs-on: [self-hosted, sub]

    # **이 잡만의 스택으로 가른다.** 셀프호스티드 러너에서는 잡들이 같은 호스트를
    # 나눠 쓰는데, dev compose 를 띄우는 잡이 셋이라 기본값 그대로면 셋이 같은
    # 프로젝트(`codemit-dev`)를 잡는다 — 동시에 돌면 서로의 컨테이너를 건드리고,
    # celery 잡의 `down -v` 가 남의 스택을 지운다.
    #
    # **포트 슬롯은 더 이상 여기서 정하지 않는다**(#196). `compose.ci.yaml` 이
    # 호스트 포트를 임의 포트로 두고, 아래 스텝이 `docker compose port` 로 읽어
    # `$GITHUB_ENV` 에 넣는다 — 번호를 손으로 나눠 갖는 한 러너에 남은
    # `docker-proxy` 하나가 그 번호를 물고 있으면 잡이 통째로 죽었다(실측 두 번).
    env:
      COMPOSE_PROJECT_NAME: codemit-ci-e2e-public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install dependencies from lockfile
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # 타입 오류는 이미지 빌드를 기다리지 않고 여기서 즉시 잡는다 — 몇 초면 끝나고,
      # 실패하면 아래의 긴 이미지 빌드를 애초에 시작하지 않는다.
      #
      # **`pnpm build` 는 여기서 돌리지 않는다.** 아래 이미지 빌드의 `runner` 스테이지가
      # 같은 `next build` 를 돌리므로 두 번 돌릴 이유가 없다 — 빌드만 잡는 오류
      # (라우트 핸들러 시그니처, standalone 산출물 등)는 거기서 잡히고, 배포 가드 잡도
      # 같은 스테이지를 따로 굽는다.
      - name: Typecheck (public app)
        working-directory: frontend
        run: pnpm typecheck

      # **`up` 전에 자기 스택을 먼저 치운다.** 아래 `if: always()` 뒷정리가 있어도
      # 그것만으로는 부족하다 — 러너가 잡 도중에 재시작하거나 실행이 강제로 끊기면
      # 컨테이너와 볼륨이 남는다. 남의 컨테이너는 건드리지 않는다(이 러너는 staging
      # 배포 호스트와 같은 머신이다) — 우리 compose 프로젝트만 내린다.
      #
      # **포트 점유자를 찾아 경고하던 루프는 지웠다**(#196). 두 가지가 틀렸다:
      # 이제 고정 포트가 없어 검사할 번호가 없고, 애초에 그 검사는 **한 번도
      # 잡아내지 못했다** — `docker ps --filter publish=` 는 running 컨테이너만
      # 보는데 실제 원인은 컨테이너가 사라진 뒤 남은 `docker-proxy` 였다.
      # 실측 두 번(#190·#195 머지) 모두 경고 없이 bind 만 실패했다.
      - name: Clear anything left behind by an earlier run
        run: |
          docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml down -v --remove-orphans || true

      # **CI 는 배포되는 산출물을 친다.** `compose.ci.yaml` 이 앱 서비스를
      # `target: runner` 로 돌린다 — 배포 compose 가 고르는 그 스테이지다. 코드가
      # 이미지에 구워지므로 저장소 마운트가 필요 없고(그 마운트는 개발용 핫리로드
      # 장치이며, 컨테이너 안에서 도는 러너에서는 빈 `/app` 을 만든다), 덤으로 CI 가
      # dev 서버가 아니라 **실제로 배포되는 물건**을 검증하게 된다.
      # **두 단계로 띄운다**(#196). `compose.ci.yaml` 이 호스트 포트를 임의 포트로
      # 두므로 번호를 잡이 읽어야 하는데, **MinIO 만은 그 번호가 기동 시점에
      # 필요하다** — `STORAGE_PUBLIC_ENDPOINT_URL` 이 `127.0.0.1:$CODEMIT_MINIO_PORT`
      # 로 backend 컨테이너에 주입되고, 업로드 e2e 에서 브라우저가 presigned URL 로
      # 그 주소에 직접 PUT 하기 때문이다. 띄운 뒤에 읽으면 늦다.
      #
      # 그래서 minio 를 먼저 띄워 번호를 읽고, 그 값으로 나머지를 띄운다. 두 번째
      # `up` 은 minio 를 다시 만들지 않는다 — 그 서비스의 설정(임의 포트)이 그대로라
      # compose 가 `Running` 으로 두고 지나간다(로컬에서 확인했다).
      - name: Bring up MinIO and learn its port
        run: |
          C="docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml"
          $C up -d minio
          # `docker compose port` 는 도커 설정에 따라 IPv4·IPv6 두 줄을 낼 수 있다
          # (`0.0.0.0:32768` 과 `[::]:32768`) — 두 줄이 그대로 env 에 들어가면 값이
          # 깨진다. 첫 줄만 쓰고 번호만 잘라낸다.
          port=$($C port minio 9000 | head -n 1 | sed 's/.*://')
          if [ -z "$port" ]; then
            echo "::error::minio 의 호스트 포트를 읽지 못했다"; $C ps; exit 1
          fi
          echo "CODEMIT_MINIO_PORT=$port" >> "$GITHUB_ENV"
          echo "MinIO -> 127.0.0.1:$port"

      - name: Build the images and bring up the stack
        run: docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml up -d --build frontend

      # 커널이 고른 번호를 읽어 뒤 스텝들에 넘긴다 — 헬스 체크의 URL,
      # `frontend/e2e/lib/seed-http.ts` 가 보는 `CODEMIT_API_PORT`, 그리고
      # Playwright 의 baseURL 이 전부 여기서 나온다.
      - name: Learn the host ports the kernel picked
        run: |
          C="docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml"
          read_port() {
            # IPv4·IPv6 두 줄이 나올 수 있다 — 첫 줄만 쓴다(위 minio 스텝과 같은 이유).
            p=$($C port "$1" "$2" | head -n 1 | sed 's/.*://')
            if [ -z "$p" ]; then
              echo "::error::$1 의 호스트 포트를 읽지 못했다"; $C ps; exit 1
            fi
            echo "$p"
          }
          api=$(read_port backend 8000)
          web=$(read_port frontend 3000)
          echo "CODEMIT_API_PORT=$api" >> "$GITHUB_ENV"
          echo "CODEMIT_E2E_BASE_URL=http://127.0.0.1:$web" >> "$GITHUB_ENV"
          echo "FRONTEND_HEALTH_URL=http://127.0.0.1:$web/healthz" >> "$GITHUB_ENV"
          echo "backend -> 127.0.0.1:$api | frontend -> 127.0.0.1:$web"

      - name: Wait for the public app to answer
        # curl 재시도 플래그에 기대지 않는다 — `--retry-all-errors` 는 curl 7.71+
        # 에만 있어서 셀프호스티드 러너에서 `option ... is unknown` 으로 **curl 이
        # 실행 자체를 거부했다**(스택은 멀쩡했는데 기다리는 쪽이 죽었다).
        run: |
          url="$FRONTEND_HEALTH_URL"
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error "$url" >/dev/null 2>&1; then
              echo "public app 응답함 ($url, ${i}회째)"; exit 0
            fi
            sleep 3
          done
          echo "::error::public app 이 180초 안에 응답하지 않았다 ($url)"
          docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml logs --tail 100 || true
          exit 1

      # **이 잡에는 uv 가 없다** (#194). 시드는 이미 떠 있는 백엔드를 HTTP 로 친다
      # (`frontend/e2e/lib/seed-http.ts`, #156) — `global-setup.ts` 의 정리 셋도
      # 전부 그 경로다. 여기 있던 「호스트의 uv 는 e2e 시드가 쓴다」 주석과 `uv sync`
      # 스텝은 #156 이전 세계를 설명하던 것이라 지웠다. `seed-operator.ts`(아직
      # 서브프로세스로 도는 시드 둘)를 임포트하는 것은 운영자 스펙뿐이다.

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      # baseURL 은 잡 레벨 env 가 준다 — 이 잡의 포트 슬롯과 같은 값이어야 하므로
      # 여기서 다시 적지 않는다(두 곳에 적으면 한쪽만 고쳤을 때 조용히 갈린다).
      - name: Run e2e against the running apps
        working-directory: frontend
        run: pnpm run test:public

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml logs --tail 100

      # playwright.config.ts 가 재시도 시 트레이스를 남긴다. 올리지 않으면 실패한
      # CI 실행에서 그게 그대로 버려져 원인을 못 본다.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      # **스택을 치우고 끝낸다.** 셀프호스티드 러너는 머신이 남으므로, 안 치우면
      # 이 잡의 컨테이너·볼륨이 실행마다 쌓이고 포트를 계속 물고 있는다. celery
      # 잡은 이미 그렇게 하고 있었는데 e2e 두 잡만 빠져 있었다 — 호스티드
      # 러너에서는 VM 이 사라져 티가 나지 않던 차이다.
      # **머신이 남는 러너에서는 잡이 자기 뒤를 치워야 한다** — 안 치우면 컨테이너와
      # 볼륨이 실행마다 쌓이고 포트를 계속 물고 있는다.
      - name: Tear down the stack
        if: always()
        run: docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml down -v --remove-orphans || true


  # **운영자 앱 e2e.** 위 잡과 동시에 돈다. 여전히 워커 하나로 돈다 —
  # 큐의 전체 건수를 단언하고 「0건」 테스트가 빈 큐를 요구하기 때문이다.
  frontend-e2e-operator:
    runs-on: [self-hosted, sub]

    # **이 잡만의 스택으로 가른다.** 셀프호스티드 러너에서는 잡들이 같은 호스트를
    # 나눠 쓰는데, dev compose 를 띄우는 잡이 셋이라 기본값 그대로면 셋이 같은
    # 프로젝트(`codemit-dev`)를 잡는다 — 동시에 돌면 서로의 컨테이너를 건드리고,
    # celery 잡의 `down -v` 가 남의 스택을 지운다.
    #
    # **포트 슬롯은 더 이상 여기서 정하지 않는다**(#196). `compose.ci.yaml` 이
    # 호스트 포트를 임의 포트로 두고, 아래 스텝이 `docker compose port` 로 읽어
    # `$GITHUB_ENV` 에 넣는다 — 번호를 손으로 나눠 갖는 한 러너에 남은
    # `docker-proxy` 하나가 그 번호를 물고 있으면 잡이 통째로 죽었다(실측 두 번).
    env:
      COMPOSE_PROJECT_NAME: codemit-ci-e2e-operator

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install dependencies from lockfile
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # 타입 오류는 이미지 빌드를 기다리지 않고 여기서 즉시 잡는다 — 몇 초면 끝나고,
      # 실패하면 아래의 긴 이미지 빌드를 애초에 시작하지 않는다.
      #
      # **`pnpm build` 는 여기서 돌리지 않는다.** 아래 이미지 빌드의 `runner` 스테이지가
      # 같은 `next build` 를 돌리므로 두 번 돌릴 이유가 없다 — 빌드만 잡는 오류
      # (라우트 핸들러 시그니처, standalone 산출물 등)는 거기서 잡히고, 배포 가드 잡도
      # 같은 스테이지를 따로 굽는다.
      - name: Typecheck (operator app)
        working-directory: operator
        run: pnpm typecheck

      # **`up` 전에 자기 스택을 먼저 치운다.** 아래 `if: always()` 뒷정리가 있어도
      # 그것만으로는 부족하다 — 러너가 잡 도중에 재시작하거나 실행이 강제로 끊기면
      # 컨테이너와 볼륨이 남는다. 남의 컨테이너는 건드리지 않는다(이 러너는 staging
      # 배포 호스트와 같은 머신이다) — 우리 compose 프로젝트만 내린다.
      #
      # **포트 점유자를 찾아 경고하던 루프는 지웠다**(#196). 두 가지가 틀렸다:
      # 이제 고정 포트가 없어 검사할 번호가 없고, 애초에 그 검사는 **한 번도
      # 잡아내지 못했다** — `docker ps --filter publish=` 는 running 컨테이너만
      # 보는데 실제 원인은 컨테이너가 사라진 뒤 남은 `docker-proxy` 였다.
      # 실측 두 번(#190·#195 머지) 모두 경고 없이 bind 만 실패했다.
      - name: Clear anything left behind by an earlier run
        run: |
          docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml down -v --remove-orphans || true

      # **CI 는 배포되는 산출물을 친다.** `compose.ci.yaml` 이 앱 서비스를
      # `target: runner` 로 돌린다 — 배포 compose 가 고르는 그 스테이지다. 코드가
      # 이미지에 구워지므로 저장소 마운트가 필요 없고(그 마운트는 개발용 핫리로드
      # 장치이며, 컨테이너 안에서 도는 러너에서는 빈 `/app` 을 만든다), 덤으로 CI 가
      # dev 서버가 아니라 **실제로 배포되는 물건**을 검증하게 된다.
      # **두 단계로 띄운다**(#196). `compose.ci.yaml` 이 호스트 포트를 임의 포트로
      # 두므로 번호를 잡이 읽어야 하는데, **MinIO 만은 그 번호가 기동 시점에
      # 필요하다** — `STORAGE_PUBLIC_ENDPOINT_URL` 이 `127.0.0.1:$CODEMIT_MINIO_PORT`
      # 로 backend 컨테이너에 주입되고, 업로드 e2e 에서 브라우저가 presigned URL 로
      # 그 주소에 직접 PUT 하기 때문이다. 띄운 뒤에 읽으면 늦다.
      #
      # 그래서 minio 를 먼저 띄워 번호를 읽고, 그 값으로 나머지를 띄운다. 두 번째
      # `up` 은 minio 를 다시 만들지 않는다 — 그 서비스의 설정(임의 포트)이 그대로라
      # compose 가 `Running` 으로 두고 지나간다(로컬에서 확인했다).
      - name: Bring up MinIO and learn its port
        run: |
          C="docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml"
          $C up -d minio
          # `docker compose port` 는 도커 설정에 따라 IPv4·IPv6 두 줄을 낼 수 있다
          # (`0.0.0.0:32768` 과 `[::]:32768`) — 두 줄이 그대로 env 에 들어가면 값이
          # 깨진다. 첫 줄만 쓰고 번호만 잘라낸다.
          port=$($C port minio 9000 | head -n 1 | sed 's/.*://')
          if [ -z "$port" ]; then
            echo "::error::minio 의 호스트 포트를 읽지 못했다"; $C ps; exit 1
          fi
          echo "CODEMIT_MINIO_PORT=$port" >> "$GITHUB_ENV"
          echo "MinIO -> 127.0.0.1:$port"

      - name: Build the images and bring up the stack
        run: docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml up -d --build operator

      # 커널이 고른 번호를 읽어 뒤 스텝들에 넘긴다 — 헬스 체크의 URL,
      # `frontend/e2e/lib/seed-http.ts` 가 보는 `CODEMIT_API_PORT`, 그리고
      # Playwright 의 baseURL 이 전부 여기서 나온다.
      - name: Learn the host ports the kernel picked
        run: |
          C="docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml"
          read_port() {
            # IPv4·IPv6 두 줄이 나올 수 있다 — 첫 줄만 쓴다(위 minio 스텝과 같은 이유).
            p=$($C port "$1" "$2" | head -n 1 | sed 's/.*://')
            if [ -z "$p" ]; then
              echo "::error::$1 의 호스트 포트를 읽지 못했다"; $C ps; exit 1
            fi
            echo "$p"
          }
          api=$(read_port backend 8000)
          web=$(read_port operator 3000)
          echo "CODEMIT_API_PORT=$api" >> "$GITHUB_ENV"
          echo "CODEMIT_OPERATOR_E2E_BASE_URL=http://127.0.0.1:$web" >> "$GITHUB_ENV"
          echo "OPERATOR_HEALTH_URL=http://127.0.0.1:$web/healthz" >> "$GITHUB_ENV"
          echo "backend -> 127.0.0.1:$api | operator -> 127.0.0.1:$web"

      - name: Wait for the operator app to answer
        # curl 재시도 플래그에 기대지 않는다 — `--retry-all-errors` 는 curl 7.71+
        # 에만 있어서 셀프호스티드 러너에서 `option ... is unknown` 으로 **curl 이
        # 실행 자체를 거부했다**(스택은 멀쩡했는데 기다리는 쪽이 죽었다).
        run: |
          url="$OPERATOR_HEALTH_URL"
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error "$url" >/dev/null 2>&1; then
              echo "operator app 응답함 ($url, ${i}회째)"; exit 0
            fi
            sleep 3
          done
          echo "::error::operator app 이 180초 안에 응답하지 않았다 ($url)"
          docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml logs --tail 100 || true
          exit 1

      # **이 잡에도 uv 가 없다** (#194). 마지막까지 남아 있던 서브프로세스 시드 둘이
      # HTTP 로 옮겨졌다 — 그 둘이 소스를 `FakeStorageAdapter` 에 직접 쓴 뒤 같은
      # 프로세스에서 채점을 돌려 `STORAGE_BACKEND=fake` 인 호스트를 요구했는데,
      # `write_object` 가 어댑터 계약에 들어가면서 컨테이너 안의 MinIO 로도 성립하게
      # 됐다. 그 결합 하나가 이 잡의 파이썬 툴체인과 DB 포트 노출을 함께 붙들고 있었다.

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      # baseURL 은 잡 레벨 env 가 준다 — 이 잡의 포트 슬롯과 같은 값이어야 하므로
      # 여기서 다시 적지 않는다(두 곳에 적으면 한쪽만 고쳤을 때 조용히 갈린다).
      - name: Run e2e against the running apps
        working-directory: frontend
        run: pnpm run test:operator

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml logs --tail 100

      # playwright.config.ts 가 재시도 시 트레이스를 남긴다. 올리지 않으면 실패한
      # CI 실행에서 그게 그대로 버려져 원인을 못 본다.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      # **스택을 치우고 끝낸다.** 셀프호스티드 러너는 머신이 남으므로, 안 치우면
      # 이 잡의 컨테이너·볼륨이 실행마다 쌓이고 포트를 계속 물고 있는다. celery
      # 잡은 이미 그렇게 하고 있었는데 e2e 두 잡만 빠져 있었다 — 호스티드
      # 러너에서는 VM 이 사라져 티가 나지 않던 차이다.
      # **머신이 남는 러너에서는 잡이 자기 뒤를 치워야 한다** — 안 치우면 컨테이너와
      # 볼륨이 실행마다 쌓이고 포트를 계속 물고 있는다.
      - name: Tear down the stack
        if: always()
        run: docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml down -v --remove-orphans || true

  frontend-e2e-classroom:
    runs-on: [self-hosted, sub]

    # frontend-e2e-operator와 같은 이유로 이 잡만의 스택·포트 슬롯을 가른다(#196).
    env:
      COMPOSE_PROJECT_NAME: codemit-ci-e2e-classroom

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install dependencies from lockfile
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck (classroom app)
        working-directory: classroom
        run: pnpm typecheck

      - name: Clear anything left behind by an earlier run
        run: |
          docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml down -v --remove-orphans || true

      - name: Bring up MinIO and learn its port
        run: |
          C="docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml"
          $C up -d minio
          port=$($C port minio 9000 | head -n 1 | sed 's/.*://')
          if [ -z "$port" ]; then
            echo "::error::minio 의 호스트 포트를 읽지 못했다"; $C ps; exit 1
          fi
          echo "CODEMIT_MINIO_PORT=$port" >> "$GITHUB_ENV"
          echo "MinIO -> 127.0.0.1:$port"

      # 공개 앱(frontend)도 띄운다. 강의실은 자기 로그인이 없어(ADR-0038) 인증 구역을
      # 걷는 스펙이 공개 앱의 로그인 BFF 로 세션을 세운 뒤 그 쿠키를 강의실 오리진에
      # 심는다(`frontend/e2e/classroom/lib/cross-app-session.ts`). 강의실만 띄우면 그
      # 헬퍼가 `ECONNREFUSED 127.0.0.1:53000` 으로 죽는다 — #318 이 그 스펙을 더한 뒤
      # 이 잡이 main 에서 여섯 번 연속 그렇게 빨갛게 났다(b249af7~3cd881d).
      #
      # **이벤트 서비스(`events`)도 함께 띄운다**(#379, ADR-0046) — 강의실 BFF가
      # 실시간 신호 SSE 경로만 이 서비스로 보낸다(`CODEMIT_EVENTS_BASE_URL`,
      # `classroom` 서비스가 이미 `depends_on`으로 걸어 뒀지만 이미지가 최신인지도
      # 확인하려고 명시적으로 적는다).
      - name: Build the images and bring up the stack
        run: docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml up -d --build frontend classroom events

      - name: Learn the host ports the kernel picked
        run: |
          C="docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml"
          read_port() {
            p=$($C port "$1" "$2" | head -n 1 | sed 's/.*://')
            if [ -z "$p" ]; then
              echo "::error::$1 의 호스트 포트를 읽지 못했다"; $C ps; exit 1
            fi
            echo "$p"
          }
          api=$(read_port backend 8000)
          pub=$(read_port frontend 3000)
          web=$(read_port classroom 3000)
          echo "CODEMIT_API_PORT=$api" >> "$GITHUB_ENV"
          echo "CODEMIT_E2E_BASE_URL=http://127.0.0.1:$pub" >> "$GITHUB_ENV"
          echo "FRONTEND_HEALTH_URL=http://127.0.0.1:$pub/healthz" >> "$GITHUB_ENV"
          echo "CODEMIT_CLASSROOM_E2E_BASE_URL=http://127.0.0.1:$web" >> "$GITHUB_ENV"
          echo "CLASSROOM_HEALTH_URL=http://127.0.0.1:$web/healthz" >> "$GITHUB_ENV"
          echo "backend -> 127.0.0.1:$api | frontend -> 127.0.0.1:$pub | classroom -> 127.0.0.1:$web"

      - name: Wait for the public and classroom apps to answer
        run: |
          for url in "$FRONTEND_HEALTH_URL" "$CLASSROOM_HEALTH_URL"; do
            ok=
            for i in $(seq 1 60); do
              if curl --fail --silent --show-error "$url" >/dev/null 2>&1; then
                echo "응답함 ($url, ${i}회째)"; ok=1; break
              fi
              sleep 3
            done
            if [ -z "$ok" ]; then
              echo "::error::$url 이 180초 안에 응답하지 않았다"
              docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml logs --tail 100 || true
              exit 1
            fi
          done

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e against the running apps
        working-directory: frontend
        run: pnpm run test:classroom

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml logs --tail 100

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-classroom
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Tear down the stack
        if: always()
        run: docker compose -f docker/compose.dev.yaml -f docker/compose.ci.yaml down -v --remove-orphans || true

  # 프론트 배포 부팅 가드 (FE-13, #38).
  #
  # ADR-0017은 이 프로젝트의 프론트 테스트 시임을 "실행 중인 Next 앱 하나"로
  # 못박는다. 이 잡이 증명해야 하는 대상은 정반대다 — **앱이 뜨지 않는 것**이
  # 관찰 대상이라, 실행 중인 앱을 치는 시임으로는 원천적으로 닿지 않는다.
  # backend/tests/test_deployment_config.py가 같은 이유로 override_settings를
  # 못 쓰고 subprocess로 `manage.py check`를 직접 실행하는 것과 동일한 예외
  # 사유다. 그래서 여기서는 frontend.Dockerfile의 runner 스테이지(staging/prod가
  # 실제로 배포하는 그 이미지)를 직접 빌드해 컨테이너로 띄우고, 프로세스
  # 종료 코드와 로그를 확인한다.
  #
  # 이 형태를 고른 또 다른 이유: 처음에는 instrumentation.ts의 register()가
  # 단순히 `throw`만 하면 될 줄 알았는데, standalone 산출물(`node server.js`)로
  # 실제 재현해보니 Next가 그 에러를 "unhandledRejection"으로 로그만 찍고
  # 삼켜 HTTP 서버가 계속 듣고 있었다 — 컨테이너는 Up 상태로 남고 모든 요청에
  # 이유 없는 500만 내려줬다. "시끄럽게 실패한다"는 인수조건을 문자 그대로
  # 어기는 조용한 실패였다. 실행 중인 프로세스를 직접 관찰하지 않았다면 이
  # 회귀를 놓쳤을 것이다 — instrumentation.ts가 이제 `process.exit(1)`로
  # 직접 끊는 이유이자, 이 잡이 "빌드가 성공했다"가 아니라 "컨테이너가 실제로
  # 죽는다"를 확인하는 이유다.
  frontend-deploy-guard:
    runs-on: [self-hosted, sub]

    steps:
      - uses: actions/checkout@v4

      - name: Build the production frontend image (runner stage)
        run: |
          # 문의 주소는 빌드 인자로 굳는다(#472 후속) — 여기서 CI 전용 값을 주고,
          # 아래에서 그 값이 구운 /privacy 에 실제로 실렸는지 본다. 빌드 인자 →
          # 번들 → 화면까지가 한 번에 끊기는 자리라(#297 과 같은 종류) 구운
          # 이미지에서만 드러난다.
          docker build -f docker/frontend.Dockerfile --target runner \
            --build-arg NEXT_PUBLIC_SUPPORT_EMAIL=ci-guard@example.test \
            -t codemit-frontend-runner-ci .

      # 이 레포가 이미 두 번 겪은 사고(CLAUDE.md 「이미 데인 곳」) — .dockerignore
      # 패턴이 파일에 적혀 있다는 것만으로는 증명이 아니다. 가짜 시크릿과 가짜
      # 호스트 node_modules를 실제로 심어서 이미지에 안 들어가는지 직접
      # 확인한다.
      #
      # **경로를 build context 기준으로 정확히 맞춘다**(#70 코드리뷰 지적,
      # 심각). 이 스텝은 저장소 루트에서 `docker build ... .`을 돌리므로
      # frontend.Dockerfile의 `COPY frontend/ ./frontend/`가 시크릿을
      # `/app/frontend/.env`에 놓는다 — `/app/.env`는 애초에 존재할 수 없는
      # 경로라 그 단정은 항상 거짓으로 통과했다(뒤의 재귀 grep만 실질
      # 커버리지였다). node_modules 검증도 이름만 약속하고 실제로는 아무
      # node_modules도 없어(이 잡은 pnpm install을 돌리지 않는다) 아무것도
      # 검증하지 않았다 — 마커 파일을 직접 만들어 넣는다.
      - name: .dockerignore actually keeps secrets and host node_modules out of the image
        run: |
          set -euo pipefail
          echo "OPENAI_API_KEY=sk-ci-guard-fake-secret-do-not-leak" > frontend/.env
          mkdir -p frontend/node_modules/.ci-guard-marker
          echo "host-node-modules-should-not-leak-into-image" > frontend/node_modules/.ci-guard-marker/marker.txt
          docker build -f docker/frontend.Dockerfile --target builder -t codemit-frontend-builder-ci-guard .
          docker run --rm --entrypoint sh codemit-frontend-builder-ci-guard -c '
            set -e
            if [ -f /app/frontend/.env ]; then
              echo "FOUND /app/frontend/.env — .dockerignore가 시크릿을 막지 못했다" >&2
              exit 1
            fi
            if [ -d /app/frontend/node_modules/.ci-guard-marker ]; then
              echo "FOUND /app/frontend/node_modules/.ci-guard-marker — .dockerignore가 호스트 node_modules를 막지 못했다" >&2
              exit 1
            fi
            if grep -rl "sk-ci-guard-fake-secret\|host-node-modules-should-not-leak-into-image" /app > /dev/null 2>&1; then
              echo "가짜 시크릿 또는 host node_modules 마커가 이미지 어딘가에 들어갔다" >&2
              exit 1
            fi
            echo "confirmed: .env and host node_modules excluded from the image"
          '
          rm -f frontend/.env
          rm -rf frontend/node_modules/.ci-guard-marker
          docker rmi codemit-frontend-builder-ci-guard

      - name: Refuses to boot in production with missing config (and actually exits — not just logs)
        run: |
          set +e
          output=$(timeout 60 docker run --rm -e CODEMIT_DEPLOYMENT_TARGET=production codemit-frontend-runner-ci 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
            echo "::error::CODEMIT_WEB_ORIGIN/CODEMIT_API_BASE_URL 없이도 컨테이너가 죽지 않았다(status=$status) — 부팅 가드가 깨졌다"
            exit 1
          fi
          echo "$output" | grep -q "CODEMIT_WEB_ORIGIN" || { echo "::error::에러 메시지에 원인(CODEMIT_WEB_ORIGIN)이 안 남는다"; exit 1; }
          echo "$output" | grep -q "CODEMIT_API_BASE_URL" || { echo "::error::에러 메시지에 원인(CODEMIT_API_BASE_URL)이 안 남는다"; exit 1; }

      - name: Refuses to boot in staging with only one required value missing
        run: |
          set +e
          output=$(timeout 60 docker run --rm \
            -e CODEMIT_DEPLOYMENT_TARGET=staging \
            -e CODEMIT_WEB_ORIGIN=https://staging.codemit.example \
            codemit-frontend-runner-ci 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
            echo "::error::CODEMIT_API_BASE_URL 없이도 staging 컨테이너가 죽지 않았다(status=$status)"
            exit 1
          fi
          echo "$output" | grep -q "CODEMIT_API_BASE_URL" || { echo "::error::에러 메시지에 원인이 안 남는다"; exit 1; }

      # #95/#96 — 카카오 OAuth 앱 자격증명도 같은 부팅 가드 대상이다
      # (instrumentation.ts REQUIRED_IN_DEPLOYED_ENVIRONMENTS). CODEMIT_WEB_ORIGIN/
      # CODEMIT_API_BASE_URL은 채우고 카카오 자격증명만 비워 — 이 값들만으로도
      # 독립적으로 부팅이 거부되는지 확인한다.
      - name: Refuses to boot in production without kakao oauth credentials
        run: |
          set +e
          output=$(timeout 60 docker run --rm \
            -e CODEMIT_DEPLOYMENT_TARGET=production \
            -e CODEMIT_WEB_ORIGIN=https://codemit.example \
            -e CODEMIT_API_BASE_URL=http://127.0.0.1:1 \
            codemit-frontend-runner-ci 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
            echo "::error::카카오 자격증명 없이도 컨테이너가 죽지 않았다(status=$status) — 부팅 가드가 깨졌다"
            exit 1
          fi
          echo "$output" | grep -q "KAKAO_REST_API_KEY" || { echo "::error::에러 메시지에 원인(KAKAO_REST_API_KEY)이 안 남는다"; exit 1; }
          echo "$output" | grep -q "KAKAO_SECRET_KEY" || { echo "::error::에러 메시지에 원인(KAKAO_SECRET_KEY)이 안 남는다"; exit 1; }
          echo "$output" | grep -q "KAKAO_REDIRECT_URI" || { echo "::error::에러 메시지에 원인(KAKAO_REDIRECT_URI)이 안 남는다"; exit 1; }

      # #115 — 토스 결제창 클라이언트 키(NEXT_PUBLIC_TOSS_CLIENT_KEY)가 빌드타임에
      # 비어 있으면 배포 환경에서 부팅 자체를 거부하는지 확인한다. 다른 필수값은
      # 전부 채워 이 값 하나만으로 독립적으로 죽는지를 본다. codemit-frontend-runner-ci
      # 는 build.args 없이(빈 문자열로) 지었으므로 이 시나리오 그대로다.
      - name: Refuses to boot in production without a toss client key baked in
        run: |
          set +e
          output=$(timeout 60 docker run --rm \
            -e CODEMIT_DEPLOYMENT_TARGET=production \
            -e CODEMIT_WEB_ORIGIN=https://codemit.example \
            -e CODEMIT_API_BASE_URL=http://127.0.0.1:1 \
            -e KAKAO_REST_API_KEY=ci-guard-only-kakao-rest-api-key \
            -e KAKAO_SECRET_KEY=ci-guard-only-kakao-secret-key \
            -e KAKAO_REDIRECT_URI=https://codemit.example/api/auth/social/kakao/callback \
            codemit-frontend-runner-ci 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
            echo "::error::토스 클라이언트 키 없이도 컨테이너가 죽지 않았다(status=$status) — 부팅 가드가 깨졌다"
            exit 1
          fi
          echo "$output" | grep -q "NEXT_PUBLIC_TOSS_CLIENT_KEY" || { echo "::error::에러 메시지에 원인(NEXT_PUBLIC_TOSS_CLIENT_KEY)이 안 남는다"; exit 1; }

      # #115 코드리뷰 지적 -- 이 값을 검증하겠다고 프로덕션 이미지를 두 번(빌드
      # 인자 있이/없이) 굽지 않는다. pnpm build 가 다시 도는 두 번째 빌드는
      # CI 시간을 그대로 배로 늘리는데, 이 부팅 가드가 실제로 읽는 것은 컨테이너의
      # 런타임 env이지 브라우저 번들에 인라인된 값이 아니다(위에서 직접 측정해
      # 확인한 사실 -- instrumentation.ts는 Next의 컴파일 그래프 밖에서 돈다).
      # 그러니 KAKAO_*와 같은 방식으로 같은 이미지에 -e만 다르게 줘서 런타임
      # env가 있을 때/없을 때 두 경우를 구분하면 충분하다 -- 이 스텝이 검증하는
      # 건 부팅 가드가 이 이름의 env를 보고 옳게 판단하는가이지, 이 특정 빌드가
      # 브라우저 번들에 값을 구웠는가가 아니다(후자는 docker/frontend.Dockerfile의
      # ARG/ENV 선언이 전담하고, 이미 로컬에서 직접 --build-arg로 지어 확인했다
      # -- 구조가 단순해 회귀 위험이 낮다).
      # **머신이 남는다 — 잡이 자기 뒤를 치워야 한다.** 호스티드 러너는 VM 이
      # 통째로 사라져 잔여물이 없지만, 셀프호스티드는 아니다. 앞선 실행이 이
      # 스텝에서 실패해 컨테이너를 남기자 다음 실행이 `Conflict. The container
      # name "/frontend-boot-ok" is already in use` 로 죽었다 — 원인은 이번 커밋이 아닌데
      # 이번 실행이 빨갛게 나는, 진단이 가장 헷갈리는 모양이다.
      # 시작 전에 지우고(멱등), 끝나면 성공·실패 무관하게 지운다.
      - name: Boots with a complete production config and forces Secure cookies
        run: |
          set -euo pipefail
          docker rm -f frontend-boot-ok >/dev/null 2>&1 || true
          docker run -d --name frontend-boot-ok \
            -e CODEMIT_DEPLOYMENT_TARGET=production \
            -e CODEMIT_WEB_ORIGIN=https://codemit.example \
            -e CODEMIT_API_BASE_URL=http://127.0.0.1:1 \
            -e CODEMIT_SESSION_COOKIE_DOMAIN=.codemit.example \
            -e KAKAO_REST_API_KEY=ci-guard-only-kakao-rest-api-key \
            -e KAKAO_SECRET_KEY=ci-guard-only-kakao-secret-key \
            -e KAKAO_REDIRECT_URI=https://codemit.example/api/auth/social/kakao/callback \
            -e NEXT_PUBLIC_TOSS_CLIENT_KEY=ci-guard-only-toss-client-key \
            -p 3100:3000 \
            codemit-frontend-runner-ci

          # 백엔드가 없어 /healthz 는 503(degraded)이 정상이다 — 여기서 보는 건
          # "완전한 설정에서는 프론트가 죽지 않고 응답한다"는 것뿐이다. 연결
          # 자체가 안 되면(000) 컨테이너가 여전히 안 뜬 것이다.
          #
          # **`|| true` 가 없으면 재시도 루프가 한 번도 돌지 않는다.** `set -e`
          # 아래에서 `status=$(curl ...)` 는 대입문의 종료 코드가 curl 의 것이라,
          # 첫 시도가 실패하는 순간 셸이 그 자리에서 죽는다 — 컨테이너가 정상
          # 부팅 중이어도 빨간불이 되고, 스텝은 curl 자신의 종료 코드(연결 실패 7,
          # 수신 실패 56)로 끝난다. 실제로 그렇게 15회 연속 실패했다. 아래 주석이
          # 경계하는 "000000" 문제는 `|| echo "000"` 이 출력을 하나 더 얹기 때문에
          # 생기는 것이라, 출력을 얹지 않는 `|| true` 에는 없다.
          #
          # **`|| echo "000"`을 쓰지 않는다**(#70 코드리뷰 지적, 심각). curl은
          # `-w`가 있으면 연결 실패 시에도 스스로 "000"을 쓰고 비정상 종료
          # 코드로 끝낸다 — 그 위에 `|| echo "000"`을 얹으면 실패할 때마다
          # "000"이 두 번(curl 자신 + echo) 이어져 "000000"이 되고, 그 값은
          # 아래 `[ "$status" = "000" ]` 비교와 절대 같아지지 않아 **재시도
          # 루프가 첫 시도에 곧장 break한다** — 컨테이너가 정상 부팅 중이어도
          # 빨간불이 되고, "완전한 설정에서는 죽지 않는다"는 이 스텝의 관측
          # 자체가 수행되지 않는다. curl 자신의 "000" 출력만 남기고, 그래도
          # 정말 비어 있는 극단적인 경우를 위한 방어로 `${status:-000}`만 쓴다.
          status="000"
          for _ in $(seq 1 20); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3100/healthz 2>/dev/null || true)
            status="${status:-000}"
            [ "$status" = "000" ] || break
            sleep 1
          done
          echo "healthz status: $status"
          if [ "$status" != "200" ] && [ "$status" != "503" ]; then
            echo "::error::완전한 프로덕션 설정인데도 컨테이너가 응답하지 않는다(status=$status)"
            docker logs frontend-boot-ok
            exit 1
          fi

          # ADR-0016 성립 조건 — production에서 쿠키의 Secure가 실제로 켜지는지.
          # frontend/app/api/auth/logout/route.ts는 access 쿠키가 없으면 백엔드를
          # 부르지 않고 곧바로 clearSessionCookies를 실어 응답한다 — 그래서 백엔드
          # 없이도 이 경로 하나로 쿠키 속성을 직접 관찰할 수 있다.
          set_cookie=$(curl -s -D - -o /dev/null -X POST http://127.0.0.1:3100/api/auth/logout \
            -H "Origin: https://codemit.example")
          echo "$set_cookie"
          echo "$set_cookie" | grep -qi "codemit_access=.*Secure" \
            || { echo "::error::production인데 codemit_access 쿠키에 Secure가 없다"; exit 1; }
          echo "$set_cookie" | grep -qi "codemit_refresh=.*Secure" \
            || { echo "::error::production인데 codemit_refresh 쿠키에 Secure가 없다"; exit 1; }

          # **public/ 의 정적 자산이 실제로 서빙되는가**(2026-09-16). standalone
          # 산출물에는 public/ 이 들어가지 않으므로 Dockerfile 이 따로 옮겨야
          # 한다 — 그 줄이 없으면 배포에서만 404 가 되고, dev(소스를 그대로
          # 서빙)나 위 healthz 확인에는 전혀 보이지 않는다. 실제로 카카오 로그인
          # 버튼 이미지가 prod 에서 그렇게 깨졌다. 이미지 최적화 경로(next/image
          # 가 실제로 쓰는 주소)까지 함께 본다.
          asset=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3100/kakao/kakao_login_large_wide.png 2>/dev/null || true)
          optimized=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3100/_next/image?url=%2Fkakao%2Fkakao_login_large_wide.png&w=640&q=75" 2>/dev/null || true)
          echo "public asset: ${asset:-000} / optimized: ${optimized:-000}"
          if [ "${asset:-000}" != "200" ] || [ "${optimized:-000}" != "200" ]; then
            echo "::error::public/ 의 정적 자산이 프로덕션 이미지에서 서빙되지 않는다(원본=${asset:-000}, 최적화=${optimized:-000}) — Dockerfile 의 public 복사를 확인한다"
            docker logs frontend-boot-ok
            exit 1
          fi

      # **방침의 문의처가 구운 이미지에 실렸는가**(#472 후속). 개인정보 보호책임자와
      # 문의처는 방침의 필수 기재사항인데(개인정보 보호법 제30조 제1항) 그 값은
      # 빌드 인자로 굳으므로, 인자를 빠뜨린 이미지는 **주소 없이 조용히** 배포된다
      # — dev 도 위 healthz 확인도 이것을 못 본다. 위 빌드 단계가 준 CI 전용 값이
      # 그대로 나오는지 본다(파이프로 찾지 않는 이유는 classroom-deploy-guard 의
      # 같은 자리 주석 참고 — grep -q 의 조기 종료가 pipefail 과 만나면 찾고도
      # 실패로 읽힌다).
      - name: The privacy policy carries a contact address baked at build time
        run: |
          set -euo pipefail
          html=$(curl -sS --max-time 10 http://127.0.0.1:3100/privacy)
          [[ "$html" == *"ci-guard@example.test"* ]] || {
            echo "::error::구운 /privacy 에 문의 주소가 없다 — NEXT_PUBLIC_SUPPORT_EMAIL 빌드 인자가 빠졌는가?"
            printf '%s' "$html" | head -c 2000
            exit 1
          }
          echo "방침이 빌드 인자의 문의 주소를 싣는다"


      - name: Tear down the boot-guard container
        if: always()
        run: docker rm -f frontend-boot-ok >/dev/null 2>&1 || true

      - name: Dump container state on failure
        if: failure()
        run: docker ps -a

  # 운영자 앱 배포 부팅 가드 (#70 — #63가 미룬 것을 여기서 켠다).
  #
  # frontend-deploy-guard와 정확히 같은 이유·같은 형태다: ADR-0021의 프론트 테스트
  # 시임("실행 중인 앱 하나")으로는 "앱이 뜨지 않는 것" 자체를 증명할 수 없다.
  # operator.Dockerfile의 runner 스테이지(staging/prod가 실제로 배포하는 그
  # 이미지)를 직접 빌드해 컨테이너로 띄우고, 프로세스 종료 코드와 로그를 확인한다.
  #
  # operator/instrumentation.ts도 frontend와 같은 함정을 피해 process.exit(1)로
  # 직접 프로세스를 끊는다(#38에서 이미 확인된 "Next가 throw를 삼킨다"는 사실이
  # 이 앱에도 그대로 적용된다) — 이 잡은 그게 실제로 그런지 직접 관찰한다.
  operator-deploy-guard:
    runs-on: [self-hosted, sub]

    steps:
      - uses: actions/checkout@v4

      - name: Build the production operator image (runner stage)
        run: docker build -f docker/operator.Dockerfile --target runner -t codemit-operator-runner-ci .

      # frontend-deploy-guard와 같은 이유 — .dockerignore가 시크릿과 호스트
      # node_modules를 실제로 막는지 이 앱에서도 직접 확인한다.
      #
      # **경로를 build context 기준으로 정확히 맞춘다**(#70 코드리뷰 지적,
      # 심각). 이 스텝은 저장소 루트에서 `docker build ... .`을 돌리므로
      # operator.Dockerfile의 `COPY operator/ ./operator/`가 시크릿을
      # `/app/operator/.env`에 놓는다 — `/app/.env`는 애초에 존재할 수 없는
      # 경로라 그 단정은 항상 거짓으로 통과했다. node_modules 검증도 이름만
      # 약속하고 실제로는 아무 node_modules도 없어(이 잡은 pnpm install을
      # 돌리지 않는다) 아무것도 검증하지 않았다 — 마커 파일을 직접 만들어
      # 넣는다.
      - name: .dockerignore actually keeps secrets and host node_modules out of the image
        run: |
          set -euo pipefail
          echo "OPENAI_API_KEY=sk-ci-guard-fake-secret-do-not-leak" > operator/.env
          mkdir -p operator/node_modules/.ci-guard-marker
          echo "host-node-modules-should-not-leak-into-image" > operator/node_modules/.ci-guard-marker/marker.txt
          docker build -f docker/operator.Dockerfile --target builder -t codemit-operator-builder-ci-guard .
          docker run --rm --entrypoint sh codemit-operator-builder-ci-guard -c '
            set -e
            if [ -f /app/operator/.env ]; then
              echo "FOUND /app/operator/.env — .dockerignore가 시크릿을 막지 못했다" >&2
              exit 1
            fi
            if [ -d /app/operator/node_modules/.ci-guard-marker ]; then
              echo "FOUND /app/operator/node_modules/.ci-guard-marker — .dockerignore가 호스트 node_modules를 막지 못했다" >&2
              exit 1
            fi
            if grep -rl "sk-ci-guard-fake-secret\|host-node-modules-should-not-leak-into-image" /app > /dev/null 2>&1; then
              echo "가짜 시크릿 또는 host node_modules 마커가 이미지 어딘가에 들어갔다" >&2
              exit 1
            fi
            echo "confirmed: .env and host node_modules excluded from the image"
          '
          rm -f operator/.env
          rm -rf operator/node_modules/.ci-guard-marker
          docker rmi codemit-operator-builder-ci-guard

      - name: Refuses to boot in production with missing config (and actually exits — not just logs)
        run: |
          set +e
          output=$(timeout 60 docker run --rm -e CODEMIT_DEPLOYMENT_TARGET=production codemit-operator-runner-ci 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
            echo "::error::CODEMIT_OPERATOR_ORIGIN/CODEMIT_API_BASE_URL 없이도 컨테이너가 죽지 않았다(status=$status) — 부팅 가드가 깨졌다"
            exit 1
          fi
          echo "$output" | grep -q "CODEMIT_OPERATOR_ORIGIN" || { echo "::error::에러 메시지에 원인(CODEMIT_OPERATOR_ORIGIN)이 안 남는다"; exit 1; }
          echo "$output" | grep -q "CODEMIT_API_BASE_URL" || { echo "::error::에러 메시지에 원인(CODEMIT_API_BASE_URL)이 안 남는다"; exit 1; }

      - name: Refuses to boot in staging with only one required value missing
        run: |
          set +e
          output=$(timeout 60 docker run --rm \
            -e CODEMIT_DEPLOYMENT_TARGET=staging \
            -e CODEMIT_OPERATOR_ORIGIN=https://operator.staging.codemit.example \
            codemit-operator-runner-ci 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
            echo "::error::CODEMIT_API_BASE_URL 없이도 staging 컨테이너가 죽지 않았다(status=$status)"
            exit 1
          fi
          echo "$output" | grep -q "CODEMIT_API_BASE_URL" || { echo "::error::에러 메시지에 원인이 안 남는다"; exit 1; }

      # **머신이 남는다 — 잡이 자기 뒤를 치워야 한다.** 호스티드 러너는 VM 이
      # 통째로 사라져 잔여물이 없지만, 셀프호스티드는 아니다. 앞선 실행이 이
      # 스텝에서 실패해 컨테이너를 남기자 다음 실행이 `Conflict. The container
      # name "/operator-boot-ok" is already in use` 로 죽었다 — 원인은 이번 커밋이 아닌데
      # 이번 실행이 빨갛게 나는, 진단이 가장 헷갈리는 모양이다.
      # 시작 전에 지우고(멱등), 끝나면 성공·실패 무관하게 지운다.
      - name: Boots with a complete production config and forces Secure cookies
        run: |
          set -euo pipefail
          docker rm -f operator-boot-ok >/dev/null 2>&1 || true
          docker run -d --name operator-boot-ok \
            -e CODEMIT_DEPLOYMENT_TARGET=production \
            -e CODEMIT_OPERATOR_ORIGIN=https://operator.codemit.example \
            -e CODEMIT_API_BASE_URL=http://127.0.0.1:1 \
            -p 3101:3000 \
            codemit-operator-runner-ci

          # 백엔드가 없어 /healthz 는 503(degraded)이 정상이다 — 여기서 보는 건
          # "완전한 설정에서는 운영자 앱이 죽지 않고 응답한다"는 것뿐이다. 연결
          # 자체가 안 되면(000) 컨테이너가 여전히 안 뜬 것이다.
          #
          # **`|| true` 가 없으면 재시도 루프가 한 번도 돌지 않는다.** `set -e`
          # 아래에서 `status=$(curl ...)` 는 대입문의 종료 코드가 curl 의 것이라,
          # 첫 시도가 실패하는 순간 셸이 그 자리에서 죽는다 — 컨테이너가 정상
          # 부팅 중이어도 빨간불이 되고, 스텝은 curl 자신의 종료 코드(연결 실패 7,
          # 수신 실패 56)로 끝난다. 실제로 그렇게 15회 연속 실패했다. 아래 주석이
          # 경계하는 "000000" 문제는 `|| echo "000"` 이 출력을 하나 더 얹기 때문에
          # 생기는 것이라, 출력을 얹지 않는 `|| true` 에는 없다.
          #
          # frontend-deploy-guard와 같은 이유로 `|| echo "000"`을 쓰지 않는다
          # (#70 코드리뷰 지적, 심각 — 여기서 그대로 복사된 버그였다). curl은
          # `-w`가 있으면 연결 실패 시에도 스스로 "000"을 쓴다 — `|| echo
          # "000"`을 얹으면 "000000"이 되어 재시도 루프가 첫 시도에 곧장
          # break한다.
          status="000"
          for _ in $(seq 1 20); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3101/healthz 2>/dev/null || true)
            status="${status:-000}"
            [ "$status" = "000" ] || break
            sleep 1
          done
          echo "healthz status: $status"
          if [ "$status" != "200" ] && [ "$status" != "503" ]; then
            echo "::error::완전한 프로덕션 설정인데도 컨테이너가 응답하지 않는다(status=$status)"
            docker logs operator-boot-ok
            exit 1
          fi

          # ADR-0016/0019 성립 조건 — production에서 세션 쿠키의 Secure가 실제로
          # 켜지는지. operator/app/api/auth/logout/route.ts는 세션 쿠키가 없으면
          # 백엔드를 부르지 않고 곧바로 clearSessionCookie를 실어 응답한다 — 그래서
          # 백엔드 없이도 이 경로 하나로 쿠키 속성을 직접 관찰할 수 있다.
          set_cookie=$(curl -s -D - -o /dev/null -X POST http://127.0.0.1:3101/api/auth/logout \
            -H "Origin: https://operator.codemit.example")
          echo "$set_cookie"
          echo "$set_cookie" | grep -qi "codemit_operator_session=.*Secure" \
            || { echo "::error::production인데 codemit_operator_session 쿠키에 Secure가 없다"; exit 1; }


      - name: Tear down the boot-guard container
        if: always()
        run: docker rm -f operator-boot-ok >/dev/null 2>&1 || true

      - name: Dump container state on failure
        if: failure()
        run: docker ps -a

  # 강의실 배포 부팅 가드 (#296 — #277 이 강의실을 배포 파이프라인에 올리며
  # 빠뜨린 잡을 채운다. 그 잡이 왜 있는지는 #166).
  #
  # frontend-deploy-guard·operator-deploy-guard 와 정확히 같은 이유·같은 형태다:
  # ADR-0021 의 프론트 테스트 시임("실행 중인 앱 하나")으로는 "앱이 뜨지 않는 것"
  # 자체를 증명할 수 없고, `typecheck` 는 호스트 node_modules 를 쓰며 e2e 는
  # 로컬에서 안 돈다 — 워크스페이스 멤버 하나를 Dockerfile 의 COPY 에서
  # 빠뜨려도 그 셋 중 누구도 못 잡는다(#166 이 그렇게 났다). classroom.Dockerfile
  # 의 runner 스테이지(staging/prod 가 실제로 배포하는 그 이미지)를 직접 빌드해
  # 컨테이너로 띄우고, 프로세스 종료 코드와 로그를 확인한다.
  #
  # classroom/instrumentation.ts 도 frontend·operator 와 같은 함정을 피해
  # process.exit(1)로 직접 프로세스를 끊는다 — 이 잡은 그게 실제로 그런지
  # 직접 관찰한다.
  #
  # **다른 두 잡과 다른 점 하나.** 강의실은 자기 로그인이 없다(ADR-0038) — 세션
  # 쿠키는 공개 앱이 굽고, 강의실이 쿠키를 지우는 유일한 경로는 백엔드 프록시
  # (app/api/backend/[...path]/route.ts)뿐인데 그 경로는 먼저 assertSameOrigin
  # 을 지나 실제로 forwardToBackend 를 호출한다 — 백엔드 없이는 도달할 수 없다.
  # frontend·operator 의 "Secure 쿠키" 스텝처럼 백엔드 없이 쿠키 속성만 따로
  # 관찰할 별도 경로가 없으므로 그 스텝은 옮기지 않는다 — Secure 플래그 자체는
  # classroom/lib/auth/cookies.test.ts 의 유닛 테스트가 이미 고정하고 있다.
  classroom-deploy-guard:
    runs-on: [self-hosted, sub]

    steps:
      - uses: actions/checkout@v4

      - name: Build the production classroom image (runner stage)
        run: docker build -f docker/classroom.Dockerfile --target runner -t codemit-classroom-runner-ci .

      # frontend-deploy-guard와 같은 이유 — .dockerignore가 시크릿과 호스트
      # node_modules를 실제로 막는지 이 앱에서도 직접 확인한다.
      - name: .dockerignore actually keeps secrets and host node_modules out of the image
        run: |
          set -euo pipefail
          echo "OPENAI_API_KEY=sk-ci-guard-fake-secret-do-not-leak" > classroom/.env
          mkdir -p classroom/node_modules/.ci-guard-marker
          echo "host-node-modules-should-not-leak-into-image" > classroom/node_modules/.ci-guard-marker/marker.txt
          docker build -f docker/classroom.Dockerfile --target builder -t codemit-classroom-builder-ci-guard .
          docker run --rm --entrypoint sh codemit-classroom-builder-ci-guard -c '
            set -e
            if [ -f /app/classroom/.env ]; then
              echo "FOUND /app/classroom/.env — .dockerignore가 시크릿을 막지 못했다" >&2
              exit 1
            fi
            if [ -d /app/classroom/node_modules/.ci-guard-marker ]; then
              echo "FOUND /app/classroom/node_modules/.ci-guard-marker — .dockerignore가 호스트 node_modules를 막지 못했다" >&2
              exit 1
            fi
            if grep -rl "sk-ci-guard-fake-secret\|host-node-modules-should-not-leak-into-image" /app > /dev/null 2>&1; then
              echo "가짜 시크릿 또는 host node_modules 마커가 이미지 어딘가에 들어갔다" >&2
              exit 1
            fi
            echo "confirmed: .env and host node_modules excluded from the image"
          '
          rm -f classroom/.env
          rm -rf classroom/node_modules/.ci-guard-marker
          docker rmi codemit-classroom-builder-ci-guard

      - name: Refuses to boot in production with missing config (and actually exits — not just logs)
        run: |
          set +e
          output=$(timeout 60 docker run --rm -e CODEMIT_DEPLOYMENT_TARGET=production codemit-classroom-runner-ci 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
            echo "::error::필수 설정 없이도 컨테이너가 죽지 않았다(status=$status) — 부팅 가드가 깨졌다"
            exit 1
          fi
          echo "$output" | grep -q "CODEMIT_CLASSROOM_ORIGIN" || { echo "::error::에러 메시지에 원인(CODEMIT_CLASSROOM_ORIGIN)이 안 남는다"; exit 1; }
          echo "$output" | grep -q "CODEMIT_API_BASE_URL" || { echo "::error::에러 메시지에 원인(CODEMIT_API_BASE_URL)이 안 남는다"; exit 1; }
          echo "$output" | grep -q "CODEMIT_SESSION_COOKIE_DOMAIN" || { echo "::error::에러 메시지에 원인(CODEMIT_SESSION_COOKIE_DOMAIN)이 안 남는다"; exit 1; }

      - name: Refuses to boot in staging with only one required value missing
        run: |
          set +e
          output=$(timeout 60 docker run --rm \
            -e CODEMIT_DEPLOYMENT_TARGET=staging \
            -e CODEMIT_CLASSROOM_ORIGIN=https://classroom.staging.codemit.example \
            codemit-classroom-runner-ci 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
            echo "::error::CODEMIT_API_BASE_URL/CODEMIT_SESSION_COOKIE_DOMAIN 없이도 staging 컨테이너가 죽지 않았다(status=$status)"
            exit 1
          fi
          echo "$output" | grep -q "CODEMIT_API_BASE_URL" || { echo "::error::에러 메시지에 원인(CODEMIT_API_BASE_URL)이 안 남는다"; exit 1; }
          echo "$output" | grep -q "CODEMIT_SESSION_COOKIE_DOMAIN" || { echo "::error::에러 메시지에 원인(CODEMIT_SESSION_COOKIE_DOMAIN)이 안 남는다"; exit 1; }

      # 머신이 남는다 — 잡이 자기 뒤를 치워야 한다(frontend-deploy-guard와 같은
      # 이유). 시작 전에 지우고(멱등), 끝나면 성공·실패 무관하게 지운다.
      - name: Boots with a complete production config
        run: |
          set -euo pipefail
          docker rm -f classroom-boot-ok >/dev/null 2>&1 || true
          docker run -d --name classroom-boot-ok \
            -e CODEMIT_DEPLOYMENT_TARGET=production \
            -e CODEMIT_CLASSROOM_ORIGIN=https://classroom.codemit.example \
            -e CODEMIT_API_BASE_URL=http://127.0.0.1:1 \
            -e CODEMIT_SESSION_COOKIE_DOMAIN=.codemit.example \
            -e CODEMIT_WEB_ORIGIN=https://codemit.example \
            -p 3102:3000 \
            codemit-classroom-runner-ci

          # 백엔드가 없어 /healthz 는 503(degraded)이 정상이다 — 여기서 보는 건
          # "완전한 설정에서는 강의실이 죽지 않고 응답한다"는 것뿐이다. 연결
          # 자체가 안 되면(000) 컨테이너가 여전히 안 뜬 것이다. `|| echo "000"`을
          # 쓰지 않는 이유는 frontend-deploy-guard와 같다(#70 코드리뷰 지적).
          status="000"
          for _ in $(seq 1 20); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3102/healthz 2>/dev/null || true)
            status="${status:-000}"
            [ "$status" = "000" ] || break
            sleep 1
          done
          echo "healthz status: $status"
          if [ "$status" != "200" ] && [ "$status" != "503" ]; then
            echo "::error::완전한 프로덕션 설정인데도 컨테이너가 응답하지 않는다(status=$status)"
            docker logs classroom-boot-ok
            exit 1
          fi

      # 런타임 설정이 빌드에 박제되지 않는지 실제로 확인한다 (#297). 이 검사가
      # 없어서 배포된 강의실의 로그인 링크가 `http://127.0.0.1:53000` 을 가리켰다 —
      # 그 화면이 정적으로 구워져 **빌드 머신의** 환경(=비어 있음)을 읽었기 때문이다.
      # dev 도 CI e2e 도 이것을 못 본다: 둘 다 CODEMIT_WEB_ORIGIN 이 비어 있어 dev
      # 폴백이 「맞는 답」이라 통과한다. 프로덕션 이미지에 배포 설정을 물린 여기서만
      # 드러난다. (구조 쪽은 classroom/lib/rendering/runtime-config.test.ts 가 본다.)
      - name: Runtime config is read at request time, not baked into the build
        run: |
          set -euo pipefail
          html=$(curl -sS --max-time 10 http://127.0.0.1:3102/login)
          # **파이프로 찾지 않는다**(2026-09-20). 예전에는 `echo "$html" | grep -q …`
          # 였는데, `grep -q` 는 첫 일치에서 곧바로 끝나므로 HTML 이 파이프 버퍼(64KB)
          # 보다 커지면 아직 쓰고 있던 `echo` 가 SIGPIPE 로 죽고, `pipefail` 이 그것을
          # 파이프라인 실패로 읽어 **찾았는데도 빨개진다**. 실제로 그렇게 났다(#472 가
          # 바닥글을 더해 HTML 이 그 문턱을 넘은 날) — 원인이 「값이 안 박혔다」로
          # 보여서 진단이 한 번 어긋났다. bash 패턴 매칭에는 파이프가 없다.
          [[ "$html" == *"https://codemit.example/login"* ]] \
            || { echo "::error::/login 이 CODEMIT_WEB_ORIGIN 을 안 읽는다 — 빌드 시점 값이 구워졌는가?"; printf '%s' "$html" | head -c 4000; exit 1; }
          if [[ "$html" == *"127.0.0.1"* ]]; then
            echo "::error::/login HTML 에 로컬호스트가 남아 있다 — dev 폴백이 박제됐다(#297)"
            printf '%s' "$html" | grep -o "http://127[^\"']*" | head -5 || true
            exit 1
          fi
          echo "로그인 링크가 런타임 설정을 읽는다"

      - name: Tear down the boot-guard container
        if: always()
        run: docker rm -f classroom-boot-ok >/dev/null 2>&1 || true

      - name: Dump container state on failure
        if: failure()
        run: docker ps -a

  images-staging:
    # ── 배포 이미지(2026-09-17) ──────────────────────────────────────────────
    #
    # **staging·prod 서버는 이미지를 굽지 않고 여기서 올린 것을 받는다**(deploy.sh 머리 주석).
    # 커밋마다 네 이미지를 ghcr 에 올린다 — 태그의 sha 가 곧 배포 스크립트가 체크아웃한 커밋이다.
    # 바뀌지 않은 서비스는 레지스트리 캐시(codemit-buildcache)에 맞아 금방 끝난다.
    #
    # **서비스마다 한 잡(matrix)이다** — 한 잡에서 넷을 차례로 굽던 때는 앱 셋이 줄을 섰다.
    # 동시에 도는 수는 러너 수(mac 3대)가 정한다.
    #
    # **두 이미지 잡 모두 mac 러너에서 돈다**. sub 는 테스트 잡과 staging 스택이 같은 SATA SSD 를
    # 나눠 쓰는데, 빌드를 얹으니 CPU·메모리는 남는데 디스크 대기가 14~84% 로 치솟았다.
    # mac(Apple Silicon)은 prod 의 arm64 를 제 속도로, staging 의 amd64 는 Docker Desktop 의
    # 에뮬레이션으로 굽는다. **mac 이 없을 때의 비상구는 저장소 변수 `IMAGE_BUILDER=sub`** 다 —
    # 두 잡이 sub 로 옮겨 가 amd64 는 제 속도로, arm64 는 QEMU 로(느리게) 굽는다. 줄 서 있던
    # 실행은 변수를 바꾼 뒤 다시 돌린다. 자동 전환은 두지 않았다: 러너 생존을 조회하려면 조직
    # 관리자 토큰을 CI 에 넣어야 한다.
    #
    # backend 는 환경을 가리지 않아 아키텍처만 가른다(`-amd64` = staging 호스트 sub 의 것).
    # 세 앱은 NEXT_PUBLIC_* 가 빌드 때 굳으므로 환경마다 따로 굽는다(`-staging`). 그 값은
    # 서버 env 파일이 아니라 저장소 변수 STAGING_* 에 있다 — 조직이 free 요금제라 비공개
    # 저장소의 environment 기능을 못 쓴다. 값을 바꾸면 이 잡이 다시 돌아야 반영된다.
    #
    # 테스트 잡과 **나란히** 돈다(러너가 다르다) — 배포(deploy-staging)가 테스트를 기다리므로
    # 빨간 커밋의 이미지는 올라가도 배포되지 않는다.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.IMAGE_BUILDER == 'sub' && '["self-hosted", "sub"]' || '["self-hosted", "ARM64", "mac-arm"]') }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: backend, dsn: BACKEND, tag: amd64, target: '', paths: 'backend docker/backend.Dockerfile' }
          - { service: frontend, dsn: FRONTEND, tag: staging, target: runner, paths: 'frontend packages package.json pnpm-workspace.yaml pnpm-lock.yaml docker/frontend.Dockerfile' }
          - { service: operator, dsn: OPERATOR, tag: staging, target: runner, paths: 'operator packages package.json pnpm-workspace.yaml pnpm-lock.yaml docker/operator.Dockerfile' }
          - { service: classroom, dsn: CLASSROOM, tag: staging, target: runner, paths: 'classroom packages package.json pnpm-workspace.yaml pnpm-lock.yaml docker/classroom.Dockerfile' }
          # nori 플러그인을 넣은 OpenSearch(#450/#451, 부모 #444 스펙). backend와
          # 같은 원칙으로 아키텍처로만 가른다 — 환경별로 굳는 값이 없다(Next
          # 앱이 아니다). 소스는 이 Dockerfile 하나뿐이다.
          - { service: search, dsn: SEARCH, tag: amd64, target: '', paths: 'docker/search.Dockerfile' }
          # 연결 풀러(pgbouncer, #453/#457/#458). backend·search 와 같은 원칙으로
          # 아키텍처로만 가른다 — 환경별로 굳는 값이 없다(Next 앱이 아니다).
          # 소스는 Dockerfile 과 그 entrypoint 스크립트 하나뿐이다.
          - { service: pgbouncer, dsn: PGBOUNCER, tag: amd64, target: '', paths: 'docker/pgbouncer.Dockerfile docker/pgbouncer' }
    steps:
      - uses: actions/checkout@v4
        with:
          # 아래 「앱 코드의 버전」이 경로별 마지막 커밋을 찾으려면 이력이 있어야 한다(8MB 남짓).
          fetch-depth: 0

      # 비상구(sub)에서만 arm64 에뮬레이터를 등록한다. mac 은 Docker Desktop 이 amd64 를
      # 이미 에뮬레이션하므로(Rosetta) 여기서 QEMU 를 깔면 그 더 빠른 쪽을 덮어쓴다.
      - uses: docker/setup-qemu-action@v3
        if: vars.IMAGE_BUILDER == 'sub'
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # **앱의 release 는 HEAD 가 아니라 「그 이미지에 들어가는 코드를 마지막으로 바꾼 커밋」이다.**
      # NEXT_PUBLIC_SENTRY_RELEASE 는 `pnpm build` 바로 앞에서 ENV 로 굳으므로, 커밋마다 달라지면
      # 앱 코드가 그대로여도 Next 빌드가 캐시를 못 쓰고 처음부터 돈다(워크플로만 고친 커밋에서
      # 앱마다 1.5~2.5분). 이 값이면 코드가 같을 때 캐시에 맞고, 오류 수집기의 release 도 그 코드의
      # 실제 버전을 가리킨다. 이미지 **태그**는 여전히 HEAD sha 다(deploy.sh 가 그 이름으로 받는다).
      - name: 앱 코드의 버전
        id: code
        run: echo "sha=$(git log -1 --format=%H -- ${{ matrix.paths }})" >> "$GITHUB_OUTPUT"

      - name: ${{ matrix.service }} (${{ matrix.tag }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/sandcorporation/codemit-${{ matrix.service }}:${{ github.sha }}-${{ matrix.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=registry,ref=ghcr.io/sandcorporation/codemit-buildcache:${{ matrix.service }}-${{ matrix.tag }}
          cache-to: type=registry,ref=ghcr.io/sandcorporation/codemit-buildcache:${{ matrix.service }}-${{ matrix.tag }},mode=max
          # backend·search·pgbouncer 는 이 값들을 쓰지 않는다(쓰이지 않은 인자라는
          # 경고만 남는다). SENTRY_DSN 은 앱마다 다른 프로젝트라 서비스 이름으로
          # 변수를 고른다.
          build-args: |
            NEXT_PUBLIC_PORTONE_STORE_ID=${{ vars.STAGING_PORT_ONE_V2_STORE_ID }}
            NEXT_PUBLIC_PORTONE_CHANNEL_KEY=${{ vars.STAGING_KG_INICIS_CHANNEL_KEY }}
            NEXT_PUBLIC_TOSS_CLIENT_KEY=${{ vars.STAGING_TOSS_CLIENT_KEY }}
            NEXT_PUBLIC_SUPPORT_EMAIL=${{ vars.STAGING_SUPPORT_EMAIL }}
            NEXT_PUBLIC_CONTEST_PRODUCT_ENABLED=${{ vars.STAGING_CODEMIT_CONTEST_PRODUCT_ENABLED }}
            NEXT_PUBLIC_PAID_CONTEST_PRODUCT_ENABLED=${{ vars.STAGING_CODEMIT_PAID_CONTEST_PRODUCT_ENABLED }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars[format('STAGING_SENTRY_DSN_{0}', matrix.dsn)] }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=staging
            NEXT_PUBLIC_SENTRY_RELEASE=${{ steps.code.outputs.sha }}

      # **빌드가 끝나면 이 러너 호스트의 도커 디스크를 비운다**(2026-09-17). 이 잡의 캐시는
      # 레지스트리(codemit-buildcache)에 있고, 굽는 데 쓴 buildx 빌더(docker-container)는
      # setup-buildx-action 의 뒷정리가 상태 볼륨째 지운다 — 호스트에 남는 것은 데몬의 기본
      # 빌더 캐시와 태그를 잃은 이미지뿐이다. `--builder default` 를 박는 이유: 이 잡에서는
      # setup-buildx 가 자기 빌더를 기본으로 골라 둬서, 그냥 `docker builder prune` 을 부르면
      # 곧 지워질 그 빌더만 비운다. 하루(24h) 안에 쓰인 캐시는 남긴다 — 같은 호스트에서 도는
      # 다른 잡(비상구 sub 에서는 테스트 잡의 compose 빌드)이 그 캐시를 쓴다. 쓰는 중인
      # 캐시·이미지는 도커가 스스로 건너뛰고, 정리 실패가 빌드 결과를 뒤집지 않게 삼킨다.
      - name: 쓰이지 않는 이미지·빌드 캐시 정리
        if: always()
        run: |
          docker image prune -f || true
          docker buildx prune --builder default -f --filter until=24h || true

  images-prod:
    # prod(oracle, arm64) 이미지 — 구조는 images-staging 과 같다(주석도 거기). mac 러너는 Apple
    # Silicon 의 Docker Desktop 위에 sub 와 같은 `myoung34/github-runner` 컨테이너(조직 범위,
    # Linux/ARM64, 라벨 `mac-arm`, Docker Desktop 의 docker.sock 마운트)로 뜬다. mac-arm 라벨이 곧
    # 「그 mac」이다 — 러너가 조직 범위라 ARM64 만으로 고르면 다른 ARM 러너로 갈 수 있다. oracle 은
    # prod 서버라 빌드가 서비스를 느리게 만들어 후보에서 뺐다.
    #
    # **mac 이 꺼져 있으면 이 잡이 줄을 서고, 그동안 CI 가 끝나지 않으므로 production 승격도
