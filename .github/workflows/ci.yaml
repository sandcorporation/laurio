  sub-docker-cleanup:
    # **sub 에서 이미지를 굽는 잡들이 끝나면 호스트의 도커 디스크를 비운다**(2026-09-17).
    # compose 로 이미지를 굽는 잡(celery-broker·e2e 셋·deploy-guard 셋)이 커밋마다 같은
    # 이름(`codemit-ci-*:latest` 등)으로 다시 구워, 옛 이미지는 태그를 잃은 채 남고 빌드
    # 캐시는 계속 쌓인다 — 정리 전 실측이 빌드 캐시 107GB·이미지 78GB, 루트 디스크 86% 였다.
    # 러너 세 대가 같은 호스트 데몬(docker.sock)을 쓰므로 잡 하나가 한 번 비우면 된다.
    # 하루(24h) 안에 쓰인 캐시는 남긴다 — 다음 커밋의 빌드가 그 캐시로 빨라진다. 동시에 도는
    # 다른 실행이 쓰는 캐시·이미지는 도커가 건너뛴다. 결과와 무관하게 돈다(`always()`).
    needs:
      - celery-broker
      - frontend-e2e-public
      - frontend-e2e-operator
      - frontend-e2e-classroom
      - frontend-deploy-guard
      - operator-deploy-guard
      - classroom-deploy-guard
    if: always()
    runs-on: [self-hosted, sub]
    timeout-minutes: 15
    steps:
      - name: 쓰이지 않는 이미지·빌드 캐시 정리
        run: |
          docker system df || true
          docker image prune -f || true
          docker builder prune -f --filter until=24h || true
          docker system df || true

  deploy-staging:
    # 이미지가 올라가고 **나머지 잡이 전부 초록**이면 sub 의 Jenkins staging 잡(laurio)을
    # 이 커밋으로 부른다(Jenkinsfile 의 DEPLOY_SHA). 러너와 Jenkins 가 같은 호스트라
    # JENKINS_URL 은 루프백이다. 값은 scripts/ghcr-setup-wizard.sh 6단계가 넣는다.
    # images-prod 는 기다리지 않는다. 다만 images-staging 도 mac 에서 돌므로, mac 이 꺼져
    # 있으면 staging 도 기다린다 — 그때는 IMAGE_BUILDER=sub 로 옮긴다.
    needs:
      - test
      - deploy-check
      - frontend-openapi-types
      - banned-words-generated
      - adr-status
      - screen-language
      - frontend-pure-unit-tests
      - celery-broker
      - frontend-e2e-public
      - frontend-e2e-operator
      - frontend-e2e-classroom
      - frontend-deploy-guard
      - operator-deploy-guard
      - classroom-deploy-guard
      - images-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, sub]
    timeout-minutes: 5
    steps:
      - name: Jenkins staging 잡을 이 커밋으로 부른다
        env:
          JENKINS_URL: ${{ vars.JENKINS_URL }}
          JENKINS_USER: ${{ vars.JENKINS_USER }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
        run: |
          set -eu
          # 자격증명은 표준입력(curl -K -)으로만 넘긴다 — 명령줄에 두면 호스트의 ps 에 보인다.
          code=$(printf 'user = "%s:%s"\n' "$JENKINS_USER" "$JENKINS_API_TOKEN" \
            | curl -sS -K - -o /tmp/jenkins-trigger.out -w '%{http_code}' -X POST \
                --data-urlencode "DEPLOY_SHA=${GITHUB_SHA}" \
                "${JENKINS_URL%/}/job/laurio/buildWithParameters")
          if [ "$code" != "201" ]; then
            echo "::error::Jenkins 가 ${code} 로 답했다 — 잡 파라미터(DEPLOY_SHA)·사용자 권한·토큰을 확인하라"
            cat /tmp/jenkins-trigger.out || true
            exit 1
          fi
          echo "staging 배포를 불렀다: ${GITHUB_SHA}"
