name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: laurio
          POSTGRES_USER: laurio
          POSTGRES_PASSWORD: laurio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laurio -d laurio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        # Operator 세션 저장소(#43). 테스트가 실제 Redis 를 상대로 돈다 — conftest 의
        # autouse 픽스처가 매 테스트마다 세션 캐시를 비우므로, 이게 없으면 스위트
        # 전체가 ConnectionError 로 죽는다.
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # 러너에서는 서비스 컨테이너가 표준 포트로 붙으므로 dev 기본값을 덮어쓴다.
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: laurio
      POSTGRES_USER: laurio
      POSTGRES_PASSWORD: laurio
      # 러너의 redis 도 표준 포트다 — dev 가 비켜 잡은 16379 기본값을 덮어쓴다.
      SESSION_REDIS_URL: redis://127.0.0.1:6379/1
      DJANGO_SECRET_KEY: ci-only-insecure-key
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "*"
      # DJANGO_DEBUG=false 인데 비어 있으면 config/settings.py 가 부팅을 거부하는
      # 항목들. CI는 운영 배포가 아니지만(LAURIO_DEPLOYMENT_TARGET 미설정 =
      # "development"), DEBUG=false로 실행하는 이상 이 값들은 그대로 요구된다 —
      # 여기서 요구하는 건 "값이 비어 있지 않을 것"뿐이지 "진짜 운영 비밀일 것"이
      # 아니다.
      INTERNAL_API_TOKEN: ci-only-insecure-internal-token
      JWT_SIGNING_KEY: ci-only-insecure-jwt-signing-key
      PAYMENT_WEBHOOK_SECRET: ci-only-insecure-fake-pg-webhook-secret
      PAYOUT_WEBHOOK_SECRET: ci-only-insecure-fake-toss-payout-webhook-secret
      # Fernet 키는 형식이 고정돼 있다(urlsafe base64 32바이트) — settings.py의 dev
      # fallback과 같은 값을 그대로 쓴다(둘 다 저장소에 이미 공개돼 있어 새로 유출될
      # 비밀이 아니다).
      VERIFICATION_ENCRYPTION_KEY: A0crfksMrBmbSY37jIyOwcPRFpK9rc_eIaNnL89lIfo=
      # #10 리뷰: "어떤 어댑터 구현체를 쓸지"는 DEBUG(=이게 진짜 운영 배포인지)와
      # 다른 질문이다. 기본값이 이미 fake이므로 없어도 같은 값이지만, CI가 반드시
      # fake로 돈다는 것을 여기 명시적으로 남긴다 — staging/production 배포(#23)만
      # real(또는 실제 어댑터의 dotted path)로 바꾼다.
      STORAGE_BACKEND: fake
      SOCIAL_AUTH_MODE: fake
      VERIFICATION_ADAPTER_MODE: fake
      PAYMENT_ADAPTER_MODE: fake
      PAYOUT_ADAPTER_MODE: fake
      LLM_ADAPTER_MODE: fake
      LLM_REQUIREMENT_CHAT_ADAPTER_MODE: fake

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies from lockfile
        working-directory: backend
        run: uv sync --locked

      # --deploy 는 이 잡(LAURIO_DEPLOYMENT_TARGET 미설정 = "development")에는 켜지
      # 않는다 — HSTS·SSL 리다이렉트·secure 쿠키는 config/settings.py에서 production
      # 에만 켜지도록 설계했으므로(#23), 여기서 --deploy를 켜면 이 잡의 목적과 무관한
      # 경고가 매번 뜬다. production 구성이 실제로 --deploy를 통과하는지는 아래
      # `deploy-check` 잡이 별도로 검증한다.
      - name: Django system checks
        working-directory: backend
        run: uv run python manage.py check --fail-level WARNING

      - name: Run tests
        working-directory: backend
        run: uv run pytest

  deploy-check:
    # 티켓 01(#1)이 "HSTS·SSL 리다이렉트·보안 쿠키 경고가 매번 떠서 소음이 된다"는
    # 이유로 미룬 `manage.py check --deploy`를 여기서 켠다(#23). production
    # 배포에서만 요구되는 하드닝(config/settings.py의 IS_PRODUCTION_DEPLOYMENT
    # 블록)이라 위 `test` 잡(development)과는 별도 잡으로 분리했다 — 그래야 이
    # 검사가 걸려도 `test` 잡의 매 커밋 시그널이 이 경고로 오염되지 않는다.
    #
    # 여기 쓰는 값은 전부 CI 전용 더미다(`test` 잡의 기존 주석과 같은 원칙) — 다만
    # DJANGO_SECRET_KEY만은 config/settings.py의 production 강도 가드(50자 이상·
    # 고유 문자 5종 이상·django-insecure- 접두 아님)를 실제로 통과해야 하므로 그
    # 조건을 만족하는 무작위스러운 더미 문자열을 쓴다. `manage.py check`는 DB에
    # 붙지 않으므로 postgres 서비스 컨테이너가 필요 없다.
    runs-on: ubuntu-latest

    env:
      LAURIO_DEPLOYMENT_TARGET: production
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: "ci-deploy-check-only-Kx8f3Kq0mN2pR7tYcVbGhJkLdSaWeUiOaXzCvBnMqWeRtYuIoPaSdFgHjKlZxCvB"
      DJANGO_ALLOWED_HOSTS: "api.laurio.example"
      # #43: 배포 환경에서 비면 부팅을 거부한다 — 이 잡의 env가 그 가드를
      # 실제로 통과하는지도 함께 검증한다(코디네이터 리뷰 지적 — 이 값이 없어서
      # 이 잡은 어댑터 모드와 무관하게 이미 실패하고 있었다).
      LAURIO_OPERATOR_ORIGIN: "https://operator.laurio.example"
      POSTGRES_DB: laurio
      POSTGRES_USER: laurio
      POSTGRES_PASSWORD: ci-deploy-check-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      INTERNAL_API_TOKEN: ci-deploy-check-only-internal-token
      JWT_SIGNING_KEY: ci-deploy-check-only-jwt-signing-key
      PAYMENT_WEBHOOK_SECRET: ci-deploy-check-only-payment-webhook-secret
      PAYOUT_WEBHOOK_SECRET: ci-deploy-check-only-payout-webhook-secret
      VERIFICATION_ENCRYPTION_KEY: A0crfksMrBmbSY37jIyOwcPRFpK9rc_eIaNnL89lIfo=
      STORAGE_BACKEND: s3
      STORAGE_BUCKET: laurio-prod
      STORAGE_ENDPOINT_URL: https://s3.amazonaws.com
      STORAGE_ACCESS_KEY: ci-deploy-check-only-access-key
      STORAGE_SECRET_KEY: ci-deploy-check-only-secret-key
      STORAGE_REGION: us-east-1
      SOCIAL_AUTH_MODE: real
      # 카카오 OAuth 앱 자격증명(#95/#96) — authorize・code→token 교환은
      # frontend BFF가 지므로 이 잡(backend만 돈다)은 실제로 쓰지 않지만,
      # SOCIAL_AUTH_MODE=real인 배포 환경에서 이 값들이 비면 config/settings.py
      # 의 부팅 가드가 거부한다 — 이 잡이 검증하는 "배포 하드닝이 통과하는가"에
      # 포함된다.
      KAKAO_REST_API_KEY: ci-deploy-check-only-kakao-rest-api-key
      KAKAO_SECRET_KEY: ci-deploy-check-only-kakao-secret-key
      KAKAO_REDIRECT_URI: https://api.laurio.example/api/auth/social/kakao/callback
      # 실제 벤더 어댑터(#85 PortOne, #87 Toss, #57 Seller 등록, #88 OpenAI)는
      # 아직 구현되지 않았다(#23/#83 범위 밖) — 이 잡이 검증하려는 건 "배포
      # 하드닝이 통과하는가"이지 "어댑터가 실물인가"가 아니다. `core.adapters.
      # check_adapter_mode`(#83)는 "fake"도 아니고 실제로 쓸 수도 없는 값(import·
      # 인스턴스화·계약 충족 중 하나라도 실패)을 거부하므로, 문자 그대로 "real"은
      # 더 이상 통과하지 못한다(dotted path가 아니다) — `tests/adapter_stubs.py`가
      # 제공하는, 각 Protocol을 구조적으로 만족하는 최소 stub을 대신 가리킨다.
      # 실물 어댑터가 생기면 그 dotted path로 바뀐다.
      VERIFICATION_ADAPTER_MODE: tests.adapter_stubs.StubVerificationAdapter
      PAYMENT_ADAPTER_MODE: tests.adapter_stubs.StubPGAdapter
      PAYOUT_ADAPTER_MODE: tests.adapter_stubs.StubPayoutAdapter
      SELLER_ADAPTER_MODE: tests.adapter_stubs.StubSellerAdapter
      LLM_ADAPTER_MODE: tests.adapter_stubs.StubLLMScoringAdapter
      LLM_REQUIREMENT_CHAT_ADAPTER_MODE: tests.adapter_stubs.StubRequirementChatAdapter
      # #89: RealAlimtalkAdapter/RealSmsAdapter/RealLmsAdapter는 저장소에 없는
      # 클래스였다 — 그 사실이 부팅 가드 없이는 드러나지 않았다. 실물 벤더
      # 어댑터(#51, notifications.adapters_aligo)는 이제 존재하지만, 이 잡은
      # PAYMENT_ADAPTER_MODE가 TossPGAdapter가 나온 뒤에도 계속 stub을 가리키는
      # 것과 같은 이유로 여전히 stub을 가리킨다 — "배포 하드닝이 통과하는가"를
      # 벤더 자격증명 없이 검증하는 것이 이 잡의 목적이다. 실물 Aligo 어댑터가
      # 자격증명과 함께 실제로 부팅되는지는 tests/test_deployment_config.py의
      # 전용 테스트가 별도로 검증한다.
      NOTIFICATION_ALIMTALK_ADAPTER: tests.adapter_stubs.StubAlimtalkChannelAdapter
      NOTIFICATION_SMS_ADAPTER: tests.adapter_stubs.StubSmsChannelAdapter
      NOTIFICATION_LMS_ADAPTER: tests.adapter_stubs.StubLmsChannelAdapter

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies from lockfile
        working-directory: backend
        run: uv sync --locked

      - name: Django system checks (production, --deploy)
        working-directory: backend
        run: uv run python manage.py check --deploy --fail-level WARNING

  # FE-03(#28) — 프론트 타입이 백엔드의 OpenAPI 스키마에서 생성한 그대로 최신인지
  # 확인한다. `frontend/scripts/generate-api-types.mjs` 를 그대로 돌린 뒤
  # `git diff --exit-code` 로 커밋된 산출물과 다르면 실패시킨다 — 재생성했을 때
  # diff 가 나면 실패한다는 티켓의 요구사항 그대로다.
  #
  # 이 검사는 dev compose 스택을 띄우지 않는다. django-ninja 의 스키마 생성은
  # DB 접속 없이 등록된 라우터·스키마 클래스를 읽어들이는 것뿐이라
  # (`backend/core/management/commands/export_openapi_schema.py` 참고),
  # `uv sync` 만 된 신선한 체크아웃에서도 돈다 — frontend-test 잡처럼 컨테이너가
  # 뜨고 헬스체크가 통과하길 기다릴 필요가 없어 더 빠르고 스택 기동 실패에
  # 영향받지 않는다.
  frontend-openapi-types:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend dependencies from lockfile
        working-directory: backend
        run: uv sync --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install frontend dependencies from lockfile
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Regenerate types from the backend's OpenAPI schema
        working-directory: frontend
        run: pnpm generate:api

      - name: Fail if the committed types are stale
        run: |
          if ! git diff --exit-code -- frontend/lib/api/schema.gen.ts; then
            echo "::error::frontend/lib/api/schema.gen.ts 가 backend 의 현재 OpenAPI 스키마와" \
                 "다릅니다. 'pnpm --dir frontend generate:api' 로 다시 만들어 커밋하세요."
            exit 1
          fi

  # 프론트엔드 e2e. ADR-0017 — 시임은 **실행 중인 Next 앱 하나**이므로, 모킹하지 않고
  # dev compose 로 전체 스택(db·minio·backend·frontend)을 실제로 띄운 뒤 그걸 친다.
  # dev compose 는 모든 어댑터가 fake 로 바인딩되므로 실제 PG·LLM·알림 벤더가 필요 없다.
  celery-broker:
    # #40 — celery 가 redis 트랜스포트 없이 선언돼 있어서 staging·prod 의 worker·beat
    # 가 브로커에 붙지 못하는 상태였다. 의존성만 고치고 끝내면 같은 일이 조용히
    # 되돌아온다(이 저장소는 .dockerignore 에서 「파일에 적혀 있다」를 증명으로
    # 착각해 두 번 데었다). 그래서 **실제로 붙는지**를 매번 확인한다.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Bring up the stack with celery
        # dev 기본 기동에는 celery 가 빠져 있다(beat 의 60초 스캔이 e2e 시드를
        # 건드리면 비결정적 실패가 된다) — 이 잡만 프로필로 켠다.
        run: docker compose -f docker/compose.dev.yaml --profile celery up -d --build

      - name: The redis transport driver is actually in the image
        # 파일에 적힌 의존성이 아니라 빌드된 이미지 안을 본다.
        run: |
          docker compose -f docker/compose.dev.yaml exec -T celery-worker             python -c "import redis, kombu; print('redis', redis.__version__, 'kombu', kombu.__version__)"

      - name: The worker is actually connected to the broker
        # inspect ping 은 브로커를 통해 왕복한다 — 드라이버가 없거나 붙지 못하면
        # 여기서 끝난다.
        run: |
          for i in $(seq 1 30); do
            if docker compose -f docker/compose.dev.yaml exec -T celery-worker                  celery -A config inspect ping | grep -q pong; then
              echo "worker: pong"; exit 0
            fi
            sleep 3
          done
          echo "worker 가 브로커에 붙지 못했다"
          docker compose -f docker/compose.dev.yaml logs celery-worker | tail -50
          exit 1

      - name: Beat publishes a due task and the worker executes it
        # beat -> 브로커 -> worker 경로 전체를 한 번에 증명한다. 태스크가
        # "succeeded" 로 끝났다는 것은 내부 API 호출까지 통했다는 뜻이다
        # (토큰이 어긋나면 401 로 실패한다).
        run: |
          for i in $(seq 1 40); do
            if docker compose -f docker/compose.dev.yaml logs celery-worker                  | grep -q "core.call_scheduler_tick.*succeeded"; then
              echo "beat -> worker 경로 확인"; exit 0
            fi
            sleep 3
          done
          echo "beat 가 쏜 태스크를 worker 가 실행하지 못했다"
          docker compose -f docker/compose.dev.yaml logs celery-beat | tail -50
          docker compose -f docker/compose.dev.yaml logs celery-worker | tail -50
          exit 1

      - name: Tear down
        if: always()
        run: docker compose -f docker/compose.dev.yaml --profile celery down -v

  # **공개 앱 e2e.** 운영자 e2e 와 나눠 **동시에** 돈다 (#104) — 한 잡이 둘을
  # 이어 돌리면 직렬로 남는 부분(공개 배타 패스 2.8분 + 운영자 6.4분)이 병렬
  # 이득을 먹는다. 나누면 그 둘이 겹친다. 각 잡은 자기에게 필요한 컨테이너만
  # 띄운다 — 운영자 잡은 공개 앱이 뜨기를 기다리지 않아도 된다.
  frontend-e2e-public:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install dependencies from lockfile
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # **타입체크와 빌드는 dev 스택을 띄우기 전에 돌린다.** 순서가 취향이 아니라
      # 필요다: dev compose 의 frontend 서비스는 저장소를 컨테이너에 마운트하고
      # (`..:/app`) `/app/frontend/.next` 를 이름 있는 볼륨으로 가리는데, Docker 가
      # 그 마운트 지점을 **호스트 체크아웃에 root 소유로 만든다**. 그러면 러너
      # 사용자로 도는 `pnpm build` 가 `.next/trace` 를 열지 못해
      # `EACCES: permission denied` 로 죽는다 — 실제로 이 잡을 연속으로 빨간불로
      # 만들었다. 빌드가 먼저 돌면 `.next` 는 러너 것이고, 그 뒤 볼륨이 그것을
      # 가려도 아무도 다시 쓰지 않는다.
      #
      # 부수 효과도 좋다 — 타입 오류가 이미지 빌드를 기다리지 않고 즉시 잡힌다.
      - name: Typecheck (public app)
        working-directory: frontend
        run: pnpm typecheck

      # next build 만 잡는 오류가 있다(라우트 핸들러 시그니처, output: "standalone"
      # 산출물 등). 여기서 안 돌리면 배포 시점까지 미검출로 남는다. 두 앱 다 돈다 —
      # #63부터 두 앱이 각자 standalone 산출물을 만든다.
      - name: Build (public app)
        working-directory: frontend
        run: pnpm build

      - name: Bring up the dev stack
        run: docker compose -f docker/compose.dev.yaml up -d --build frontend

      - name: Wait for the public app to answer
        run: |
          curl --fail --silent --show-error \
               --retry 60 --retry-delay 3 --retry-all-errors --retry-connrefused \
               http://127.0.0.1:53000/healthz

      # 운영자 앱(#63, ADR-0021) — 같은 dev compose 스택에 붙는 두 번째 앱. 한
      # 스위트가 프로젝트 둘로 둘 다 친다(playwright.config.ts) — 이 앱이 뜨지
      # 않으면 그 프로젝트 전체가 실패한다.
      # FE-04/FE-05(#29·#30) SSR 테스트가 `frontend/e2e/lib/seed.ts` 로 호스트에서
      # `uv run manage.py seed_e2e_contests` 를 돌려 실제 Contest 를 dev DB에 심는다
      # (하드코딩 픽스처가 아니라 백엔드가 준 값이어야 SSR 증명이 성립한다 —
      # frontend/e2e/seam.spec.ts 상단 주석). dev compose 의 db 서비스는 호스트
      # 55432(기본값)에 이미 노출돼 있으므로 `cd backend && uv run pytest` 와 같은
      # 경로로 같은 DB에 붙는다.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend dependencies from lockfile
        working-directory: backend
        run: uv sync --locked

      # **스택을 띄운 뒤 워크스페이스 설치를 한 번 되돌린다.** dev compose 의
      # frontend·operator 서비스는 바인드된 체크아웃(`..:/app`) 위에서
      # `pnpm install --force` 를 돌린다 — node_modules 대부분은 이름 있는 볼륨이
      # 가리지만, 러너의 워크스페이스 트리가 그 과정에서 흔들려 `pnpm exec
      # playwright` 가 바이너리를 못 찾는 상태가 된다(실측: 빌드를 앞으로 옮긴
      # 뒤 이 스텝이 `Command "playwright" not found` 로 죽었다).
      #
      # 앞의 설치를 없애고 여기 하나만 두지 않는 이유 — 타입체크와 빌드가 스택
      # **앞에** 있어야 `.next` 가 root 소유로 생기지 않는다(위 주석). 두 번
      # 도는 비용은 pnpm store 가 이미 더워 몇 초다.
      - name: Reinstall workspace dependencies after the stack settled
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e against the running apps
        working-directory: frontend
        env:
          LAURIO_E2E_BASE_URL: http://127.0.0.1:53000
          LAURIO_OPERATOR_E2E_BASE_URL: http://127.0.0.1:53001
        run: pnpm run test:public

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f docker/compose.dev.yaml logs --tail 100

      # playwright.config.ts 가 재시도 시 트레이스를 남긴다. 올리지 않으면 실패한
      # CI 실행에서 그게 그대로 버려져 원인을 못 본다.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7


  # **운영자 앱 e2e.** 위 잡과 동시에 돈다. 여전히 워커 하나로 돈다 —
  # 큐의 전체 건수를 단언하고 「0건」 테스트가 빈 큐를 요구하기 때문이다.
  frontend-e2e-operator:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install dependencies from lockfile
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # **타입체크와 빌드는 dev 스택을 띄우기 전에 돌린다.** 순서가 취향이 아니라
      # 필요다: dev compose 의 frontend 서비스는 저장소를 컨테이너에 마운트하고
      # (`..:/app`) `/app/frontend/.next` 를 이름 있는 볼륨으로 가리는데, Docker 가
      # 그 마운트 지점을 **호스트 체크아웃에 root 소유로 만든다**. 그러면 러너
      # 사용자로 도는 `pnpm build` 가 `.next/trace` 를 열지 못해
      # `EACCES: permission denied` 로 죽는다 — 실제로 이 잡을 연속으로 빨간불로
      # 만들었다. 빌드가 먼저 돌면 `.next` 는 러너 것이고, 그 뒤 볼륨이 그것을
      # 가려도 아무도 다시 쓰지 않는다.
      #
      # 부수 효과도 좋다 — 타입 오류가 이미지 빌드를 기다리지 않고 즉시 잡힌다.
      - name: Typecheck (operator app)
        working-directory: operator
        run: pnpm typecheck

      # next build 만 잡는 오류가 있다(라우트 핸들러 시그니처, output: "standalone"
      # 산출물 등). 여기서 안 돌리면 배포 시점까지 미검출로 남는다. 두 앱 다 돈다 —
      # #63부터 두 앱이 각자 standalone 산출물을 만든다.
      - name: Build (operator app)
        working-directory: operator
        run: pnpm build

      - name: Bring up the dev stack
        run: docker compose -f docker/compose.dev.yaml up -d --build operator

      # 운영자 앱(#63, ADR-0021) — 같은 dev compose 스택에 붙는 두 번째 앱. 한
      # 스위트가 프로젝트 둘로 둘 다 친다(playwright.config.ts) — 이 앱이 뜨지
      # 않으면 그 프로젝트 전체가 실패한다.
      - name: Wait for the operator app to answer
        run: |
          curl --fail --silent --show-error \
               --retry 60 --retry-delay 3 --retry-all-errors --retry-connrefused \
               http://127.0.0.1:53001/healthz

      # FE-04/FE-05(#29·#30) SSR 테스트가 `frontend/e2e/lib/seed.ts` 로 호스트에서
      # `uv run manage.py seed_e2e_contests` 를 돌려 실제 Contest 를 dev DB에 심는다
      # (하드코딩 픽스처가 아니라 백엔드가 준 값이어야 SSR 증명이 성립한다 —
      # frontend/e2e/seam.spec.ts 상단 주석). dev compose 의 db 서비스는 호스트
      # 55432(기본값)에 이미 노출돼 있으므로 `cd backend && uv run pytest` 와 같은
      # 경로로 같은 DB에 붙는다.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend dependencies from lockfile
        working-directory: backend
        run: uv sync --locked

      # **스택을 띄운 뒤 워크스페이스 설치를 한 번 되돌린다.** dev compose 의
      # frontend·operator 서비스는 바인드된 체크아웃(`..:/app`) 위에서
      # `pnpm install --force` 를 돌린다 — node_modules 대부분은 이름 있는 볼륨이
      # 가리지만, 러너의 워크스페이스 트리가 그 과정에서 흔들려 `pnpm exec
      # playwright` 가 바이너리를 못 찾는 상태가 된다(실측: 빌드를 앞으로 옮긴
      # 뒤 이 스텝이 `Command "playwright" not found` 로 죽었다).
      #
      # 앞의 설치를 없애고 여기 하나만 두지 않는 이유 — 타입체크와 빌드가 스택
      # **앞에** 있어야 `.next` 가 root 소유로 생기지 않는다(위 주석). 두 번
      # 도는 비용은 pnpm store 가 이미 더워 몇 초다.
      - name: Reinstall workspace dependencies after the stack settled
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e against the running apps
        working-directory: frontend
        env:
          LAURIO_E2E_BASE_URL: http://127.0.0.1:53000
          LAURIO_OPERATOR_E2E_BASE_URL: http://127.0.0.1:53001
        run: pnpm run test:operator

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f docker/compose.dev.yaml logs --tail 100

      # playwright.config.ts 가 재시도 시 트레이스를 남긴다. 올리지 않으면 실패한
      # CI 실행에서 그게 그대로 버려져 원인을 못 본다.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # 프론트 배포 부팅 가드 (FE-13, #38).
  #
  # ADR-0017은 이 프로젝트의 프론트 테스트 시임을 "실행 중인 Next 앱 하나"로
  # 못박는다. 이 잡이 증명해야 하는 대상은 정반대다 — **앱이 뜨지 않는 것**이
  # 관찰 대상이라, 실행 중인 앱을 치는 시임으로는 원천적으로 닿지 않는다.
  # backend/tests/test_deployment_config.py가 같은 이유로 override_settings를
  # 못 쓰고 subprocess로 `manage.py check`를 직접 실행하는 것과 동일한 예외
  # 사유다. 그래서 여기서는 frontend.Dockerfile의 runner 스테이지(staging/prod가
  # 실제로 배포하는 그 이미지)를 직접 빌드해 컨테이너로 띄우고, 프로세스
  # 종료 코드와 로그를 확인한다.
  #
  # 이 형태를 고른 또 다른 이유: 처음에는 instrumentation.ts의 register()가
  # 단순히 `throw`만 하면 될 줄 알았는데, standalone 산출물(`node server.js`)로
  # 실제 재현해보니 Next가 그 에러를 "unhandledRejection"으로 로그만 찍고
  # 삼켜 HTTP 서버가 계속 듣고 있었다 — 컨테이너는 Up 상태로 남고 모든 요청에
  # 이유 없는 500만 내려줬다. "시끄럽게 실패한다"는 인수조건을 문자 그대로
  # 어기는 조용한 실패였다. 실행 중인 프로세스를 직접 관찰하지 않았다면 이
  # 회귀를 놓쳤을 것이다 — instrumentation.ts가 이제 `process.exit(1)`로
  # 직접 끊는 이유이자, 이 잡이 "빌드가 성공했다"가 아니라 "컨테이너가 실제로
  # 죽는다"를 확인하는 이유다.
  frontend-deploy-guard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the production frontend image (runner stage)
        run: docker build -f docker/frontend.Dockerfile --target runner -t laurio-frontend-runner-ci .

      # 이 레포가 이미 두 번 겪은 사고(CLAUDE.md 「이미 데인 곳」) — .dockerignore
      # 패턴이 파일에 적혀 있다는 것만으로는 증명이 아니다. 가짜 시크릿과 가짜
      # 호스트 node_modules를 실제로 심어서 이미지에 안 들어가는지 직접
      # 확인한다.
      #
      # **경로를 build context 기준으로 정확히 맞춘다**(#70 코드리뷰 지적,
      # 심각). 이 스텝은 저장소 루트에서 `docker build ... .`을 돌리므로
      # frontend.Dockerfile의 `COPY frontend/ ./frontend/`가 시크릿을
      # `/app/frontend/.env`에 놓는다 — `/app/.env`는 애초에 존재할 수 없는
      # 경로라 그 단정은 항상 거짓으로 통과했다(뒤의 재귀 grep만 실질
      # 커버리지였다). node_modules 검증도 이름만 약속하고 실제로는 아무
      # node_modules도 없어(이 잡은 pnpm install을 돌리지 않는다) 아무것도
      # 검증하지 않았다 — 마커 파일을 직접 만들어 넣는다.
      - name: .dockerignore actually keeps secrets and host node_modules out of the image
        run: |
          set -euo pipefail
          echo "OPENAI_API_KEY=sk-ci-guard-fake-secret-do-not-leak" > frontend/.env
          mkdir -p frontend/node_modules/.ci-guard-marker
          echo "host-node-modules-should-not-leak-into-image" > frontend/node_modules/.ci-guard-marker/marker.txt
          docker build -f docker/frontend.Dockerfile --target builder -t laurio-frontend-builder-ci-guard .
          docker run --rm --entrypoint sh laurio-frontend-builder-ci-guard -c '
            set -e
            if [ -f /app/frontend/.env ]; then
              echo "FOUND /app/frontend/.env — .dockerignore가 시크릿을 막지 못했다" >&2
              exit 1
            fi
            if [ -d /app/frontend/node_modules/.ci-guard-marker ]; then
              echo "FOUND /app/frontend/node_modules/.ci-guard-marker — .dockerignore가 호스트 node_modules를 막지 못했다" >&2
              exit 1
            fi
            if grep -rl "sk-ci-guard-fake-secret\|host-node-modules-should-not-leak-into-image" /app > /dev/null 2>&1; then
              echo "가짜 시크릿 또는 host node_modules 마커가 이미지 어딘가에 들어갔다" >&2
              exit 1
            fi
            echo "confirmed: .env and host node_modules excluded from the image"
          '
          rm -f frontend/.env
          rm -rf frontend/node_modules/.ci-guard-marker
          docker rmi laurio-frontend-builder-ci-guard

      - name: Refuses to boot in production with missing config (and actually exits — not just logs)
        run: |
          set +e
          output=$(timeout 20 docker run --rm -e LAURIO_DEPLOYMENT_TARGET=production laurio-frontend-runner-ci 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
            echo "::error::LAURIO_WEB_ORIGIN/LAURIO_API_BASE_URL 없이도 컨테이너가 죽지 않았다(status=$status) — 부팅 가드가 깨졌다"
            exit 1
          fi
          echo "$output" | grep -q "LAURIO_WEB_ORIGIN" || { echo "::error::에러 메시지에 원인(LAURIO_WEB_ORIGIN)이 안 남는다"; exit 1; }
          echo "$output" | grep -q "LAURIO_API_BASE_URL" || { echo "::error::에러 메시지에 원인(LAURIO_API_BASE_URL)이 안 남는다"; exit 1; }

      - name: Refuses to boot in staging with only one required value missing
        run: |
          set +e
          output=$(timeout 20 docker run --rm \
            -e LAURIO_DEPLOYMENT_TARGET=staging \
            -e LAURIO_WEB_ORIGIN=https://staging.laurio.example \
            laurio-frontend-runner-ci 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
            echo "::error::LAURIO_API_BASE_URL 없이도 staging 컨테이너가 죽지 않았다(status=$status)"
            exit 1
          fi
          echo "$output" | grep -q "LAURIO_API_BASE_URL" || { echo "::error::에러 메시지에 원인이 안 남는다"; exit 1; }

      # #95/#96 — 카카오 OAuth 앱 자격증명도 같은 부팅 가드 대상이다
      # (instrumentation.ts REQUIRED_IN_DEPLOYED_ENVIRONMENTS). LAURIO_WEB_ORIGIN/
      # LAURIO_API_BASE_URL은 채우고 카카오 자격증명만 비워 — 이 값들만으로도
      # 독립적으로 부팅이 거부되는지 확인한다.
      - name: Refuses to boot in production without kakao oauth credentials
        run: |
          set +e
          output=$(timeout 20 docker run --rm \
            -e LAURIO_DEPLOYMENT_TARGET=production \
            -e LAURIO_WEB_ORIGIN=https://laurio.example \
            -e LAURIO_API_BASE_URL=http://127.0.0.1:1 \
            laurio-frontend-runner-ci 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
            echo "::error::카카오 자격증명 없이도 컨테이너가 죽지 않았다(status=$status) — 부팅 가드가 깨졌다"
            exit 1
          fi
          echo "$output" | grep -q "KAKAO_REST_API_KEY" || { echo "::error::에러 메시지에 원인(KAKAO_REST_API_KEY)이 안 남는다"; exit 1; }
          echo "$output" | grep -q "KAKAO_SECRET_KEY" || { echo "::error::에러 메시지에 원인(KAKAO_SECRET_KEY)이 안 남는다"; exit 1; }
          echo "$output" | grep -q "KAKAO_REDIRECT_URI" || { echo "::error::에러 메시지에 원인(KAKAO_REDIRECT_URI)이 안 남는다"; exit 1; }

      # #115 — 토스 결제창 클라이언트 키(NEXT_PUBLIC_TOSS_CLIENT_KEY)가 빌드타임에
      # 비어 있으면 배포 환경에서 부팅 자체를 거부하는지 확인한다. 다른 필수값은
      # 전부 채워 이 값 하나만으로 독립적으로 죽는지를 본다. laurio-frontend-runner-ci
      # 는 build.args 없이(빈 문자열로) 지었으므로 이 시나리오 그대로다.
      - name: Refuses to boot in production without a toss client key baked in
        run: |
          set +e
          output=$(timeout 20 docker run --rm \
            -e LAURIO_DEPLOYMENT_TARGET=production \
            -e LAURIO_WEB_ORIGIN=https://laurio.example \
            -e LAURIO_API_BASE_URL=http://127.0.0.1:1 \
            -e KAKAO_REST_API_KEY=ci-guard-only-kakao-rest-api-key \
            -e KAKAO_SECRET_KEY=ci-guard-only-kakao-secret-key \
            -e KAKAO_REDIRECT_URI=https://laurio.example/api/auth/social/kakao/callback \
            laurio-frontend-runner-ci 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
            echo "::error::토스 클라이언트 키 없이도 컨테이너가 죽지 않았다(status=$status) — 부팅 가드가 깨졌다"
            exit 1
          fi
          echo "$output" | grep -q "NEXT_PUBLIC_TOSS_CLIENT_KEY" || { echo "::error::에러 메시지에 원인(NEXT_PUBLIC_TOSS_CLIENT_KEY)이 안 남는다"; exit 1; }

      # #115 코드리뷰 지적 -- 이 값을 검증하겠다고 프로덕션 이미지를 두 번(빌드
      # 인자 있이/없이) 굽지 않는다. pnpm build 가 다시 도는 두 번째 빌드는
      # CI 시간을 그대로 배로 늘리는데, 이 부팅 가드가 실제로 읽는 것은 컨테이너의
      # 런타임 env이지 브라우저 번들에 인라인된 값이 아니다(위에서 직접 측정해
      # 확인한 사실 -- instrumentation.ts는 Next의 컴파일 그래프 밖에서 돈다).
      # 그러니 KAKAO_*와 같은 방식으로 같은 이미지에 -e만 다르게 줘서 런타임
      # env가 있을 때/없을 때 두 경우를 구분하면 충분하다 -- 이 스텝이 검증하는
      # 건 부팅 가드가 이 이름의 env를 보고 옳게 판단하는가이지, 이 특정 빌드가
      # 브라우저 번들에 값을 구웠는가가 아니다(후자는 docker/frontend.Dockerfile의
      # ARG/ENV 선언이 전담하고, 이미 로컬에서 직접 --build-arg로 지어 확인했다
      # -- 구조가 단순해 회귀 위험이 낮다).
      - name: Boots with a complete production config and forces Secure cookies
        run: |
          set -euo pipefail
          docker run -d --name frontend-boot-ok \
            -e LAURIO_DEPLOYMENT_TARGET=production \
            -e LAURIO_WEB_ORIGIN=https://laurio.example \
            -e LAURIO_API_BASE_URL=http://127.0.0.1:1 \
            -e KAKAO_REST_API_KEY=ci-guard-only-kakao-rest-api-key \
            -e KAKAO_SECRET_KEY=ci-guard-only-kakao-secret-key \
            -e KAKAO_REDIRECT_URI=https://laurio.example/api/auth/social/kakao/callback \
            -e NEXT_PUBLIC_TOSS_CLIENT_KEY=ci-guard-only-toss-client-key \
            -p 3100:3000 \
            laurio-frontend-runner-ci

          # 백엔드가 없어 /healthz 는 503(degraded)이 정상이다 — 여기서 보는 건
          # "완전한 설정에서는 프론트가 죽지 않고 응답한다"는 것뿐이다. 연결
          # 자체가 안 되면(000) 컨테이너가 여전히 안 뜬 것이다.
          #
          # **`|| true` 가 없으면 재시도 루프가 한 번도 돌지 않는다.** `set -e`
          # 아래에서 `status=$(curl ...)` 는 대입문의 종료 코드가 curl 의 것이라,
          # 첫 시도가 실패하는 순간 셸이 그 자리에서 죽는다 — 컨테이너가 정상
          # 부팅 중이어도 빨간불이 되고, 스텝은 curl 자신의 종료 코드(연결 실패 7,
          # 수신 실패 56)로 끝난다. 실제로 그렇게 15회 연속 실패했다. 아래 주석이
          # 경계하는 "000000" 문제는 `|| echo "000"` 이 출력을 하나 더 얹기 때문에
          # 생기는 것이라, 출력을 얹지 않는 `|| true` 에는 없다.
          #
          # **`|| echo "000"`을 쓰지 않는다**(#70 코드리뷰 지적, 심각). curl은
          # `-w`가 있으면 연결 실패 시에도 스스로 "000"을 쓰고 비정상 종료
          # 코드로 끝낸다 — 그 위에 `|| echo "000"`을 얹으면 실패할 때마다
          # "000"이 두 번(curl 자신 + echo) 이어져 "000000"이 되고, 그 값은
          # 아래 `[ "$status" = "000" ]` 비교와 절대 같아지지 않아 **재시도
          # 루프가 첫 시도에 곧장 break한다** — 컨테이너가 정상 부팅 중이어도
          # 빨간불이 되고, "완전한 설정에서는 죽지 않는다"는 이 스텝의 관측
          # 자체가 수행되지 않는다. curl 자신의 "000" 출력만 남기고, 그래도
          # 정말 비어 있는 극단적인 경우를 위한 방어로 `${status:-000}`만 쓴다.
          status="000"
          for _ in $(seq 1 20); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3100/healthz 2>/dev/null || true)
            status="${status:-000}"
            [ "$status" = "000" ] || break
            sleep 1
          done
          echo "healthz status: $status"
          if [ "$status" != "200" ] && [ "$status" != "503" ]; then
            echo "::error::완전한 프로덕션 설정인데도 컨테이너가 응답하지 않는다(status=$status)"
            docker logs frontend-boot-ok
            exit 1
          fi

          # ADR-0016 성립 조건 — production에서 쿠키의 Secure가 실제로 켜지는지.
          # frontend/app/api/auth/logout/route.ts는 access 쿠키가 없으면 백엔드를
          # 부르지 않고 곧바로 clearSessionCookies를 실어 응답한다 — 그래서 백엔드
          # 없이도 이 경로 하나로 쿠키 속성을 직접 관찰할 수 있다.
          set_cookie=$(curl -s -D - -o /dev/null -X POST http://127.0.0.1:3100/api/auth/logout \
            -H "Origin: https://laurio.example")
          echo "$set_cookie"
          echo "$set_cookie" | grep -qi "laurio_access=.*Secure" \
            || { echo "::error::production인데 laurio_access 쿠키에 Secure가 없다"; exit 1; }
          echo "$set_cookie" | grep -qi "laurio_refresh=.*Secure" \
            || { echo "::error::production인데 laurio_refresh 쿠키에 Secure가 없다"; exit 1; }

          docker rm -f frontend-boot-ok

      - name: Dump container state on failure
        if: failure()
        run: docker ps -a

  # 운영자 앱 배포 부팅 가드 (#70 — #63가 미룬 것을 여기서 켠다).
  #
  # frontend-deploy-guard와 정확히 같은 이유·같은 형태다: ADR-0021의 프론트 테스트
  # 시임("실행 중인 앱 하나")으로는 "앱이 뜨지 않는 것" 자체를 증명할 수 없다.
  # operator.Dockerfile의 runner 스테이지(staging/prod가 실제로 배포하는 그
  # 이미지)를 직접 빌드해 컨테이너로 띄우고, 프로세스 종료 코드와 로그를 확인한다.
  #
  # operator/instrumentation.ts도 frontend와 같은 함정을 피해 process.exit(1)로
  # 직접 프로세스를 끊는다(#38에서 이미 확인된 "Next가 throw를 삼킨다"는 사실이
  # 이 앱에도 그대로 적용된다) — 이 잡은 그게 실제로 그런지 직접 관찰한다.
  operator-deploy-guard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the production operator image (runner stage)
        run: docker build -f docker/operator.Dockerfile --target runner -t laurio-operator-runner-ci .

      # frontend-deploy-guard와 같은 이유 — .dockerignore가 시크릿과 호스트
      # node_modules를 실제로 막는지 이 앱에서도 직접 확인한다.
      #
      # **경로를 build context 기준으로 정확히 맞춘다**(#70 코드리뷰 지적,
      # 심각). 이 스텝은 저장소 루트에서 `docker build ... .`을 돌리므로
      # operator.Dockerfile의 `COPY operator/ ./operator/`가 시크릿을
      # `/app/operator/.env`에 놓는다 — `/app/.env`는 애초에 존재할 수 없는
      # 경로라 그 단정은 항상 거짓으로 통과했다. node_modules 검증도 이름만
      # 약속하고 실제로는 아무 node_modules도 없어(이 잡은 pnpm install을
      # 돌리지 않는다) 아무것도 검증하지 않았다 — 마커 파일을 직접 만들어
      # 넣는다.
      - name: .dockerignore actually keeps secrets and host node_modules out of the image
        run: |
          set -euo pipefail
          echo "OPENAI_API_KEY=sk-ci-guard-fake-secret-do-not-leak" > operator/.env
          mkdir -p operator/node_modules/.ci-guard-marker
          echo "host-node-modules-should-not-leak-into-image" > operator/node_modules/.ci-guard-marker/marker.txt
          docker build -f docker/operator.Dockerfile --target builder -t laurio-operator-builder-ci-guard .
          docker run --rm --entrypoint sh laurio-operator-builder-ci-guard -c '
            set -e
            if [ -f /app/operator/.env ]; then
              echo "FOUND /app/operator/.env — .dockerignore가 시크릿을 막지 못했다" >&2
              exit 1
            fi
            if [ -d /app/operator/node_modules/.ci-guard-marker ]; then
              echo "FOUND /app/operator/node_modules/.ci-guard-marker — .dockerignore가 호스트 node_modules를 막지 못했다" >&2
              exit 1
            fi
            if grep -rl "sk-ci-guard-fake-secret\|host-node-modules-should-not-leak-into-image" /app > /dev/null 2>&1; then
              echo "가짜 시크릿 또는 host node_modules 마커가 이미지 어딘가에 들어갔다" >&2
              exit 1
            fi
            echo "confirmed: .env and host node_modules excluded from the image"
          '
          rm -f operator/.env
          rm -rf operator/node_modules/.ci-guard-marker
          docker rmi laurio-operator-builder-ci-guard

      - name: Refuses to boot in production with missing config (and actually exits — not just logs)
        run: |
          set +e
          output=$(timeout 20 docker run --rm -e LAURIO_DEPLOYMENT_TARGET=production laurio-operator-runner-ci 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
            echo "::error::LAURIO_OPERATOR_ORIGIN/LAURIO_API_BASE_URL 없이도 컨테이너가 죽지 않았다(status=$status) — 부팅 가드가 깨졌다"
            exit 1
          fi
          echo "$output" | grep -q "LAURIO_OPERATOR_ORIGIN" || { echo "::error::에러 메시지에 원인(LAURIO_OPERATOR_ORIGIN)이 안 남는다"; exit 1; }
          echo "$output" | grep -q "LAURIO_API_BASE_URL" || { echo "::error::에러 메시지에 원인(LAURIO_API_BASE_URL)이 안 남는다"; exit 1; }

      - name: Refuses to boot in staging with only one required value missing
        run: |
          set +e
          output=$(timeout 20 docker run --rm \
            -e LAURIO_DEPLOYMENT_TARGET=staging \
            -e LAURIO_OPERATOR_ORIGIN=https://operator.staging.laurio.example \
            laurio-operator-runner-ci 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
            echo "::error::LAURIO_API_BASE_URL 없이도 staging 컨테이너가 죽지 않았다(status=$status)"
            exit 1
          fi
          echo "$output" | grep -q "LAURIO_API_BASE_URL" || { echo "::error::에러 메시지에 원인이 안 남는다"; exit 1; }

      - name: Boots with a complete production config and forces Secure cookies
        run: |
          set -euo pipefail
          docker run -d --name operator-boot-ok \
            -e LAURIO_DEPLOYMENT_TARGET=production \
            -e LAURIO_OPERATOR_ORIGIN=https://operator.laurio.example \
            -e LAURIO_API_BASE_URL=http://127.0.0.1:1 \
            -p 3101:3000 \
            laurio-operator-runner-ci

          # 백엔드가 없어 /healthz 는 503(degraded)이 정상이다 — 여기서 보는 건
          # "완전한 설정에서는 운영자 앱이 죽지 않고 응답한다"는 것뿐이다. 연결
          # 자체가 안 되면(000) 컨테이너가 여전히 안 뜬 것이다.
          #
          # **`|| true` 가 없으면 재시도 루프가 한 번도 돌지 않는다.** `set -e`
          # 아래에서 `status=$(curl ...)` 는 대입문의 종료 코드가 curl 의 것이라,
          # 첫 시도가 실패하는 순간 셸이 그 자리에서 죽는다 — 컨테이너가 정상
          # 부팅 중이어도 빨간불이 되고, 스텝은 curl 자신의 종료 코드(연결 실패 7,
          # 수신 실패 56)로 끝난다. 실제로 그렇게 15회 연속 실패했다. 아래 주석이
          # 경계하는 "000000" 문제는 `|| echo "000"` 이 출력을 하나 더 얹기 때문에
          # 생기는 것이라, 출력을 얹지 않는 `|| true` 에는 없다.
          #
          # frontend-deploy-guard와 같은 이유로 `|| echo "000"`을 쓰지 않는다
          # (#70 코드리뷰 지적, 심각 — 여기서 그대로 복사된 버그였다). curl은
          # `-w`가 있으면 연결 실패 시에도 스스로 "000"을 쓴다 — `|| echo
          # "000"`을 얹으면 "000000"이 되어 재시도 루프가 첫 시도에 곧장
          # break한다.
          status="000"
          for _ in $(seq 1 20); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3101/healthz 2>/dev/null || true)
            status="${status:-000}"
            [ "$status" = "000" ] || break
            sleep 1
          done
          echo "healthz status: $status"
          if [ "$status" != "200" ] && [ "$status" != "503" ]; then
            echo "::error::완전한 프로덕션 설정인데도 컨테이너가 응답하지 않는다(status=$status)"
            docker logs operator-boot-ok
            exit 1
          fi

          # ADR-0016/0019 성립 조건 — production에서 세션 쿠키의 Secure가 실제로
          # 켜지는지. operator/app/api/auth/logout/route.ts는 세션 쿠키가 없으면
          # 백엔드를 부르지 않고 곧바로 clearSessionCookie를 실어 응답한다 — 그래서
          # 백엔드 없이도 이 경로 하나로 쿠키 속성을 직접 관찰할 수 있다.
          set_cookie=$(curl -s -D - -o /dev/null -X POST http://127.0.0.1:3101/api/auth/logout \
            -H "Origin: https://operator.laurio.example")
          echo "$set_cookie"
          echo "$set_cookie" | grep -qi "laurio_operator_session=.*Secure" \
            || { echo "::error::production인데 laurio_operator_session 쿠키에 Secure가 없다"; exit 1; }

          docker rm -f operator-boot-ok

      - name: Dump container state on failure
        if: failure()
        run: docker ps -a
