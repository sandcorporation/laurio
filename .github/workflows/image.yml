# 배포 이미지(#938, ADR-0077): main 의 커밋마다 여섯 이미지를 GitHub 호스팅 arm64 실행기에서 네이티브로 굽고 ghcr 에 올린다.
# main push 에서는 release.yml 이 검사(PR 검사와 같은 pr-check.yml)와 나란히 workflow_call 로 부른다. 여섯이 모두 오르면
# release.yml 이 production 을 이 sha 로 승격하고, Jenkins `codemit/deploy` 는 production 머리의 이미지를 받아(jenkins-shared
# sandcorpDeploy deployFrom) oracle 에 배포한다 — 그 전에는 Jenkins 빌드 노드가 `scripts/ci/build-images.sh` 로 구웠다.
#
# 이미지마다 잡 하나(matrix, fail-fast: false). 굽는 일은 Jenkins 때와 같은 스크립트가 한다 — 이름·태그·라벨·캐시가 그대로다:
#   1. `images.sh arm64`(CODEMIT_IMAGES_SERVICES=<서비스>)  문맥 해시(image_context.py)의 `ctx-<해시>-arm64` 가 있으면 굽지
#      않고 커밋 태그만 더한다. 없으면 굽는다 — `ghcr.io/sandcorporation/codemit-<서비스>:<sha>-arm64`, provenance 없음,
#      라벨 `org.opencontainers.image.source`, 캐시 `codemit-buildcache:<서비스>-arm64`(레지스트리, mode=max).
#   2. 부팅 가드(`deploy-guard.sh`) — 세 앱 중 이번에 구운 것만. arm64 실행기라 prod 이미지를 그대로 띄운다.
#   3. `images-ctx.sh` — 1·2 가 초록이면 구운 것에 ctx 태그.
#   4. `<sha>` 태그 — 같은 매니페스트에 접미사 없는 커밋 태그를 하나 더. jenkins-shared 의 waitForGhcrImage 가
#      `<repo>:<sha>` 를 기다리기 때문이다. oracle 의 compose 는 여전히 `<sha>-arm64` 를 받는다.
#
# 보안 규칙(공개 저장소):
#   - release.yml(workflow_call)과 수동 실행만. pull_request·pull_request_target 으로 이미지를 굽거나 올리지 않는다.
#   - packages: write 는 이 워크플로(release.yml 의 image 잡)에만. 로그인은 GITHUB_TOKEN 하나, 다른 secrets 없음.
#   - self-hosted·QEMU 없음. 액션은 SHA 고정. 빌드 인자는 없다(공개 값은 실행 env — ADR-0062). 로그는 공개다.
name: image

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 같은 목록이 scripts/ci/image_context.py 의 SERVICES 와 Jenkinsfile 의 images 에 있다(시험이 셋을 견준다).
        service: [backend, frontend, operator, classroom, search, pgbouncer]
    env:
      CODEMIT_IMAGES_SERVICES: ${{ matrix.service }}
      CODEMIT_IMAGES_PARALLEL: "0"
      SHA: ${{ github.sha }}
      REPO: ghcr.io/sandcorporation/codemit-${{ matrix.service }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: 굽기 또는 건너뛰기(images.sh)
        run: bash scripts/ci/images.sh arm64
      - name: 부팅 가드(이번에 구운 앱만)
        if: contains(fromJSON('["frontend","operator","classroom"]'), matrix.service)
        run: |
          if grep -qx "${{ matrix.service }}=built" .images-arm64.result; then
            CODEMIT_GUARD_ARCH=arm64 bash scripts/ci/deploy-guard.sh "${{ matrix.service }}"
          else
            echo "건너뛴 이미지 — 같은 문맥이 이미 가드를 지났다"
          fi
      - name: ctx 태그
        run: bash scripts/ci/images-ctx.sh .images-arm64.ctx
      - name: 커밋 태그(접미사 없음, 승격 기다림용)
        run: docker buildx imagetools create --prefer-index=false --tag "$REPO:$SHA" "$REPO:$SHA-arm64"
      - name: 실패 로그
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: images-${{ matrix.service }}
          path: test-results/images-arm64/
          if-no-files-found: ignore
